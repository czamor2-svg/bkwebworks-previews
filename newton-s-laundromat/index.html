<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ $json.name }} – Fresh. Fast. Easy.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #4FC3F7;
    --aqua: #E0F7FA;
    --navy: #0D47A1;
    --navy-light: #1565C0;
    --white: #FFFFFF;
    --soft-gray: #F8FFFE;
    --text-body: #37474F;
    --shadow: 0 8px 32px rgba(13,71,161,0.10);
    --shadow-hover: 0 16px 48px rgba(13,71,161,0.18);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--text-body);
    background: var(--white);
    overflow-x: hidden;
  }

  h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

  /* ===================== HERO ===================== */
  #hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #E0F7FA 0%, #B2EBF2 35%, #4FC3F7 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    padding: 40px 20px 60px;
    text-align: center;
  }

  /* Background decorative circles */
  #hero::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 340px; height: 340px;
    background: rgba(255,255,255,0.18);
    border-radius: 50%;
    pointer-events: none;
  }
  #hero::after {
    content: '';
    position: absolute;
    bottom: -100px; left: -60px;
    width: 260px; height: 260px;
    background: rgba(255,255,255,0.14);
    border-radius: 50%;
    pointer-events: none;
  }

  /* ---- Washing Machine CSS Art ---- */
  .machine-wrap {
    position: relative;
    width: 200px;
    height: 220px;
    margin: 0 auto 36px;
    flex-shrink: 0;
  }

  .machine-body {
    width: 200px;
    height: 210px;
    background: linear-gradient(145deg, #FFFFFF 60%, #E3F2FD 100%);
    border-radius: 24px;
    position: absolute;
    bottom: 0; left: 0;
    box-shadow: 0 12px 40px rgba(13,71,161,0.18), inset 0 2px 8px rgba(255,255,255,0.9);
    border: 3px solid rgba(79,195,247,0.4);
  }

  /* Control panel top strip */
  .machine-panel {
    position: absolute;
    top: 14px; left: 16px; right: 16px;
    height: 28px;
    background: linear-gradient(90deg, #4FC3F7 0%, #29B6F6 100%);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 10px;
    gap: 7px;
  }
  .panel-dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
  }
  .panel-dot.green { background: #A5D6A7; }

  /* Drum porthole */
  .drum-outer {
    position: absolute;
    top: 52px;
    left: 50%;
    transform: translateX(-50%);
    width: 124px; height: 124px;
    border-radius: 50%;
    background: linear-gradient(145deg, #B3E5FC 0%, #4FC3F7 100%);
    box-shadow: 0 4px 18px rgba(13,71,161,0.2), inset 0 3px 10px rgba(255,255,255,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 4px solid rgba(79,195,247,0.5);
  }

  .drum-ring {
    width: 108px; height: 108px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .drum-inner {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0277BD 0%, #01579B 100%);
    animation: spin 3s linear infinite;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Clothes shapes inside drum */
  .drum-inner::before {
    content: '';
    position: absolute;
    width: 52px; height: 30px;
    background: rgba(255,255,255,0.22);
    border-radius: 50%;
    top: 18px; left: 12px;
  }
  .drum-inner::after {
    content: '';
    position: absolute;
    width: 36px; height: 22px;
    background: rgba(255,255,255,0.15);
    border-radius: 50%;
    bottom: 14px; right: 8px;
  }

  .drum-vane {
    position: absolute;
    width: 6px; height: 32px;
    background: rgba(255,255,255,0.25);
    border-radius: 3px;
  }
  .drum-vane:nth-child(1) { transform: rotate(0deg) translateY(-24px); }
  .drum-vane:nth-child(2) { transform: rotate(120deg) translateY(-24px); }
  .drum-vane:nth-child(3) { transform: rotate(240deg) translateY(-24px); }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* Door handle */
  .drum-handle {
    position: absolute;
    right: 16px; top: 50%;
    transform: translateY(-50%);
    width: 8px; height: 30px;
    background: #4FC3F7;
    border-radius: 4px;
  }

  /* Bottom detail */
  .machine-bottom {
    position: absolute;
    bottom: 16px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
  }
  .machine-dial {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, #E0F7FA, #B2EBF2);
    border: 2px solid rgba(79,195,247,0.5);
  }
  .machine-dial.active {
    background: linear-gradient(135deg, #4FC3F7, #29B6F6);
  }

  /* ---- Bubbles ---- */
  .bubbles {
    position: absolute;
    bottom: 0; left: 0; right: 0; top: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    border: 1.5px solid rgba(255,255,255,0.8);
    animation: floatUp linear infinite;
  }
  .bubble:nth-child(1)  { width:14px; height:14px; left:12%;  bottom:-20px; animation-duration:5.2s; animation-delay:0s;   }
  .bubble:nth-child(2)  { width:8px;  height:8px;  left:22%;  bottom:-20px; animation-duration:4.5s; animation-delay:0.8s; }
  .bubble:nth-child(3)  { width:18px; height:18px; left:38%;  bottom:-20px; animation-duration:6.1s; animation-delay:1.5s; }
  .bubble:nth-child(4)  { width:10px; height:10px; left:55%;  bottom:-20px; animation-duration:4.9s; animation-delay:0.3s; }
  .bubble:nth-child(5)  { width:12px; height:12px; left:68%;  bottom:-20px; animation-duration:5.7s; animation-delay:1.1s; }
  .bubble:nth-child(6)  { width:7px;  height:7px;  left:80%;  bottom:-20px; animation-duration:4.2s; animation-delay:2s;   }
  .bubble:nth-child(7)  { width:16px; height:16px; left:5%;   bottom:-20px; animation-duration:6.5s; animation-delay:0.5s; }
  .bubble:nth-child(8)  { width:9px;  height:9px;  left:90%;  bottom:-20px; animation-duration:5s;   animation-delay:1.8s; }
  .bubble:nth-child(9)  { width:13px; height:13px; left:45%;  bottom:-20px; animation-duration:5.5s; animation-delay:2.5s; }
  .bubble:nth-child(10) { width:6px;  height:6px;  left:72%;  bottom:-20px; animation-duration:4.0s; animation-delay:0.2s; }

  @keyframes floatUp {
    0%   { transform: translateY(0) scale(1);    opacity: 0; }
    10%  { opacity: 0.8; }
    90%  { opacity: 0.4; }
    100% { transform: translateY(-110vh) scale(0.7); opacity: 0; }
  }

  /* ---- Hero text ---- */
  .hero-content { position: relative; z-index: 2; }

  .hero-headline {
    font-size: clamp(2.6rem, 8vw, 4.8rem);
    font-weight: 900;
    color: var(--navy);
    line-height: 1.1;
    letter-spacing: -1px;
    margin-bottom: 14px;
    text-shadow: 0 2px 12px rgba(255,255,255,0.6);
  }

  .hero-sub {
    font-size: clamp(1.05rem, 3.5vw, 1.35rem);
    font-weight: 500;
    color: var(--navy-light);
    margin-bottom: 36px;
    opacity: 0.9;
  }

  .hero-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 16px 32px;
    border-radius: 60px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1.05rem;
    text-decoration: none;
    transition: transform 0.22s, box-shadow 0.22s;
    cursor: pointer;
    border: none;
  }
  .btn:hover { transform: translateY(-3px); box-shadow: 0 14px 36px rgba(13,71,161,0.22); }
  .btn:active { transform: translateY(0); }

  .btn-primary {
    background: var(--navy);
    color: var(--white);
    box-shadow: 0 6px 24px rgba(13,71,161,0.28);
  }
  .btn-secondary {
    background: var(--white);
    color: var(--navy);
    box-shadow: 0 6px 24px rgba(13,71,161,0.14);
  }

  /* scroll hint */
  .scroll-hint {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--navy-light);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.05em;
    opacity: 0.7;
    animation: bounce 2s ease-in-out infinite;
    z-index: 2;
  }
  .scroll-hint span { font-size: 1.3rem; }
  @keyframes bounce {
    0%,100% { transform: translateX(-50%) translateY(0); }
    50%      { transform: translateX(-50%) translateY(8px); }
  }

  /* ===================== SECTION BASE ===================== */
  section { padding: 80px 20px; }

  .section-inner {
    max-width: 900px;
    margin: 0 auto;
  }

  .section-tag {
    display: inline-block;
    background: var(--aqua);
    color: var(--navy);
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 0.75rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 40px;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: clamp(1.8rem, 5vw, 2.8rem);
    font-weight: 800;
    color: var(--navy);
    line-height: 1.2;
    margin-bottom: 14px;
  }

  .section-desc {
    font-size: 1.05rem;
    color: var(--text-body);
    opacity: 0.85;
    max-width: 560px;
    line-height: 1.7;
  }

  /* Fade-in scroll animation */
  .fade-in {
    opacity: 0;
    transform: translateY(30px);
    transition: opacity 0.65s ease, transform 0.65s ease;
  }

    opacity:
