<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ $json.name }} – Fresh. Fast. Easy.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #4FC3F7;
    --aqua: #E0F7FA;
    --aqua-mid: #B2EBF2;
    --navy: #0D47A1;
    --navy-light: #1565C0;
    --white: #FFFFFF;
    --text: #1A237E;
    --soft: #F0FBFF;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--text);
    background: var(--white);
    overflow-x: hidden;
  }

  h1, h2, h3 { font-family: 'Poppins', sans-serif; }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #E0F7FA 0%, #B2EBF2 40%, #81D4FA 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem 3rem;
    position: relative;
    overflow: hidden;
  }

  /* Background blobs */
  .hero::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(255,255,255,0.35) 0%, transparent 70%);
    top: -150px; left: -150px;
    border-radius: 50%;
    pointer-events: none;
  }
  .hero::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(79,195,247,0.2) 0%, transparent 70%);
    bottom: -100px; right: -100px;
    border-radius: 50%;
    pointer-events: none;
  }

  /* ── WASHING MACHINE ILLUSTRATION ── */
  .washer-wrap {
    position: relative;
    width: 180px;
    height: 210px;
    margin: 0 auto 2.5rem;
    filter: drop-shadow(0 20px 40px rgba(13,71,161,0.18));
  }

  /* Machine body */
  .washer-body {
    position: absolute;
    bottom: 0;
    width: 180px;
    height: 200px;
    background: linear-gradient(160deg, #FFFFFF 0%, #E3F2FD 100%);
    border-radius: 22px;
    border: 3px solid rgba(79,195,247,0.5);
    box-shadow: inset 0 2px 8px rgba(255,255,255,0.8), 0 8px 32px rgba(13,71,161,0.12);
  }

  /* Top panel */
  .washer-panel {
    position: absolute;
    top: 10px; left: 12px; right: 12px;
    height: 30px;
    background: linear-gradient(90deg, #B2EBF2, #81D4FA);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 10px;
    gap: 6px;
  }
  .washer-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--white);
    opacity: 0.9;
  }
  .washer-dot:first-child { background: #4FC3F7; }
  .washer-dot:nth-child(2) { background: #29B6F6; }

  /* Door ring */
  .washer-door-ring {
    position: absolute;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, #B2EBF2 0%, #4FC3F7 100%);
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 4px 16px rgba(13,71,161,0.2), inset 0 2px 6px rgba(255,255,255,0.5);
    border: 4px solid rgba(255,255,255,0.7);
  }

  /* Drum (spinning) */
  .washer-drum {
    position: absolute;
    width: 100px; height: 100px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0D47A1 0%, #1976D2 50%, #42A5F5 100%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    animation: spin-drum 3s linear infinite;
    overflow: hidden;
  }
  @keyframes spin-drum {
    from { transform: translate(-50%, -50%) rotate(0deg); }
    to   { transform: translate(-50%, -50%) rotate(360deg); }
  }

  /* Drum holes */
  .drum-hole {
    position: absolute;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.3);
  }
  .drum-hole:nth-child(1) { top: 12px; left: 42px; }
  .drum-hole:nth-child(2) { top: 42px; right: 10px; }
  .drum-hole:nth-child(3) { bottom: 12px; left: 42px; }
  .drum-hole:nth-child(4) { top: 42px; left: 10px; }
  .drum-hole:nth-child(5) { top: 22px; left: 22px; }
  .drum-hole:nth-child(6) { top: 22px; right: 22px; }
  .drum-hole:nth-child(7) { bottom: 22px; left: 22px; }
  .drum-hole:nth-child(8) { bottom: 22px; right: 22px; }

  /* Drum clothes suggestion — abstract fabric shapes */
  .drum-clothes {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
  }
  .cloth {
    position: absolute;
    border-radius: 40% 60% 60% 40% / 50% 50% 50% 50%;
    opacity: 0.55;
  }
  .cloth-1 { width: 50px; height: 30px; background: #FFFFFF; top: 15px; left: 8px; }
  .cloth-2 { width: 40px; height: 25px; background: #B2EBF2; bottom: 15px; right: 8px; }
  .cloth-3 { width: 35px; height: 20px; background: #E0F7FA; top: 35px; right: 5px; }

  /* Drum water shimmer */
  .drum-water {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 45%;
    background: linear-gradient(180deg, transparent 0%, rgba(79,195,247,0.4) 100%);
    border-radius: 0 0 50% 50%;
    animation: water-slosh 2s ease-in-out infinite alternate;
  }
  @keyframes water-slosh {
    from { transform: scaleX(0.9) translateX(-5%); }
    to   { transform: scaleX(1.1) translateX(5%); }
  }

  /* Handle */
  .washer-handle {
    position: absolute;
    right: -4px;
    top: 50%; transform: translateY(-50%);
    width: 10px; height: 36px;
    background: linear-gradient(180deg, #B2EBF2, #4FC3F7);
    border-radius: 0 8px 8px 0;
    border: 2px solid rgba(255,255,255,0.5);
  }

  /* Bottom strip */
  .washer-bottom {
    position: absolute;
    bottom: 8px; left: 16px; right: 16px;
    height: 14px;
    background: linear-gradient(90deg, #E0F7FA, #B2EBF2, #E0F7FA);
    border-radius: 6px;
    opacity: 0.7;
  }

  /* ── BUBBLES ── */
  .bubbles-container {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), rgba(79,195,247,0.3));
    border: 1.5px solid rgba(255,255,255,0.7);
    animation: float-up linear infinite;
    bottom: -60px;
  }
  @keyframes float-up {
    0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
    10%  { opacity: 1; }
    80%  { opacity: 0.6; }
    100% { transform: translateY(-110vh) translateX(var(--drift)) scale(0.6); opacity: 0; }
  }

  .bubble:nth-child(1)  { width:14px;height:14px; left:8%;  animation-duration:7s;  animation-delay:0s;   --drift:20px; }
  .bubble:nth-child(2)  { width:20px;height:20px; left:18%; animation-duration:9s;  animation-delay:1s;   --drift:-15px; }
  .bubble:nth-child(3)  { width:10px;height:10px; left:30%; animation-duration:6s;  animation-delay:2s;   --drift:10px; }
  .bubble:nth-child(4)  { width:18px;height:18px; left:42%; animation-duration:11s; animation-delay:0.5s; --drift:-20px; }
  .bubble:nth-child(5)  { width:12px;height:12px; left:55%; animation-duration:8s;  animation-delay:3s;   --drift:15px; }
  .bubble:nth-child(6)  { width:22px;height:22px; left:68%; animation-duration:10s; animation-delay:1.5s; --drift:-10px; }
  .bubble:nth-child(7)  { width:9px; height:9px;  left:78%; animation-duration:7s;  animation-delay:4s;   --drift:25px; }
  .bubble:nth-child(8)  { width:16px;height:16px; left:88%; animation-duration:9s;  animation-delay:2.5s; --drift:-18px; }
  .bubble:nth-child(9)  { width:11px;height:11px; left:23%; animation-duration:12s; animation-delay:0s;   --drift:12px; }
  .bubble:nth-child(10) { width:24px;height:24px; left:72%; animation-duration:14s; animation-delay:3.5s; --drift:-22px; }
  .bubble:nth-child(11) { width:8px; height:8px;  left:5%;  animation-duration:8s;  animation-delay:5s;   --drift:8px; }
  .bubble:nth-child(12) { width:15px;height:15px; left:60%; animation-duration:10s; animation-delay:1s;   --drift:-12px; }

  /* ── HERO TEXT ── */
  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 600px;
  }

  .hero h1 {
    font-size: clamp(2.4rem, 8vw, 4rem);
    font-weight: 800;
    color: var(--navy);
    line-height: 1.1;
    letter-spacing: -0.5px;
    margin-bottom: 0.75rem;
    text-shadow: 0 2px 12px rgba(13,71,161,0.1);
  }

  .hero h1 span { color: var(--sky); }

  .hero-sub {
    font-size: clamp(1rem, 3vw, 1.2rem);
    color: var(--navy-light);
    font-weight: 500;
    margin-bottom: 0.4rem;
    opacity: 0.9;
  }

  .hero-name {
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: clamp(1.1rem, 3.5vw, 1.4rem);
    color: var(--navy);
    margin-bottom: 2rem;
  }

  .hero-btns {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.9rem 1.8rem;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
    border: none;
  }
  .btn:hover { transform: translateY(-3px); }
  .btn:active { transform: translateY(0); }

  .btn-primary {
    background: var(--navy);
    color: var(--white);
    box-shadow: 0 8px 24px rgba(13,71,161,0.3);
  }
  .btn-primary:hover { box-shadow: 0 12px 32px rgba(13,71,161,0.4); }

  .btn-outline {
    background: rgba(255,255,255,0.85);
    color: var(--navy);
    border: 2px solid rgba(13,71,161,0.25);
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 24px rgba(13,71,161,0.12);
  }
  .
