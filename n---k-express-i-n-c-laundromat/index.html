<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ $json.name }} – Fresh. Fast. Easy.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #4FC3F7;
    --white: #FFFFFF;
    --aqua: #E0F7FA;
    --navy: #0D47A1;
    --navy-light: #1565C0;
    --mid-blue: #29B6F6;
    --soft-shadow: 0 8px 32px rgba(13,71,161,0.10);
    --radius: 20px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--white);
    color: var(--navy);
    overflow-x: hidden;
  }

  h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

  /* ─── HERO ─── */
  .hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #E0F7FA 0%, #B3E5FC 40%, #81D4FA 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 60px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  /* Background decorative circles */
  .hero::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 340px; height: 340px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    pointer-events: none;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -60px;
    width: 260px; height: 260px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    pointer-events: none;
  }

  /* ─── WASHING MACHINE GRAPHIC ─── */
  .machine-wrap {
    position: relative;
    width: 200px;
    height: 230px;
    margin: 0 auto 36px;
    filter: drop-shadow(0 12px 24px rgba(13,71,161,0.18));
  }

  .machine-body {
    position: absolute;
    bottom: 0; left: 0;
    width: 200px; height: 200px;
    background: linear-gradient(145deg, #ffffff 60%, #e3f2fd 100%);
    border-radius: 24px;
    border: 3px solid #90CAF9;
    box-shadow: inset 0 2px 8px rgba(79,195,247,0.15), 0 8px 24px rgba(13,71,161,0.12);
  }

  /* Top control panel */
  .machine-panel {
    position: absolute;
    top: 14px; left: 18px; right: 18px;
    height: 28px;
    background: linear-gradient(90deg, #B3E5FC, #81D4FA);
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 10px;
    gap: 6px;
  }

  .panel-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--white);
    opacity: 0.85;
  }
  .panel-dot:first-child { background: #4FC3F7; }

  /* Drum (porthole) */
  .drum {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 118px; height: 118px;
    border-radius: 50%;
    background: linear-gradient(135deg, #E3F2FD 30%, #B3E5FC 100%);
    border: 5px solid #90CAF9;
    box-shadow: inset 0 2px 12px rgba(13,71,161,0.13), 0 0 0 4px #fff;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .drum-inner {
    width: 86px; height: 86px;
    border-radius: 50%;
    background: linear-gradient(135deg, #81D4FA 0%, #4FC3F7 50%, #29B6F6 100%);
    animation: spinDrum 3s linear infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  @keyframes spinDrum {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Clothes shapes inside drum */
  .clothes-shape {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
  }
  .clothes-shape:nth-child(1) { width: 28px; height: 18px; top: 12px; left: 10px; border-radius: 30px; }
  .clothes-shape:nth-child(2) { width: 20px; height: 24px; bottom: 10px; right: 8px; border-radius: 30px; }
  .clothes-shape:nth-child(3) { width: 16px; height: 16px; top: 32px; right: 14px; border-radius: 50%; }

  /* Drum spoke lines */
  .drum-spokes {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
  }
  .drum-spokes::before,
  .drum-spokes::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 70%; height: 2px;
    background: rgba(255,255,255,0.35);
    border-radius: 2px;
  }
  .drum-spokes::before { transform: translate(-50%,-50%) rotate(0deg); }
  .drum-spokes::after  { transform: translate(-50%,-50%) rotate(60deg); }

  .drum-spoke-extra {
    position: absolute;
    top: 50%; left: 50%;
    width: 70%; height: 2px;
    background: rgba(255,255,255,0.35);
    border-radius: 2px;
    transform: translate(-50%,-50%) rotate(120deg);
  }

  /* Door handle */
  .drum-handle {
    position: absolute;
    right: -2px; top: 50%;
    transform: translateY(-50%);
    width: 10px; height: 30px;
    background: #90CAF9;
    border-radius: 0 8px 8px 0;
    border: 2px solid #64B5F6;
  }

  /* Bubbles */
  .bubbles {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: visible;
  }

  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.65);
    border: 1.5px solid rgba(79,195,247,0.4);
    animation: floatUp linear infinite;
    bottom: 0;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) scale(1); opacity: 0.7; }
    80%  { opacity: 0.5; }
    100% { transform: translateY(-380px) scale(0.6); opacity: 0; }
  }

  .b1  { width: 14px; height: 14px; left: 8%;  animation-duration: 4.2s; animation-delay: 0s;    }
  .b2  { width: 10px; height: 10px; left: 22%; animation-duration: 3.5s; animation-delay: 0.8s;  }
  .b3  { width: 18px; height: 18px; left: 38%; animation-duration: 5.1s; animation-delay: 0.3s;  }
  .b4  { width: 8px;  height: 8px;  left: 55%; animation-duration: 3.8s; animation-delay: 1.4s;  }
  .b5  { width: 12px; height: 12px; left: 70%; animation-duration: 4.6s; animation-delay: 0.5s;  }
  .b6  { width: 16px; height: 16px; left: 85%; animation-duration: 5.4s; animation-delay: 1.9s;  }
  .b7  { width: 9px;  height: 9px;  left: 15%; animation-duration: 4.0s; animation-delay: 2.2s;  }
  .b8  { width: 13px; height: 13px; left: 48%; animation-duration: 3.3s; animation-delay: 1.1s;  }
  .b9  { width: 7px;  height: 7px;  left: 62%; animation-duration: 5.8s; animation-delay: 2.6s;  }
  .b10 { width: 11px; height: 11px; left: 78%; animation-duration: 4.4s; animation-delay: 0.0s;  }

  /* Steam puffs above machine */
  .steam {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
    align-items: flex-end;
  }

  .steam-puff {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
    animation: steamRise 2.5s ease-out infinite;
    opacity: 0;
  }
  .steam-puff:nth-child(2) { animation-delay: 0.4s; width: 14px; height: 14px; }
  .steam-puff:nth-child(3) { animation-delay: 0.8s; width: 10px; height: 10px; }

  @keyframes steamRise {
    0%   { transform: translateY(0); opacity: 0.7; }
    100% { transform: translateY(-40px) scale(1.4); opacity: 0; }
  }

  /* ─── HERO TEXT ─── */
  .hero-text { position: relative; z-index: 2; }

  .hero-text h1 {
    font-size: clamp(2.4rem, 8vw, 4rem);
    font-weight: 800;
    color: var(--navy);
    line-height: 1.1;
    letter-spacing: -1px;
    margin-bottom: 14px;
  }

  .hero-text h1 span { color: var(--navy-light); }

  .hero-tagline {
    font-size: clamp(1rem, 3.5vw, 1.25rem);
    color: #1565C0;
    font-weight: 500;
    margin-bottom: 36px;
    line-height: 1.5;
  }

  .hero-tagline strong {
    font-weight: 700;
    color: var(--navy);
  }

  .cta-group {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
  }

  @media (min-width: 480px) {
    .cta-group { flex-direction: row; justify-content: center; }
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px 32px;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-size: 1.05rem;
    font-weight: 700;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    width: 100%;
    max-width: 220px;
    cursor: pointer;
    border: none;
  }

  .btn:hover { transform: translateY(-3px); }

  .btn-primary {
    background: var(--navy);
    color: var(--white);
    box-shadow: 0 8px 24px rgba(13,71,161,0.30);
  }
  .btn-primary:hover { box-shadow: 0 12px 32px rgba(13,71,161,0.40); }

  .btn-secondary {
    background: var(--white);
    color: var(--navy);
    box-shadow: 0 8px 24px rgba(13,71,161,0.15);
    border: 2px solid rgba(13,71,161,0.15);
  }
  .btn-secondary:hover { box-shadow: 0 12px 28px rgba(13,71,161,0.22); }

  /* Scroll hint */
  .scroll-hint {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--navy-light);
    font-size: 0.75rem;
    font-family: 'Inter', sans-serif;
    opacity: 0.7;
    animation: bounce 2s ease-in-out infinite;
  }

  .scroll-hint-arrow {
    width: 18px; height: 18px;
    border-right: 2.5px solid var(--navy-light);
    border-bottom: 2.5px solid var(--navy-light);
    transform: rotate(45deg);
  }

  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%       { transform: translateX(-50%) translateY(6px); }
  }

  /* ─── SECTION BASE ─── */
  section {
    padding: 72px 24px;
  }
