<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ $json.name }} – Fresh. Fast. Easy.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #4FC3F7;
    --white: #FFFFFF;
    --aqua: #E0F7FA;
    --navy: #0D47A1;
    --navy-light: #1565C0;
    --soft-blue: #B3E5FC;
    --text-dark: #1a2a4a;
    --text-muted: #5a7a9a;
    --shadow: 0 8px 32px rgba(13,71,161,0.10);
    --radius: 20px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--white);
    color: var(--text-dark);
    overflow-x: hidden;
  }

  /* ===== HERO ===== */
  #hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #e0f7fa 0%, #b3e5fc 40%, #81d4fa 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px 60px;
    position: relative;
    overflow: hidden;
  }

  /* Background blobs */
  #hero::before {
    content: '';
    position: absolute;
    top: -80px; right: -80px;
    width: 340px; height: 340px;
    background: radial-gradient(circle, rgba(255,255,255,0.45) 0%, transparent 70%);
    border-radius: 50%;
    animation: blobFloat 7s ease-in-out infinite alternate;
  }
  #hero::after {
    content: '';
    position: absolute;
    bottom: -60px; left: -60px;
    width: 280px; height: 280px;
    background: radial-gradient(circle, rgba(79,195,247,0.3) 0%, transparent 70%);
    border-radius: 50%;
    animation: blobFloat 9s ease-in-out infinite alternate-reverse;
  }

  @keyframes blobFloat {
    0% { transform: translateY(0) scale(1); }
    100% { transform: translateY(30px) scale(1.08); }
  }

  /* ===== WASHING MACHINE ===== */
  .washer-wrap {
    position: relative;
    width: 200px;
    height: 220px;
    margin: 0 auto 36px;
    filter: drop-shadow(0 16px 32px rgba(13,71,161,0.18));
  }

  .washer-body {
    position: absolute;
    bottom: 0; left: 0;
    width: 200px; height: 200px;
    background: linear-gradient(145deg, #ffffff 60%, #e0f7fa 100%);
    border-radius: 22px;
    border: 3px solid #b3e5fc;
    box-shadow: inset 0 4px 16px rgba(79,195,247,0.18), 0 8px 24px rgba(13,71,161,0.12);
  }

  /* top panel strip */
  .washer-top {
    position: absolute;
    top: 12px; left: 12px; right: 12px;
    height: 32px;
    background: linear-gradient(90deg, #4FC3F7, #81d4fa);
    border-radius: 10px;
  }

  /* knob dots on top panel */
  .washer-top::before {
    content: '';
    position: absolute;
    left: 12px; top: 50%;
    transform: translateY(-50%);
    width: 14px; height: 14px;
    background: #fff;
    border-radius: 50%;
    box-shadow: 20px 0 0 #ffffffbb, 40px 0 0 #ffffff88;
  }

  /* drum porthole */
  .washer-drum {
    position: absolute;
    top: 58px; left: 50%;
    transform: translateX(-50%);
    width: 118px; height: 118px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0288d1 0%, #4FC3F7 50%, #0D47A1 100%);
    border: 6px solid #b3e5fc;
    box-shadow: inset 0 4px 16px rgba(0,0,0,0.18), 0 4px 12px rgba(13,71,161,0.15);
    overflow: hidden;
    animation: drumSpin 3s linear infinite;
  }

  @keyframes drumSpin {
    0% { filter: hue-rotate(0deg) brightness(1); }
    50% { filter: hue-rotate(15deg) brightness(1.08); }
    100% { filter: hue-rotate(0deg) brightness(1); }
  }

  /* clothes shapes inside drum */
  .washer-drum::before {
    content: '';
    position: absolute;
    top: 14px; left: 8px;
    width: 50px; height: 28px;
    background: rgba(255,255,255,0.55);
    border-radius: 40px;
    transform-origin: center center;
    animation: clothSpin 3s linear infinite;
  }
  .washer-drum::after {
    content: '';
    position: absolute;
    bottom: 14px; right: 8px;
    width: 42px; height: 22px;
    background: rgba(255,255,255,0.4);
    border-radius: 40px;
    transform-origin: center center;
    animation: clothSpin 3s linear infinite reverse;
  }

  @keyframes clothSpin {
    0%   { transform: rotate(0deg) translateX(6px); }
    25%  { transform: rotate(90deg) translateX(8px); }
    50%  { transform: rotate(180deg) translateX(6px); }
    75%  { transform: rotate(270deg) translateX(8px); }
    100% { transform: rotate(360deg) translateX(6px); }
  }

  /* drum inner shine ring */
  .drum-shine {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 90px; height: 90px;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.35);
    pointer-events: none;
  }

  /* door handle */
  .washer-handle {
    position: absolute;
    bottom: 18px; left: 50%;
    transform: translateX(-50%);
    width: 36px; height: 8px;
    background: #b3e5fc;
    border-radius: 6px;
    border: 2px solid #4FC3F7;
  }

  /* ===== BUBBLES ===== */
  .bubbles {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .bubble {
    position: absolute;
    bottom: -40px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    border: 1.5px solid rgba(255,255,255,0.7);
    animation: bubbleRise linear infinite;
  }

  .bubble:nth-child(1)  { left: 8%;  width: 18px; height: 18px; animation-duration: 6s;  animation-delay: 0s;   }
  .bubble:nth-child(2)  { left: 18%; width: 10px; height: 10px; animation-duration: 8s;  animation-delay: 1.5s; }
  .bubble:nth-child(3)  { left: 32%; width: 22px; height: 22px; animation-duration: 7s;  animation-delay: 0.8s; }
  .bubble:nth-child(4)  { left: 50%; width: 14px; height: 14px; animation-duration: 9s;  animation-delay: 2.2s; }
  .bubble:nth-child(5)  { left: 62%; width: 20px; height: 20px; animation-duration: 6.5s;animation-delay: 0.3s; }
  .bubble:nth-child(6)  { left: 73%; width: 12px; height: 12px; animation-duration: 7.5s;animation-delay: 1s;   }
  .bubble:nth-child(7)  { left: 85%; width: 16px; height: 16px; animation-duration: 5.5s;animation-delay: 3s;   }
  .bubble:nth-child(8)  { left: 93%; width: 9px;  height: 9px;  animation-duration: 10s; animation-delay: 0.5s; }
  .bubble:nth-child(9)  { left: 42%; width: 11px; height: 11px; animation-duration: 8.5s;animation-delay: 4s;   }
  .bubble:nth-child(10) { left: 55%; width: 17px; height: 17px; animation-duration: 7s;  animation-delay: 2.8s; }

  @keyframes bubbleRise {
    0%   { transform: translateY(0)   scale(1);    opacity: 0; }
    10%  { opacity: 0.9; }
    80%  { opacity: 0.6; }
    100% { transform: translateY(-110vh) scale(0.6); opacity: 0; }
  }

  /* ===== HERO TEXT ===== */
  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 600px;
    width: 100%;
  }

  .hero-badge {
    display: inline-block;
    background: rgba(255,255,255,0.75);
    color: var(--navy);
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 6px 18px;
    border-radius: 50px;
    margin-bottom: 18px;
    box-shadow: 0 2px 12px rgba(13,71,161,0.1);
  }

  .hero-headline {
    font-family: 'Poppins', sans-serif;
    font-weight: 900;
    font-size: clamp(2.6rem, 8vw, 4.2rem);
    line-height: 1.08;
    color: var(--navy);
    margin-bottom: 16px;
    text-shadow: 0 2px 16px rgba(13,71,161,0.1);
  }

  .hero-headline span {
    color: #0288d1;
  }

  .hero-sub {
    font-family: 'Inter', sans-serif;
    font-size: clamp(1rem, 3.5vw, 1.18rem);
    font-weight: 500;
    color: var(--navy-light);
    margin-bottom: 36px;
    line-height: 1.6;
  }

  .hero-buttons {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 16px 32px;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    text-decoration: none;
    transition: transform 0.18s ease, box-shadow 0.18s ease;
    white-space: nowrap;
  }
  .btn:hover { transform: translateY(-3px); }
  .btn:active { transform: translateY(0); }

  .btn-primary {
    background: var(--navy);
    color: #fff;
    box-shadow: 0 8px 28px rgba(13,71,161,0.32);
  }
  .btn-primary:hover { box-shadow: 0 12px 36px rgba(13,71,161,0.42); }

  .btn-secondary {
    background: rgba(255,255,255,0.9);
    color: var(--navy);
    box-shadow: 0 8px 24px rgba(13,71,161,0.14);
    border: 2px solid rgba(79,195,247,0.5);
  }
  .btn-secondary:hover { box-shadow: 0 12px 32px rgba(13,71,161,0.22); }

  /* scroll cue */
  .scroll-cue {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    z-index: 2;
    opacity: 0.65;
  }

  .scroll-cue span {
    font-family: 'Inter', sans-serif;
    font-size: 0.72rem;
    color: var(--navy);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .scroll-arrow {
    width: 22px; height: 22px;
    border-right: 2.5px solid var(--navy);
    border-bottom: 2.5px solid var(--navy);
    transform: rotate(45deg);
    animation: arrowBounce 1.5s ease infinite;
  }

  @keyframes arrowBounce {
    0%, 100% { transform: rotate(45deg) translateY(0); }
    50%       { transform: rotate(45deg) translateY(5px); }
  }

  /* ===== SECTIONS SHARED ===== */
  section { padding: 80px 20px; }

  .section-inner {
    max-width: 900px;
    margin: 0 auto;
  }

  .section-tag {
    display: inline-block;
    background: var(--aqua);
    color: var(--navy);
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 0.72rem;
    letter-spacing:
