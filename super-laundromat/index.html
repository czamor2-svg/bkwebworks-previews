<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Super Laundromat – Clean Clothes. Zero Hassle.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #4FC3F7;
    --navy: #0D47A1;
    --aqua: #E0F7FA;
    --white: #FFFFFF;
    --dark: #1a2a3a;
    --mid: #2d5a8e;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--dark);
    background: var(--white);
    overflow-x: hidden;
  }

  h1, h2, h3, h4 {
    font-family: 'Poppins', sans-serif;
  }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 1rem 2rem;
    background: rgba(13, 71, 161, 0.95);
    backdrop-filter: blur(10px);
    box-shadow: 0 2px 20px rgba(0,0,0,0.2);
  }

  .nav-logo {
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 1.3rem;
    color: var(--white);
    text-decoration: none;
    letter-spacing: -0.5px;
  }

  .nav-logo span { color: var(--blue); }

  .nav-links {
    display: flex;
    gap: 1.5rem;
    list-style: none;
  }

  .nav-links a {
    color: rgba(255,255,255,0.85);
    text-decoration: none;
    font-size: 0.9rem;
    font-weight: 500;
    transition: color 0.3s;
  }

  .nav-links a:hover { color: var(--blue); }

  .nav-cta {
    background: var(--blue);
    color: var(--navy) !important;
    padding: 0.5rem 1.2rem;
    border-radius: 50px;
    font-weight: 600 !important;
    transition: transform 0.2s, box-shadow 0.2s !important;
  }

  .nav-cta:hover {
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(79,195,247,0.4);
    color: var(--navy) !important;
  }

  .hamburger {
    display: none;
    flex-direction: column;
    gap: 5px;
    cursor: pointer;
    padding: 4px;
  }

  .hamburger span {
    display: block;
    width: 25px;
    height: 3px;
    background: var(--white);
    border-radius: 3px;
    transition: all 0.3s;
  }

  @media (max-width: 768px) {
    .nav-links { display: none; }
    .hamburger { display: flex; }
    .nav-links.open {
      display: flex;
      flex-direction: column;
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: rgba(13,71,161,0.98);
      padding: 1.5rem 2rem;
      gap: 1rem;
    }
  }

  /* ── HERO ── */
  #hero {
    min-height: 100vh;
    background: linear-gradient(135deg, var(--navy) 0%, #1565C0 50%, #1976D2 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6rem 1.5rem 3rem;
    position: relative;
    overflow: hidden;
  }

  /* Animated background bubbles */
  .bg-bubbles {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .bg-bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(79,195,247,0.08);
    animation: floatBubble linear infinite;
  }

  @keyframes floatBubble {
    0% { transform: translateY(110vh) scale(0.5); opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { transform: translateY(-20vh) scale(1.2); opacity: 0; }
  }

  /* ── WASHING MACHINE ── */
  .machine-wrapper {
    position: relative;
    width: 180px;
    height: 200px;
    margin-bottom: 2.5rem;
    filter: drop-shadow(0 20px 40px rgba(0,0,0,0.4));
  }

  .machine-body {
    width: 160px;
    height: 180px;
    background: linear-gradient(145deg, #e8eef5, #c8d8e8);
    border-radius: 18px;
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: inset -4px -4px 10px rgba(0,0,0,0.15), inset 4px 4px 10px rgba(255,255,255,0.6);
  }

  .machine-top {
    width: 160px;
    height: 30px;
    background: linear-gradient(145deg, #1565C0, #0D47A1);
    border-radius: 18px 18px 0 0;
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 14px;
    gap: 6px;
  }

  .machine-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--blue);
    box-shadow: 0 0 6px var(--blue);
    animation: blink 1.5s ease-in-out infinite;
  }

  .machine-dot:nth-child(2) { animation-delay: 0.5s; background: #66BB6A; box-shadow: 0 0 6px #66BB6A; }
  .machine-dot:nth-child(3) { animation-delay: 1s; background: #FFA726; box-shadow: 0 0 6px #FFA726; }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .machine-drum-outer {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: linear-gradient(145deg, #1a3a5c, #0d2a45);
    position: absolute;
    top: 45px;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.5), 0 0 0 6px #b0c4d8, 0 0 0 8px #8fa8c0;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .machine-drum-inner {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(145deg, #1e4976, #163859);
    animation: spinDrum 3s linear infinite;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @keyframes spinDrum {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .drum-hole {
    position: absolute;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.1);
  }

  .drum-hole:nth-child(1) { top: 12px; left: 50%; transform: translateX(-50%); }
  .drum-hole:nth-child(2) { bottom: 12px; left: 50%; transform: translateX(-50%); }
  .drum-hole:nth-child(3) { left: 12px; top: 50%; transform: translateY(-50%); }
  .drum-hole:nth-child(4) { right: 12px; top: 50%; transform: translateY(-50%); }
  .drum-hole:nth-child(5) { top: 20px; left: 20px; }
  .drum-hole:nth-child(6) { top: 20px; right: 20px; }
  .drum-hole:nth-child(7) { bottom: 20px; left: 20px; }
  .drum-hole:nth-child(8) { bottom: 20px; right: 20px; }

  .drum-center {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: linear-gradient(145deg, #4FC3F7, #29B6F6);
    box-shadow: 0 0 10px rgba(79,195,247,0.6);
    z-index: 2;
  }

  .machine-clothes {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(ellipse at 30% 60%, rgba(255,100,100,0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 40%, rgba(100,200,255,0.3) 0%, transparent 50%);
    animation: sloshing 3s ease-in-out infinite;
  }

  @keyframes sloshing {
    0%, 100% { transform: rotate(-5deg); }
    50% { transform: rotate(5deg); }
  }

  .machine-panel {
    position: absolute;
    bottom: 15px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
  }

  .panel-btn {
    width: 24px;
    height: 10px;
    border-radius: 5px;
    background: linear-gradient(90deg, #1565C0, #1976D2);
  }

  .panel-btn:nth-child(2) { width: 40px; }

  /* Floating bubbles around machine */
  .float-bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(79,195,247,0.3));
    border: 1px solid rgba(255,255,255,0.4);
    animation: floatUp ease-in-out infinite;
  }

  @keyframes floatUp {
    0% { transform: translateY(0) scale(1); opacity: 0.8; }
    50% { transform: translateY(-30px) scale(1.1) translateX(5px); opacity: 0.5; }
    100% { transform: translateY(-60px) scale(0.5) translateX(-5px); opacity: 0; }
  }

  /* Hero text */
  .hero-headline {
    font-size: clamp(2.2rem, 6vw, 4rem);
    font-weight: 900;
    color: var(--white);
    line-height: 1.1;
    margin-bottom: 1rem;
    letter-spacing: -1px;
  }

  .hero-headline span { color: var(--blue); }

  .hero-sub {
    font-size: clamp(1rem, 2.5vw, 1.25rem);
    color: rgba(255,255,255,0.85);
    margin-bottom: 2rem;
    max-width: 500px;
  }

  .hero-sub strong { color: var(--blue); }

  .hero-buttons {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-primary {
    background: var(--blue);
    color: var(--navy);
    text-decoration: none;
    padding: 0.85rem 2rem;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 20px rgba(79,195,247,0.3);
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }

  .btn-primary:hover {
    transform: translateY(-3px);
    box-shadow: 0 8px 30px rgba(79,195,247,0.5);
  }

  .btn-secondary {
    background: transparent;
    color: var(--white);
    text-decoration: none;
    padding: 0.85rem 2rem;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    border: 2px solid rgba(255,255,255,0.5);
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
  }

  .btn-secondary:hover {
    background: rgba(255,255,255,0.1);
    border-color: var(--white);
    transform: translateY(-3px);
  }

  .scroll-hint {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.5rem;
    color: rgba(255,255,255,0.5);
    font-size: 0.8rem;
    animation: bounce 2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50% { transform: translateX(-50%) translate
