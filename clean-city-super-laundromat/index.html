<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ $json.name }} – Fresh. Fast. Easy.</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky: #4FC3F7;
      --sky-dark: #0288D1;
      --aqua: #E0F7FA;
      --aqua-mid: #B2EBF2;
      --navy: #0D47A1;
      --navy-light: #1565C0;
      --white: #FFFFFF;
      --text: #1A237E;
      --text-body: #37474F;
      --shadow: 0 4px 24px rgba(13,71,161,0.10);
      --shadow-lg: 0 8px 40px rgba(13,71,161,0.15);
      --radius: 20px;
      --radius-sm: 12px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--white);
      color: var(--text-body);
      overflow-x: hidden;
    }

    h1, h2, h3, h4 {
      font-family: 'Poppins', sans-serif;
      color: var(--navy);
    }

    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      background: linear-gradient(160deg, #E0F7FA 0%, #B2EBF2 40%, #81D4FA 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px 60px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    /* Decorative background circles */
    .hero::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      top: -150px; right: -150px;
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: rgba(255,255,255,0.13);
      bottom: -100px; left: -100px;
      pointer-events: none;
    }

    /* ── WASHING MACHINE ANIMATION ── */
    .washer-wrap {
      position: relative;
      width: 180px; height: 210px;
      margin: 0 auto 36px;
      filter: drop-shadow(0 12px 32px rgba(2,136,209,0.25));
    }

    /* Machine body */
    .washer-body {
      position: absolute;
      bottom: 0; left: 0;
      width: 180px; height: 190px;
      background: linear-gradient(145deg, #ffffff 60%, #e3f6fd 100%);
      border-radius: 22px 22px 18px 18px;
      border: 3px solid #B2EBF2;
      box-shadow: inset 0 -4px 12px rgba(79,195,247,0.15), 0 8px 32px rgba(2,136,209,0.18);
    }

    /* Top panel */
    .washer-top {
      position: absolute;
      top: 0; left: 0;
      width: 180px; height: 28px;
      background: linear-gradient(90deg, #4FC3F7, #29B6F6);
      border-radius: 22px 22px 0 0;
    }

    /* Control dots on top */
    .washer-dot {
      position: absolute;
      top: 8px;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
    }
    .washer-dot:nth-child(1) { left: 18px; }
    .washer-dot:nth-child(2) { left: 36px; background: rgba(255,255,255,0.4); }
    .washer-dot:nth-child(3) { right: 18px; width: 18px; border-radius: 4px; }

    /* Door porthole outer ring */
    .washer-door-ring {
      position: absolute;
      top: 44px; left: 50%;
      transform: translateX(-50%);
      width: 118px; height: 118px;
      border-radius: 50%;
      background: linear-gradient(135deg, #B2EBF2 0%, #4FC3F7 100%);
      border: 4px solid #81D4FA;
      box-shadow: 0 2px 12px rgba(2,136,209,0.2), inset 0 2px 8px rgba(255,255,255,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Door glass */
    .washer-door-glass {
      width: 94px; height: 94px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.95) 0%, rgba(220,245,255,0.85) 50%, rgba(179,229,252,0.7) 100%);
      border: 3px solid rgba(255,255,255,0.8);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Drum inside */
    .washer-drum {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 3px solid rgba(79,195,247,0.5);
      position: relative;
      animation: spinDrum 2.5s linear infinite;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @keyframes spinDrum {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Drum holes */
    .drum-hole {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 50%;
      background: rgba(79,195,247,0.4);
      border: 1.5px solid rgba(79,195,247,0.6);
    }
    .drum-hole:nth-child(1) { top: 6px; left: 50%; transform: translateX(-50%); }
    .drum-hole:nth-child(2) { bottom: 6px; left: 50%; transform: translateX(-50%); }
    .drum-hole:nth-child(3) { left: 6px; top: 50%; transform: translateY(-50%); }
    .drum-hole:nth-child(4) { right: 6px; top: 50%; transform: translateY(-50%); }
    .drum-hole:nth-child(5) { top: 14px; left: 14px; }
    .drum-hole:nth-child(6) { top: 14px; right: 14px; }
    .drum-hole:nth-child(7) { bottom: 14px; left: 14px; }
    .drum-hole:nth-child(8) { bottom: 14px; right: 14px; }

    /* Clothes swirl inside drum */
    .drum-clothes {
      position: absolute;
      width: 44px; height: 44px;
      border-radius: 50%;
      overflow: hidden;
    }
    .cloth {
      position: absolute;
      border-radius: 50%;
      opacity: 0.7;
    }
    .cloth-1 {
      width: 22px; height: 22px;
      background: linear-gradient(135deg, #fff, #E3F2FD);
      top: 4px; left: 4px;
      border-radius: 8px;
      animation: tumble 2.5s linear infinite reverse;
    }
    .cloth-2 {
      width: 18px; height: 18px;
      background: linear-gradient(135deg, #B3E5FC, #81D4FA);
      bottom: 4px; right: 6px;
      border-radius: 6px;
      animation: tumble 2.5s linear infinite;
    }
    .cloth-3 {
      width: 14px; height: 14px;
      background: linear-gradient(135deg, #E1F5FE, #fff);
      bottom: 8px; left: 8px;
      border-radius: 5px;
      animation: tumble 2.5s 0.5s linear infinite reverse;
    }

    @keyframes tumble {
      0% { transform: rotate(0deg) translate(2px, 0); }
      50% { transform: rotate(180deg) translate(-2px, 2px); }
      100% { transform: rotate(360deg) translate(2px, 0); }
    }

    /* Glass shine */
    .washer-door-glass::after {
      content: '';
      position: absolute;
      top: 8px; left: 12px;
      width: 28px; height: 18px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      transform: rotate(-30deg);
    }

    /* Bottom detail */
    .washer-bottom {
      position: absolute;
      bottom: 12px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 10px;
    }
    .washer-btn {
      width: 22px; height: 8px;
      background: linear-gradient(90deg, #B2EBF2, #4FC3F7);
      border-radius: 4px;
    }

    /* ── BUBBLES ── */
    .bubbles {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(255,255,255,0.9), rgba(79,195,247,0.3));
      border: 1.5px solid rgba(255,255,255,0.6);
      animation: riseUp linear infinite;
      bottom: -60px;
    }

    @keyframes riseUp {
      0%   { transform: translateY(0) translateX(0) scale(1); opacity: 0; }
      10%  { opacity: 0.8; }
      50%  { transform: translateY(-45vh) translateX(12px) scale(1.05); }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-90vh) translateX(-8px) scale(0.8); opacity: 0; }
    }

    .bubble:nth-child(1)  { width:14px; height:14px; left:8%;  animation-duration:6s;  animation-delay:0s; }
    .bubble:nth-child(2)  { width:20px; height:20px; left:18%; animation-duration:8s;  animation-delay:1.2s; }
    .bubble:nth-child(3)  { width:10px; height:10px; left:30%; animation-duration:5.5s;animation-delay:0.6s; }
    .bubble:nth-child(4)  { width:24px; height:24px; left:42%; animation-duration:9s;  animation-delay:2s; }
    .bubble:nth-child(5)  { width:12px; height:12px; left:55%; animation-duration:6.5s;animation-delay:0.3s; }
    .bubble:nth-child(6)  { width:18px; height:18px; left:65%; animation-duration:7.5s;animation-delay:1.8s; }
    .bubble:nth-child(7)  { width: 8px; height: 8px; left:75%; animation-duration:5s;  animation-delay:0.9s; }
    .bubble:nth-child(8)  { width:16px; height:16px; left:85%; animation-duration:8.5s;animation-delay:2.5s; }
    .bubble:nth-child(9)  { width:22px; height:22px; left:22%; animation-duration:10s; animation-delay:3s; }
    .bubble:nth-child(10) { width:11px; height:11px; left:92%; animation-duration:6s;  animation-delay:1.5s; }
    .bubble:nth-child(11) { width:17px; height:17px; left:50%; animation-duration:7s;  animation-delay:4s; }
    .bubble:nth-child(12) { width: 9px; height: 9px; left:3%;  animation-duration:5.5s;animation-delay:2.2s; }

    .hero-content {
      position: relative;
      z-index: 10;
      max-width: 600px;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(255,255,255,0.7);
      color: var(--navy-light);
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 6px 18px;
      border-radius: 50px;
      margin-bottom: 20px;
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(255,255,255,0.8);
    }

    .hero h1 {
      font-size: clamp(2.4rem, 8vw, 4rem);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.1;
      margin-bottom: 16px;
      text-shadow: 0 2px 16px rgba(13,71,161,0.08);
    }

    .hero h1 span {
      color: var(--sky-dark);
    }

    .hero-sub {
      font-size: clamp(1rem, 3vw, 1.2rem);
      color: var(--navy-light);
      font-weight: 500;
      margin-bottom: 36px;
      line-height: 1.5;
    }

    .hero-btns {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
    }

      display:
