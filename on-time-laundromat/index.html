<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ $json.name }} – Fresh. Fast. Easy.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #4FC3F7;
    --aqua: #E0F7FA;
    --aqua-mid: #B2EBF2;
    --navy: #0D47A1;
    --navy-light: #1565C0;
    --white: #FFFFFF;
    --text: #1A237E;
    --text-light: #455A64;
    --shadow: 0 8px 32px rgba(13,71,161,0.10);
    --shadow-sm: 0 2px 12px rgba(13,71,161,0.08);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--white);
    color: var(--text);
    overflow-x: hidden;
  }

  h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

  /* ─── HERO ─── */
  .hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #E0F7FA 0%, #B2EBF2 40%, #81D4FA 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 60px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  /* Background decorative circles */
  .hero::before {
    content: '';
    position: absolute;
    width: 500px; height: 500px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    top: -120px; right: -120px;
    pointer-events: none;
  }
  .hero::after {
    content: '';
    position: absolute;
    width: 300px; height: 300px;
    border-radius: 50%;
    background: rgba(255,255,255,0.14);
    bottom: -80px; left: -80px;
    pointer-events: none;
  }

  /* ── Washing Machine ── */
  .washer-wrap {
    position: relative;
    width: 200px; height: 220px;
    margin: 0 auto 40px;
    animation: floatMachine 4s ease-in-out infinite;
  }

  @keyframes floatMachine {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  .washer-body {
    width: 180px; height: 200px;
    background: linear-gradient(135deg, #FFFFFF 60%, #E0F7FA 100%);
    border-radius: 24px;
    position: absolute;
    left: 10px; top: 10px;
    box-shadow: 0 12px 40px rgba(13,71,161,0.18), inset 0 2px 8px rgba(255,255,255,0.9);
    border: 3px solid rgba(79,195,247,0.4);
  }

  .washer-top-bar {
    position: absolute;
    top: 16px; left: 24px; right: 24px;
    height: 22px;
    background: linear-gradient(90deg, #4FC3F7, #81D4FA);
    border-radius: 10px;
  }

  .washer-top-bar::before {
    content: '';
    position: absolute;
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #fff;
    top: 6px; left: 8px;
    box-shadow: 18px 0 0 #fff;
    opacity: 0.8;
  }

  .drum-outer {
    position: absolute;
    width: 120px; height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4FC3F7 0%, #0288D1 100%);
    top: 56px; left: 30px;
    box-shadow: 0 4px 20px rgba(2,136,209,0.35), inset 0 2px 8px rgba(255,255,255,0.3);
    overflow: hidden;
    border: 4px solid rgba(255,255,255,0.7);
  }

  .drum-inner {
    width: 100%; height: 100%;
    border-radius: 50%;
    animation: spinDrum 2.5s linear infinite;
    position: relative;
  }

  @keyframes spinDrum {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .drum-inner::before,
  .drum-inner::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.22);
    border-radius: 4px;
  }
  .drum-inner::before {
    width: 6px; height: 80px;
    top: 20px; left: 47px;
  }
  .drum-inner::after {
    width: 80px; height: 6px;
    top: 47px; left: 20px;
  }

  /* clothes inside drum */
  .clothes-shape {
    position: absolute;
    border-radius: 50%;
    opacity: 0.35;
    animation: spinDrum 2.5s linear infinite;
  }
  .clothes-shape:nth-child(1) {
    width: 40px; height: 28px;
    background: #fff;
    top: 26px; left: 18px;
    border-radius: 20px;
  }
  .clothes-shape:nth-child(2) {
    width: 30px; height: 22px;
    background: #E0F7FA;
    top: 62px; left: 55px;
    border-radius: 15px;
  }
  .clothes-shape:nth-child(3) {
    width: 24px; height: 18px;
    background: #fff;
    top: 44px; left: 30px;
    border-radius: 12px;
  }

  .drum-porthole {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.5);
    top: 0; left: 0;
    pointer-events: none;
  }

  /* Door handle */
  .washer-handle {
    position: absolute;
    width: 16px; height: 50px;
    background: linear-gradient(180deg, #4FC3F7, #0288D1);
    border-radius: 8px;
    right: 14px;
    top: 80px;
    box-shadow: 0 2px 8px rgba(2,136,209,0.3);
  }

  /* Bottom panel */
  .washer-panel {
    position: absolute;
    bottom: 14px; left: 20px; right: 20px;
    height: 18px;
    background: var(--aqua);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: space-evenly;
    padding: 0 6px;
  }
  .washer-panel-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4FC3F7;
  }
  .washer-panel-dot:nth-child(2) { background: #0288D1; }
  .washer-panel-dot:nth-child(3) { background: #81D4FA; }

  /* Bubbles */
  .bubbles { position: absolute; width: 100%; height: 100%; top: 0; left: 0; pointer-events: none; }

  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    border: 1.5px solid rgba(255,255,255,0.8);
    animation: floatBubble linear infinite;
    bottom: 40%;
  }

  @keyframes floatBubble {
    0% { transform: translateY(0) scale(1); opacity: 0.7; }
    80% { opacity: 0.4; }
    100% { transform: translateY(-80vh) scale(0.6); opacity: 0; }
  }

  .bubble:nth-child(1)  { width:14px;height:14px; left:8%;  animation-duration:5.5s; animation-delay:0s; }
  .bubble:nth-child(2)  { width:9px; height:9px;  left:18%; animation-duration:4.2s; animation-delay:0.8s; }
  .bubble:nth-child(3)  { width:18px;height:18px; left:28%; animation-duration:6s;   animation-delay:1.5s; }
  .bubble:nth-child(4)  { width:10px;height:10px; left:40%; animation-duration:4.8s; animation-delay:0.3s; }
  .bubble:nth-child(5)  { width:12px;height:12px; left:55%; animation-duration:5.1s; animation-delay:2s; }
  .bubble:nth-child(6)  { width:7px; height:7px;  left:65%; animation-duration:3.9s; animation-delay:1.1s; }
  .bubble:nth-child(7)  { width:16px;height:16px; left:75%; animation-duration:6.3s; animation-delay:0.5s; }
  .bubble:nth-child(8)  { width:11px;height:11px; left:85%; animation-duration:4.6s; animation-delay:1.8s; }
  .bubble:nth-child(9)  { width:8px; height:8px;  left:92%; animation-duration:5.8s; animation-delay:0.9s; }
  .bubble:nth-child(10) { width:13px;height:13px; left:48%; animation-duration:5s;   animation-delay:2.5s; }

  .hero-content { position: relative; z-index: 2; max-width: 600px; }

  .hero-tag {
    display: inline-block;
    background: rgba(255,255,255,0.7);
    color: var(--navy);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.82rem;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 6px 18px;
    border-radius: 50px;
    margin-bottom: 20px;
    backdrop-filter: blur(8px);
  }

  .hero h1 {
    font-size: clamp(2.6rem, 8vw, 4.2rem);
    font-weight: 900;
    line-height: 1.1;
    color: var(--navy);
    margin-bottom: 16px;
    letter-spacing: -0.02em;
  }

  .hero h1 span { color: var(--sky); }

  .hero-sub {
    font-size: clamp(1rem, 3vw, 1.2rem);
    color: var(--navy-light);
    font-weight: 500;
    margin-bottom: 36px;
    line-height: 1.6;
  }

  .hero-btns {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--navy);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    padding: 16px 30px;
    border-radius: 50px;
    text-decoration: none;
    box-shadow: 0 6px 24px rgba(13,71,161,0.3);
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(13,71,161,0.35); background: #1565C0; }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.85);
    color: var(--navy);
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    padding: 16px 30px;
    border-radius: 50px;
    text-decoration: none;
    box-shadow: 0 6px 24px rgba(13,71,161,0.12);
    backdrop-filter: blur(8px);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-secondary:hover { transform: translateY(-3px); box-shadow: 0 12px 32px rgba(13,71,161,0.18); }

  .scroll-hint {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    opacity: 0.6;
    animation: bounce 2s ease-in-out infinite;
  }
  .scroll-hint span { font-size: 0.75rem; color: var(--navy); font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; }
  .scroll-arrow { width: 20px; height: 20px; border-right: 3px solid var(--navy); border-bottom: 3px solid var(--navy); transform: rotate(45deg); border-radius: 2px; }
  @keyframes bounce { 0%,100%{transform:translateX(-50%) translateY(0);} 50%{transform:translateX(-50%) translateY(8px);} }

  /* ─── SECTION BASE ─── */
  section { padding: 80px 24px; }

  .section-inner { max-width: 900px; margin: 0 auto; }

  .section-tag {
    display: inline-block;
    background: var(--aqua);
    color: var(--navy);
    font-weight
