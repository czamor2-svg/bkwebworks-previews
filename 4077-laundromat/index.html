<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ $json.name }} – Fresh. Fast. Easy.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #4FC3F7;
    --aqua: #E0F7FA;
    --navy: #0D47A1;
    --white: #FFFFFF;
    --light-sky: #B3E5FC;
    --mid-sky: #29B6F6;
    --soft-shadow: 0 8px 32px rgba(79,195,247,0.18);
    --card-shadow: 0 4px 24px rgba(13,71,161,0.10);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--white);
    color: var(--navy);
    overflow-x: hidden;
  }

  h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

  /* ─── HERO ─── */
  #hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #E0F7FA 0%, #B3E5FC 40%, #4FC3F7 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  /* Background soft circles */
  #hero::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    background: rgba(255,255,255,0.18);
    border-radius: 50%;
    top: -180px; right: -180px;
    pointer-events: none;
  }
  #hero::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    background: rgba(255,255,255,0.13);
    border-radius: 50%;
    bottom: -120px; left: -120px;
    pointer-events: none;
  }

  /* ── Washing Machine ── */
  .washer-scene {
    position: relative;
    width: 180px;
    height: 200px;
    margin: 0 auto 2rem;
    flex-shrink: 0;
  }

  .washer-body {
    position: absolute;
    bottom: 0; left: 0;
    width: 180px; height: 180px;
    background: linear-gradient(145deg, #ffffff, #e8f4f8);
    border-radius: 22px;
    box-shadow: 0 8px 32px rgba(13,71,161,0.18), inset 0 2px 8px rgba(255,255,255,0.8);
    border: 3px solid rgba(79,195,247,0.4);
  }

  .washer-top-bar {
    position: absolute;
    top: 12px; left: 12px; right: 12px;
    height: 28px;
    background: linear-gradient(90deg, #4FC3F7, #29B6F6);
    border-radius: 10px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    gap: 6px;
  }

  .washer-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.85);
    flex-shrink: 0;
  }
  .washer-dot:last-child { background: rgba(255,255,255,0.5); margin-left: auto; width: 12px; height: 12px; }

  .washer-drum-wrap {
    position: absolute;
    top: 52px; left: 22px;
    width: 136px; height: 118px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4FC3F7 0%, #0288D1 100%);
    box-shadow: inset 0 4px 16px rgba(0,0,0,0.15), 0 0 0 6px rgba(79,195,247,0.2);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .washer-drum {
    width: 100%; height: 100%;
    border-radius: 50%;
    position: relative;
    animation: spinDrum 3s linear infinite;
  }

  .drum-spoke {
    position: absolute;
    top: 50%; left: 50%;
    width: 88%; height: 3px;
    background: rgba(255,255,255,0.22);
    border-radius: 3px;
    transform-origin: left center;
    margin-top: -1.5px;
    margin-left: -44%;
  }
  .drum-spoke:nth-child(1) { transform: rotate(0deg); }
  .drum-spoke:nth-child(2) { transform: rotate(45deg); }
  .drum-spoke:nth-child(3) { transform: rotate(90deg); }
  .drum-spoke:nth-child(4) { transform: rotate(135deg); }

  .drum-inner {
    position: absolute;
    top: 50%; left: 50%;
    width: 54px; height: 54px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0277BD, #01579B);
    transform: translate(-50%, -50%);
    box-shadow: 0 0 0 5px rgba(255,255,255,0.15), inset 0 2px 8px rgba(0,0,0,0.2);
  }

  .clothes-shape {
    position: absolute;
    border-radius: 50% 40% 60% 30%;
    animation: tumble 3s linear infinite;
  }
  .clothes-shape.c1 {
    width: 36px; height: 24px;
    background: rgba(255,255,255,0.75);
    top: 20px; left: 18px;
  }
  .clothes-shape.c2 {
    width: 28px; height: 18px;
    background: rgba(255,255,255,0.55);
    bottom: 22px; right: 16px;
    animation-delay: -1.5s;
  }
  .clothes-shape.c3 {
    width: 20px; height: 14px;
    background: rgba(255,255,255,0.4);
    top: 50%; left: 60%;
    animation-delay: -0.8s;
  }

  @keyframes spinDrum {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes tumble {
    0%   { transform: rotate(0deg) translate(16px, 0) rotate(0deg); }
    100% { transform: rotate(360deg) translate(16px, 0) rotate(-360deg); }
  }

  .washer-door-ring {
    position: absolute;
    top: 50px; left: 20px;
    width: 140px; height: 120px;
    border-radius: 50%;
    border: 4px solid rgba(79,195,247,0.35);
    pointer-events: none;
  }

  /* ── Bubbles ── */
  .bubble-container {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
  }

  .bubble {
    position: absolute;
    bottom: -40px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), rgba(255,255,255,0.3));
    border: 1.5px solid rgba(255,255,255,0.7);
    animation: floatUp linear infinite;
    opacity: 0;
  }

  .bubble:nth-child(1)  { width:14px;height:14px; left:8%;  animation-duration:5s;  animation-delay:0s;   }
  .bubble:nth-child(2)  { width:9px; height:9px;  left:18%; animation-duration:6.5s;animation-delay:1s;   }
  .bubble:nth-child(3)  { width:18px;height:18px; left:28%; animation-duration:4.5s;animation-delay:2s;   }
  .bubble:nth-child(4)  { width:11px;height:11px; left:40%; animation-duration:7s;  animation-delay:0.5s; }
  .bubble:nth-child(5)  { width:8px; height:8px;  left:55%; animation-duration:5.5s;animation-delay:1.5s; }
  .bubble:nth-child(6)  { width:20px;height:20px; left:65%; animation-duration:6s;  animation-delay:3s;   }
  .bubble:nth-child(7)  { width:12px;height:12px; left:75%; animation-duration:4.8s;animation-delay:0.8s; }
  .bubble:nth-child(8)  { width:7px; height:7px;  left:85%; animation-duration:7.5s;animation-delay:2.5s; }
  .bubble:nth-child(9)  { width:15px;height:15px; left:92%; animation-duration:5.2s;animation-delay:1.2s; }
  .bubble:nth-child(10) { width:10px;height:10px; left:3%;  animation-duration:6.8s;animation-delay:3.5s; }
  .bubble:nth-child(11) { width:13px;height:13px; left:47%; animation-duration:5.8s;animation-delay:4s;   }
  .bubble:nth-child(12) { width:6px; height:6px;  left:70%; animation-duration:4.2s;animation-delay:0.3s; }

  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) scale(0.6); opacity: 0; }
    10%  { opacity: 0.85; }
    80%  { opacity: 0.6; }
    100% { transform: translateY(-105vh) translateX(20px) scale(1.1); opacity: 0; }
  }

  /* ── Hero Text ── */
  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 600px;
  }

  .hero-tagline-small {
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--navy);
    background: rgba(255,255,255,0.6);
    padding: 0.35rem 1rem;
    border-radius: 100px;
    display: inline-block;
    margin-bottom: 1rem;
    backdrop-filter: blur(4px);
  }

  .hero-headline {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(2.6rem, 8vw, 4.2rem);
    font-weight: 800;
    color: var(--navy);
    line-height: 1.1;
    margin-bottom: 0.8rem;
    text-shadow: 0 2px 12px rgba(255,255,255,0.5);
  }

  .hero-headline span {
    background: linear-gradient(90deg, #0D47A1, #0288D1);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-sub {
    font-family: 'Inter', sans-serif;
    font-size: clamp(1rem, 3vw, 1.2rem);
    font-weight: 500;
    color: #1565C0;
    margin-bottom: 2rem;
    opacity: 0.9;
  }

  .hero-ctas {
    display: flex;
    gap: 1rem;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: var(--navy);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    padding: 0.9rem 1.8rem;
    border-radius: 100px;
    text-decoration: none;
    box-shadow: 0 6px 24px rgba(13,71,161,0.35);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 32px rgba(13,71,161,0.45); }
  .btn-primary:active { transform: translateY(0); }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    background: rgba(255,255,255,0.85);
    color: var(--navy);
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    padding: 0.9rem 1.8rem;
    border-radius: 100px;
    text-decoration: none;
    border: 2px solid rgba(13,71,161,0.18);
    box-shadow: 0 4px 16px rgba(79,195,247,0.25);
    backdrop-filter: blur(4px);
    transition: transform 0.2s, box-shadow 0.2s, background 0.2s;
  }
  .btn-secondary:hover { transform: translateY(-3px); background: #fff; box-shadow: 0 8px 24px rgba(79,195,247,0.35); }
  .btn-secondary:active { transform: translateY(0); }

  .hero-scroll-hint {
    position: absolute;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0.3rem;
    color: rgba(13,71,161,0.6);
    font-size: 0.75rem;
