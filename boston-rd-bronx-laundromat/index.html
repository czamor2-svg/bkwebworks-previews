<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ $json.name }} – Fresh. Fast. Easy.</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky: #4FC3F7;
      --aqua: #E0F7FA;
      --navy: #0D47A1;
      --white: #FFFFFF;
      --mid-blue: #29B6F6;
      --soft-gray: #f0f9ff;
      --text-dark: #1a2e4a;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-dark);
      background: var(--white);
      overflow-x: hidden;
    }

    h1, h2, h3, h4 {
      font-family: 'Poppins', sans-serif;
    }

    /* ───────────────────────────────────────────
       HERO
    ─────────────────────────────────────────── */
    #hero {
      min-height: 100vh;
      background: linear-gradient(160deg, #e0f7fa 0%, #b3e5fc 40%, #4FC3F7 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem 4rem;
      position: relative;
      overflow: hidden;
    }

    /* Soft background circles */
    #hero::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(255,255,255,0.35) 0%, transparent 70%);
      top: -150px; right: -150px;
      border-radius: 50%;
    }
    #hero::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
      bottom: -100px; left: -100px;
      border-radius: 50%;
    }

    /* ── Washing Machine CSS Art ── */
    .washer-scene {
      position: relative;
      width: 180px;
      height: 210px;
      margin: 0 auto 2.5rem;
      filter: drop-shadow(0 12px 30px rgba(13,71,161,0.18));
    }

    .washer-body {
      position: absolute;
      bottom: 0; left: 0;
      width: 180px; height: 180px;
      background: linear-gradient(145deg, #ffffff 60%, #e3f2fd 100%);
      border-radius: 22px;
      border: 3px solid rgba(79,195,247,0.4);
      box-shadow: inset 0 4px 12px rgba(255,255,255,0.9), 0 8px 24px rgba(79,195,247,0.3);
    }

    .washer-top {
      position: absolute;
      top: 0; left: 10px;
      width: 160px; height: 28px;
      background: linear-gradient(90deg, #e3f2fd, #b3e5fc);
      border-radius: 12px 12px 0 0;
      border: 3px solid rgba(79,195,247,0.3);
    }

    .washer-panel {
      position: absolute;
      top: 28px; left: 10px;
      width: 160px; height: 30px;
      background: linear-gradient(90deg, #4FC3F7, #29B6F6);
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 14px;
      gap: 8px;
    }

    .panel-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.9);
      box-shadow: 0 0 6px rgba(255,255,255,0.8);
    }
    .panel-dot:first-child { background: #fff; }
    .panel-dot:nth-child(2) { background: rgba(255,255,255,0.6); }

    .washer-drum-wrap {
      position: absolute;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      width: 122px; height: 122px;
      border-radius: 50%;
      background: linear-gradient(135deg, #b3e5fc 0%, #e0f7fa 50%, #81d4fa 100%);
      border: 4px solid rgba(79,195,247,0.5);
      box-shadow: inset 0 4px 16px rgba(79,195,247,0.4), 0 4px 12px rgba(13,71,161,0.12);
      overflow: hidden;
    }

    .washer-drum {
      width: 100%; height: 100%;
      border-radius: 50%;
      animation: spinDrum 3s linear infinite;
      position: relative;
    }

    @keyframes spinDrum {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .drum-hole {
      position: absolute;
      border-radius: 50%;
      background: rgba(13,71,161,0.12);
    }
    .drum-hole:nth-child(1) { width: 22px; height: 22px; top: 12px; left: 46px; }
    .drum-hole:nth-child(2) { width: 18px; height: 18px; top: 42px; left: 12px; }
    .drum-hole:nth-child(3) { width: 18px; height: 18px; top: 42px; right: 12px; }
    .drum-hole:nth-child(4) { width: 22px; height: 22px; bottom: 12px; left: 46px; }
    .drum-hole:nth-child(5) { width: 14px; height: 14px; top: 28px; left: 30px; }
    .drum-hole:nth-child(6) { width: 14px; height: 14px; top: 28px; right: 30px; }

    /* clothes swishing inside drum */
    .clothes-blob {
      position: absolute;
      border-radius: 40% 60% 55% 45% / 50% 40% 60% 50%;
      opacity: 0.55;
    }
    .clothes-blob:nth-child(7) {
      width: 50px; height: 36px;
      background: #ffffff;
      top: 30px; left: 20px;
    }
    .clothes-blob:nth-child(8) {
      width: 40px; height: 28px;
      background: #e3f2fd;
      bottom: 24px; right: 18px;
    }

    .drum-shine {
      position: absolute;
      top: 10px; left: 18px;
      width: 32px; height: 16px;
      background: rgba(255,255,255,0.5);
      border-radius: 50%;
      transform: rotate(-30deg);
    }

    /* ── Bubbles ── */
    .bubbles {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      border: 1.5px solid rgba(255,255,255,0.8);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1); opacity: 0.7; }
      80%  { opacity: 0.4; }
      100% { transform: translateY(-110vh) scale(0.6); opacity: 0; }
    }

    .bubble:nth-child(1)  { width:12px;height:12px; left:8%;  bottom:5%;  animation-duration:7s;  animation-delay:0s; }
    .bubble:nth-child(2)  { width:8px; height:8px;  left:18%; bottom:8%;  animation-duration:9s;  animation-delay:1s; }
    .bubble:nth-child(3)  { width:16px;height:16px; left:30%; bottom:3%;  animation-duration:8s;  animation-delay:2s; }
    .bubble:nth-child(4)  { width:10px;height:10px; left:45%; bottom:6%;  animation-duration:11s; animation-delay:0.5s; }
    .bubble:nth-child(5)  { width:14px;height:14px; left:60%; bottom:4%;  animation-duration:7.5s;animation-delay:3s; }
    .bubble:nth-child(6)  { width:6px; height:6px;  left:72%; bottom:9%;  animation-duration:10s; animation-delay:1.5s; }
    .bubble:nth-child(7)  { width:18px;height:18px; left:82%; bottom:2%;  animation-duration:9s;  animation-delay:0.8s; }
    .bubble:nth-child(8)  { width:9px; height:9px;  left:92%; bottom:7%;  animation-duration:6.5s;animation-delay:2.5s; }
    .bubble:nth-child(9)  { width:11px;height:11px; left:24%; bottom:15%; animation-duration:12s; animation-delay:4s; }
    .bubble:nth-child(10) { width:7px; height:7px;  left:55%; bottom:12%; animation-duration:8.5s;animation-delay:1.2s; }
    .bubble:nth-child(11) { width:13px;height:13px; left:70%; bottom:18%; animation-duration:10s; animation-delay:3.5s; }
    .bubble:nth-child(12) { width:5px; height:5px;  left:38%; bottom:20%; animation-duration:7s;  animation-delay:0.3s; }

    /* ── Hero Text ── */
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 560px;
    }

    .hero-tagline {
      display: inline-block;
      background: rgba(255,255,255,0.35);
      color: var(--navy);
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 50px;
      margin-bottom: 1rem;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.5);
    }

    .hero-headline {
      font-size: clamp(2.4rem, 8vw, 3.8rem);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.1;
      margin-bottom: 1rem;
      text-shadow: 0 2px 20px rgba(255,255,255,0.4);
    }

    .hero-subheadline {
      font-size: clamp(1rem, 3vw, 1.2rem);
      color: rgba(13,71,161,0.8);
      font-weight: 500;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .hero-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn:hover { transform: translateY(-3px); }

    .btn-primary {
      background: var(--navy);
      color: var(--white);
      box-shadow: 0 6px 24px rgba(13,71,161,0.35);
    }
    .btn-primary:hover { box-shadow: 0 10px 32px rgba(13,71,161,0.45); }

    .btn-secondary {
      background: var(--white);
      color: var(--navy);
      box-shadow: 0 6px 24px rgba(255,255,255,0.5);
      border: 2px solid rgba(79,195,247,0.4);
    }
    .btn-secondary:hover { box-shadow: 0 10px 32px rgba(79,195,247,0.4); }

    /* ── Scroll hint ── */
    .scroll-hint {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      color: rgba(13,71,161,0.6);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-weight: 600;
    }

    .scroll-arrow {
      width: 24px; height: 24px;
      border-right: 2.5px solid rgba(13,71,161,0.5);
      border-bottom: 2.5px solid rgba(13,71,161,0.5);
      transform: rotate(45deg);
      animation: bounce 1.6s ease-in-out infinite;
    }

    @keyframes bounce {
      0%,100% { transform: rotate(45deg) translateY(0); }
      50%      { transform: rotate(45deg) translateY(6px); }
    }

    /* ───────────────────────────────────────────
       SECTION SHARED STYLES
    ─────────────────────────────────────────── */
    section {
      padding: 5rem 1.5rem;
