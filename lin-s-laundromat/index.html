<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ $json.name }} – Fresh. Fast. Easy.</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky: #4FC3F7;
      --aqua: #E0F7FA;
      --navy: #0D47A1;
      --navy-light: #1565C0;
      --white: #FFFFFF;
      --soft-gray: #F5FEFF;
      --text-body: #37474F;
      --shadow: 0 8px 32px rgba(79,195,247,0.15);
      --shadow-card: 0 4px 24px rgba(13,71,161,0.10);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-body);
      background: var(--white);
      overflow-x: hidden;
    }

    h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

    /* ─── HERO ─── */
    #hero {
      min-height: 100vh;
      background: linear-gradient(160deg, #E0F7FA 0%, #B3E5FC 40%, #4FC3F7 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem 3rem;
      position: relative;
      overflow: hidden;
    }

    /* Background cloud blobs */
    #hero::before {
      content: '';
      position: absolute;
      top: -80px; right: -80px;
      width: 340px; height: 340px;
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      filter: blur(60px);
    }
    #hero::after {
      content: '';
      position: absolute;
      bottom: -60px; left: -60px;
      width: 280px; height: 280px;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      filter: blur(50px);
    }

    /* ── Washing Machine CSS Art ── */
    .washing-machine-wrap {
      position: relative;
      width: 180px;
      height: 200px;
      margin-bottom: 2rem;
      z-index: 2;
    }

    .wm-body {
      position: absolute;
      bottom: 0; left: 0;
      width: 180px; height: 180px;
      background: linear-gradient(145deg, #FFFFFF, #E3F2FD);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(13,71,161,0.18), inset 0 2px 8px rgba(255,255,255,0.8);
    }

    .wm-top-bar {
      position: absolute;
      top: 0; left: 0;
      width: 180px; height: 28px;
      background: linear-gradient(90deg, #90CAF9, #64B5F6);
      border-radius: 20px 20px 0 0;
    }

    .wm-dot {
      position: absolute;
      top: 8px;
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #FFFFFF;
      opacity: 0.8;
    }
    .wm-dot:nth-child(1) { left: 14px; }
    .wm-dot:nth-child(2) { left: 32px; background: #4FC3F7; }

    .wm-drum-ring {
      position: absolute;
      top: 38px; left: 50%;
      transform: translateX(-50%);
      width: 114px; height: 114px;
      border-radius: 50%;
      background: linear-gradient(145deg, #1565C0, #0D47A1);
      box-shadow: 0 4px 16px rgba(13,71,161,0.4), inset 0 2px 8px rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .wm-drum {
      width: 96px; height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4FC3F7 0%, #0288D1 50%, #01579B 100%);
      animation: spin-drum 3s linear infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    .wm-drum::before {
      content: '';
      position: absolute;
      width: 100%; height: 100%;
      background: repeating-conic-gradient(rgba(255,255,255,0.08) 0deg 30deg, transparent 30deg 60deg);
      border-radius: 50%;
    }

    /* clothes shapes inside drum */
    .wm-cloth {
      position: absolute;
      border-radius: 50px;
      opacity: 0.85;
    }
    .wm-cloth:nth-child(1) {
      width: 38px; height: 14px;
      background: #FFFFFF;
      top: 20px; left: 18px;
      transform: rotate(-20deg);
    }
    .wm-cloth:nth-child(2) {
      width: 30px; height: 12px;
      background: #E1F5FE;
      bottom: 22px; right: 16px;
      transform: rotate(15deg);
    }
    .wm-cloth:nth-child(3) {
      width: 22px; height: 10px;
      background: #FFFFFF;
      bottom: 36px; left: 20px;
      transform: rotate(40deg);
    }

    .wm-drum-center {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      border: 3px solid rgba(255,255,255,0.4);
      z-index: 1;
    }

    @keyframes spin-drum {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* water ripple at bottom of drum */
    .wm-water {
      position: absolute;
      bottom: 12px; left: 50%;
      transform: translateX(-50%);
      width: 100px; height: 16px;
      background: rgba(79,195,247,0.3);
      border-radius: 50%;
      filter: blur(4px);
      animation: water-pulse 2s ease-in-out infinite;
    }

    @keyframes water-pulse {
      0%, 100% { opacity: 0.3; transform: translateX(-50%) scaleX(1); }
      50% { opacity: 0.6; transform: translateX(-50%) scaleX(1.1); }
    }

    /* ── Bubbles ── */
    .bubbles {
      position: absolute;
      bottom: 160px;
      left: 50%;
      transform: translateX(-50%);
      width: 200px;
      height: 200px;
      pointer-events: none;
      z-index: 1;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      border: 1.5px solid rgba(255,255,255,0.8);
      animation: float-up linear infinite;
    }

    .bubble:nth-child(1)  { width:10px; height:10px; left:40px;  animation-duration:2.8s; animation-delay:0s;    bottom:0; }
    .bubble:nth-child(2)  { width:7px;  height:7px;  left:80px;  animation-duration:2.2s; animation-delay:0.4s;  bottom:0; }
    .bubble:nth-child(3)  { width:13px; height:13px; left:120px; animation-duration:3.1s; animation-delay:0.9s;  bottom:0; }
    .bubble:nth-child(4)  { width:6px;  height:6px;  left:60px;  animation-duration:2.5s; animation-delay:1.3s;  bottom:0; }
    .bubble:nth-child(5)  { width:9px;  height:9px;  left:100px; animation-duration:2.9s; animation-delay:0.6s;  bottom:0; }
    .bubble:nth-child(6)  { width:5px;  height:5px;  left:30px;  animation-duration:2.0s; animation-delay:1.7s;  bottom:0; }
    .bubble:nth-child(7)  { width:11px; height:11px; left:145px; animation-duration:3.3s; animation-delay:0.2s;  bottom:0; }
    .bubble:nth-child(8)  { width:8px;  height:8px;  left:15px;  animation-duration:2.6s; animation-delay:1.1s;  bottom:0; }

    @keyframes float-up {
      0%   { transform: translateY(0) scale(1);   opacity: 0.8; }
      80%  { opacity: 0.5; }
      100% { transform: translateY(-180px) scale(0.6); opacity: 0; }
    }

    /* ── Hero Text ── */
    .hero-content {
      position: relative;
      z-index: 3;
      max-width: 540px;
    }

    .hero-headline {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(2.4rem, 8vw, 4rem);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.15;
      margin-bottom: 0.75rem;
      letter-spacing: -0.5px;
    }

    .hero-headline span {
      color: var(--navy-light);
      display: block;
    }

    .hero-sub {
      font-size: clamp(1rem, 3vw, 1.2rem);
      color: #1565C0;
      font-weight: 500;
      margin-bottom: 0.4rem;
      opacity: 0.9;
    }

    .hero-tagline {
      font-size: clamp(0.9rem, 2.5vw, 1rem);
      color: #0277BD;
      margin-bottom: 2.2rem;
      opacity: 0.8;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 1.8rem;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      white-space: nowrap;
    }

    .btn:hover { transform: translateY(-3px); }

    .btn-primary {
      background: var(--navy);
      color: var(--white);
      box-shadow: 0 6px 20px rgba(13,71,161,0.35);
    }
    .btn-primary:hover { box-shadow: 0 10px 28px rgba(13,71,161,0.45); }

    .btn-secondary {
      background: var(--white);
      color: var(--navy);
      box-shadow: 0 6px 20px rgba(79,195,247,0.3);
    }
    .btn-secondary:hover { box-shadow: 0 10px 28px rgba(79,195,247,0.45); }

    /* ─── SCROLL ARROW ─── */
    .scroll-hint {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      opacity: 0.6;
      animation: bounce-down 2s ease-in-out infinite;
    }

    .scroll-hint span {
      font-size: 0.7rem;
      font-family: 'Inter', sans-serif;
      color: var(--navy);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .scroll-arrow {
      width: 20px; height: 20px;
      border-right: 2.5px solid var(--navy);
      border-bottom: 2.5px solid var(--navy);
      transform: rotate(45deg);
    }

    @keyframes bounce-down {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(8px); }
    }

    /* ─── SECTION BASE ─── */
    section { padding: 5rem 1.5rem; }

    .section-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    .section-label {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--sky);
      margin-bottom: 0.5rem;
      font-family: 'Inter', sans-serif;
    }

    .section-title {
      font-size: clamp(1.7rem, 5vw, 2.5rem);
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 1rem;
      line-height: 1.25;
    }

    .section-desc {
      font-size: 1.05rem;
      color: var(--text-body);
      max-width: 560px;
      line-height: 1.75;
      margin-bottom: 2.5rem;
    }

    /* ─── SERVICES ─── */
    #services {
      background: var(--soft-gray);
    }

      display: grid;
      grid-template-columns:
