<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ $json.name }} – Fresh. Fast. Easy.</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #4FC3F7;
      --navy: #0D47A1;
      --aqua: #E0F7FA;
      --white: #FFFFFF;
      --soft-blue: #B3E5FC;
      --mid-blue: #29B6F6;
      --text-dark: #1A237E;
      --text-body: #37474F;
      --shadow: 0 8px 32px rgba(13,71,161,0.10);
      --radius: 20px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-body);
      background: var(--white);
      overflow-x: hidden;
    }

    h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

    /* ─── HERO ─────────────────────────────────────────────── */
    .hero {
      min-height: 100vh;
      background: linear-gradient(160deg, #E0F7FA 0%, #B3E5FC 40%, #4FC3F7 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px 60px;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    /* Background circles */
    .hero::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      top: -150px; right: -150px;
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      bottom: -100px; left: -100px;
      pointer-events: none;
    }

    /* ── Washing Machine ── */
    .washing-machine-wrap {
      position: relative;
      width: 200px;
      height: 230px;
      margin-bottom: 36px;
      flex-shrink: 0;
    }

    .machine-body {
      position: absolute;
      bottom: 0; left: 0;
      width: 200px; height: 210px;
      background: linear-gradient(145deg, #ffffff 60%, #e3f2fd 100%);
      border-radius: 24px;
      box-shadow: 0 12px 40px rgba(13,71,161,0.18), inset 0 2px 8px rgba(255,255,255,0.8);
    }

    .machine-top {
      position: absolute;
      top: 0; left: 10px;
      width: 180px; height: 26px;
      background: linear-gradient(90deg, #B3E5FC, #81D4FA);
      border-radius: 14px 14px 0 0;
    }

    .machine-panel {
      position: absolute;
      top: 14px; right: 18px;
      display: flex; gap: 6px; align-items: center;
    }

    .panel-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
    }
    .panel-dot:nth-child(1) { background: #4FC3F7; }
    .panel-dot:nth-child(2) { background: #29B6F6; }
    .panel-dot:nth-child(3) { background: #0288D1; }

    .drum-outer {
      position: absolute;
      top: 40px; left: 50%;
      transform: translateX(-50%);
      width: 140px; height: 140px;
      border-radius: 50%;
      background: linear-gradient(145deg, #E3F2FD, #B3E5FC);
      border: 6px solid #81D4FA;
      box-shadow: inset 0 4px 16px rgba(79,195,247,0.25), 0 4px 16px rgba(13,71,161,0.12);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    .drum-inner {
      width: 110px; height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #4FC3F7 0%, #0288D1 100%);
      position: relative;
      animation: spin 3s linear infinite;
      display: flex; align-items: center; justify-content: center;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .drum-spoke {
      position: absolute;
      width: 100%; height: 3px;
      background: rgba(255,255,255,0.30);
      top: 50%; transform: translateY(-50%);
    }
    .drum-spoke:nth-child(2) { transform: translateY(-50%) rotate(60deg); }
    .drum-spoke:nth-child(3) { transform: translateY(-50%) rotate(120deg); }

    .drum-center {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: rgba(255,255,255,0.90);
      z-index: 2;
      box-shadow: 0 2px 8px rgba(13,71,161,0.18);
    }

    /* Clothes shapes inside drum */
    .clothes {
      position: absolute;
      border-radius: 50% 50% 40% 40%;
      opacity: 0.85;
    }
    .clothes-1 {
      width: 38px; height: 22px;
      background: #fff;
      top: 18px; left: 12px;
      transform: rotate(-15deg);
    }
    .clothes-2 {
      width: 30px; height: 18px;
      background: #e3f2fd;
      bottom: 20px; right: 14px;
      transform: rotate(20deg);
    }

    .machine-door-ring {
      position: absolute;
      top: 38px; left: 50%;
      transform: translateX(-50%);
      width: 148px; height: 148px;
      border-radius: 50%;
      border: 3px solid rgba(79,195,247,0.5);
    }

    .machine-bottom {
      position: absolute;
      bottom: 14px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 10px;
    }
    .machine-knob {
      width: 26px; height: 10px;
      border-radius: 5px;
      background: linear-gradient(90deg, #B3E5FC, #4FC3F7);
    }
    .machine-knob:nth-child(2) { width: 40px; }

    /* ── Bubbles ── */
    .bubbles { position: absolute; bottom: 220px; left: 50%; transform: translateX(-50%); width: 200px; pointer-events: none; }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.60);
      border: 1px solid rgba(255,255,255,0.80);
      animation: floatUp 4s ease-in infinite;
      opacity: 0;
    }
    .bubble:nth-child(1)  { width:14px;height:14px; left:30px;  animation-delay:0s;    animation-duration:3.8s; }
    .bubble:nth-child(2)  { width:10px;height:10px; left:70px;  animation-delay:0.6s;  animation-duration:4.2s; }
    .bubble:nth-child(3)  { width:18px;height:18px; left:110px; animation-delay:1.2s;  animation-duration:3.5s; }
    .bubble:nth-child(4)  { width:8px; height:8px;  left:50px;  animation-delay:1.8s;  animation-duration:4.5s; }
    .bubble:nth-child(5)  { width:12px;height:12px; left:90px;  animation-delay:2.4s;  animation-duration:4.0s; }
    .bubble:nth-child(6)  { width:16px;height:16px; left:20px;  animation-delay:3.0s;  animation-duration:3.6s; }

    @keyframes floatUp {
      0%   { transform: translateY(0) scale(0.8); opacity: 0; }
      15%  { opacity: 0.8; }
      80%  { opacity: 0.5; }
      100% { transform: translateY(-160px) scale(1.1); opacity: 0; }
    }

    /* ── Hero Text ── */
    .hero-content { position: relative; z-index: 2; }

    .hero-headline {
      font-size: clamp(2.4rem, 8vw, 4rem);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.15;
      letter-spacing: -1px;
      text-shadow: 0 2px 12px rgba(255,255,255,0.6);
      margin-bottom: 16px;
    }

    .hero-sub {
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      font-weight: 500;
      color: var(--text-dark);
      margin-bottom: 10px;
      opacity: 0.85;
    }

    .hero-tagline {
      font-size: clamp(0.9rem, 3vw, 1rem);
      color: var(--navy);
      opacity: 0.65;
      margin-bottom: 36px;
    }

    .hero-btns {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 16px 32px;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      cursor: pointer;
      border: none;
    }
    .btn:hover { transform: translateY(-3px); }

    .btn-primary {
      background: var(--navy);
      color: #fff;
      box-shadow: 0 8px 24px rgba(13,71,161,0.30);
    }
    .btn-primary:hover { box-shadow: 0 12px 32px rgba(13,71,161,0.40); }

    .btn-secondary {
      background: #fff;
      color: var(--navy);
      box-shadow: 0 8px 24px rgba(13,71,161,0.15);
    }
    .btn-secondary:hover { box-shadow: 0 12px 32px rgba(13,71,161,0.22); }

    .scroll-hint {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--navy);
      opacity: 0.5;
      font-size: 0.75rem;
      font-family: 'Poppins', sans-serif;
      animation: bounce 2s ease infinite;
    }
    .scroll-hint span { font-size: 1.4rem; }
    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(6px); }
    }

    /* ─── SECTIONS SHARED ───────────────────────────────────── */
    section { padding: 80px 20px; }

    .section-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    .section-title {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 700;
      color: var(--navy);
      text-align: center;
      margin-bottom: 12px;
    }

    .section-sub {
      text-align: center;
      color: var(--text-body);
      font-size: 1.05rem;
      margin-bottom: 48px;
      opacity: 0.8;
    }

    /* ─── SERVICES ──────────────────────────────────────────── */
    .services { background: var(--white); }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 24px;
    }

    .service-card {
      background: var(--aqua);
      border-radius: var(--radius);
      padding: 32px 20px;
      text-align: center;
      box-shadow: var(--shadow);
      transition: transform 0.25s ease, box-shadow 0.25s ease;
    }
    .service-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 48px rgba(13,71,161,0.14);
    }

    .service-icon {
      font-size: 2.6rem;
      margin-bottom: 16px;
      display: block;
    }

    .service-card h3 {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--navy);
      margin-bottom: 8px;
    }

    .service-card p {
      font-size: 0.9rem;
      color: var(--text-body);
      line-height: 1.6;
    }

    /* ─── CONVENIENCE ───────────────────────────────────────── */
    .convenience { background: linear-gradient(135deg, #E0F7FA 0%, #B3E5FC 100%); }

    .convenience-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax
