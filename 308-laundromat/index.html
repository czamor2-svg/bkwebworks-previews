<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ $json.name }} – Fresh. Fast. Easy.</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky: #4FC3F7;
      --aqua: #E0F7FA;
      --navy: #0D47A1;
      --navy-light: #1565C0;
      --white: #FFFFFF;
      --soft-gray: #F5FBFF;
      --text-dark: #0D2B5E;
      --text-mid: #3A5A8C;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--white);
      color: var(--text-dark);
      overflow-x: hidden;
    }

    h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      background: linear-gradient(160deg, #B3E5FC 0%, #E0F7FA 45%, #ffffff 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem 3rem;
      position: relative;
      overflow: hidden;
    }

    /* floating background blobs */
    .hero::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: radial-gradient(circle, rgba(79,195,247,0.18) 0%, transparent 70%);
      top: -150px; left: -150px;
      border-radius: 50%;
      animation: blobDrift 8s ease-in-out infinite alternate;
    }
    .hero::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: radial-gradient(circle, rgba(79,195,247,0.13) 0%, transparent 70%);
      bottom: -100px; right: -100px;
      border-radius: 50%;
      animation: blobDrift 11s ease-in-out infinite alternate-reverse;
    }
    @keyframes blobDrift {
      from { transform: translate(0,0) scale(1); }
      to   { transform: translate(40px,30px) scale(1.08); }
    }

    /* ── WASHING MACHINE GRAPHIC ── */
    .machine-wrap {
      position: relative;
      width: 180px;
      height: 200px;
      margin: 0 auto 2rem;
      z-index: 2;
    }

    /* machine body */
    .machine-body {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 170px;
      background: linear-gradient(145deg, #ffffff, #cde8f8);
      border-radius: 18px;
      box-shadow: 0 8px 32px rgba(13,71,161,0.18), 0 2px 8px rgba(79,195,247,0.15);
    }

    /* top panel */
    .machine-panel {
      position: absolute;
      top: 8px; left: 10px; right: 10px;
      height: 22px;
      background: linear-gradient(90deg, #4FC3F7, #81D4FA);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 8px;
      gap: 5px;
    }
    .panel-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--white);
      opacity: 0.85;
    }
    .panel-dot:first-child { background: #B3E5FC; }

    /* porthole ring */
    .porthole-ring {
      position: absolute;
      top: 38px; left: 50%;
      transform: translateX(-50%);
      width: 90px; height: 90px;
      border-radius: 50%;
      background: linear-gradient(145deg, #90CAF9, #4FC3F7);
      box-shadow: 0 4px 16px rgba(13,71,161,0.2), inset 0 2px 6px rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* drum */
    .drum {
      width: 72px; height: 72px;
      border-radius: 50%;
      background: linear-gradient(145deg, #E3F2FD, #BBDEFB);
      border: 3px solid rgba(79,195,247,0.5);
      position: relative;
      animation: spin 3s linear infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* clothes suggestion inside drum */
    .drum-cloth {
      position: absolute;
      border-radius: 50%;
      background: var(--white);
      opacity: 0.55;
    }
    .drum-cloth:nth-child(1) { width:28px;height:22px; top:10px; left:8px; }
    .drum-cloth:nth-child(2) { width:22px;height:18px; bottom:8px; right:6px; }
    .drum-cloth:nth-child(3) { width:18px;height:14px; top:24px; right:10px; background:#B3E5FC; }

    /* drum holes */
    .drum::before, .drum::after {
      content: '';
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      border: 2px solid rgba(79,195,247,0.6);
    }
    .drum::before { top: 12px; left: 50%; transform: translateX(-50%); }
    .drum::after  { bottom: 12px; left: 50%; transform: translateX(-50%); }

    /* bottom of machine */
    .machine-bottom {
      position: absolute;
      bottom: 10px; left: 14px; right: 14px;
      display: flex; gap: 6px; justify-content: center;
    }
    .machine-btn {
      width: 22px; height: 8px;
      border-radius: 4px;
      background: linear-gradient(90deg, #4FC3F7, #81D4FA);
    }
    .machine-btn:first-child { background: #B3E5FC; }

    /* door handle */
    .door-handle {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      width: 6px;
      height: 28px;
      background: linear-gradient(180deg, #90CAF9, #4FC3F7);
      border-radius: 3px;
    }

    /* ── BUBBLES ── */
    .bubbles { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .bubble {
      position: absolute;
      bottom: -40px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.85), rgba(79,195,247,0.3));
      border: 1px solid rgba(255,255,255,0.6);
      animation: rise linear infinite;
    }
    .bubble:nth-child(1)  { width:14px;height:14px; left:10%;  animation-duration:7s;  animation-delay:0s;   }
    .bubble:nth-child(2)  { width:9px; height:9px;  left:20%;  animation-duration:9s;  animation-delay:1.5s; }
    .bubble:nth-child(3)  { width:18px;height:18px; left:32%;  animation-duration:6s;  animation-delay:0.8s; }
    .bubble:nth-child(4)  { width:11px;height:11px; left:47%;  animation-duration:8s;  animation-delay:2.2s; }
    .bubble:nth-child(5)  { width:7px; height:7px;  left:60%;  animation-duration:10s; animation-delay:0.3s; }
    .bubble:nth-child(6)  { width:15px;height:15px; left:72%;  animation-duration:7.5s;animation-delay:1s;   }
    .bubble:nth-child(7)  { width:10px;height:10px; left:83%;  animation-duration:9s;  animation-delay:3s;   }
    .bubble:nth-child(8)  { width:20px;height:20px; left:90%;  animation-duration:6.5s;animation-delay:0.5s; }
    .bubble:nth-child(9)  { width:8px; height:8px;  left:5%;   animation-duration:11s; animation-delay:2s;   }
    .bubble:nth-child(10) { width:13px;height:13px; left:55%;  animation-duration:8.5s;animation-delay:4s;   }
    @keyframes rise {
      0%   { transform: translateY(0)    translateX(0)    scale(1);   opacity: 0; }
      10%  { opacity: 0.8; }
      90%  { opacity: 0.5; }
      100% { transform: translateY(-110vh) translateX(20px) scale(0.6); opacity: 0; }
    }

    /* ── HERO TEXT ── */
    .hero-content { position: relative; z-index: 2; max-width: 560px; }
    .hero-tag {
      display: inline-block;
      background: rgba(79,195,247,0.2);
      color: var(--navy);
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 100px;
      margin-bottom: 1rem;
      border: 1px solid rgba(79,195,247,0.4);
    }
    .hero h1 {
      font-size: clamp(2.4rem, 7vw, 4rem);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.1;
      margin-bottom: 0.8rem;
      letter-spacing: -0.02em;
    }
    .hero h1 span { color: var(--sky); }
    .hero-sub {
      font-size: 1.05rem;
      color: var(--text-mid);
      font-weight: 500;
      margin-bottom: 2.2rem;
      line-height: 1.5;
    }
    .hero-sub strong { color: var(--navy); }

    /* ── BUTTONS ── */
    .btn-group { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 1.8rem;
      border-radius: 100px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s;
      cursor: pointer;
      border: none;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn-primary {
      background: linear-gradient(135deg, var(--navy-light), var(--navy));
      color: var(--white);
      box-shadow: 0 6px 20px rgba(13,71,161,0.35);
    }
    .btn-primary:hover { box-shadow: 0 10px 28px rgba(13,71,161,0.45); }
    .btn-secondary {
      background: var(--white);
      color: var(--navy);
      box-shadow: 0 4px 16px rgba(13,71,161,0.15);
      border: 2px solid rgba(79,195,247,0.5);
    }
    .btn-secondary:hover { box-shadow: 0 8px 24px rgba(79,195,247,0.3); }

    /* ── SCROLL HINT ── */
    .scroll-hint {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      color: var(--text-mid);
      font-size: 0.75rem;
      font-weight: 500;
      letter-spacing: 0.08em;
      z-index: 2;
      opacity: 0.7;
    }
    .scroll-arrow {
      width: 20px; height: 20px;
      border-right: 2px solid var(--sky);
      border-bottom: 2px solid var(--sky);
      transform: rotate(45deg);
      animation: bounce 1.6s ease-in-out infinite;
    }
    @keyframes bounce {
      0%,100% { transform: rotate(45deg) translateY(0); }
      50%      { transform: rotate(45deg) translateY(5px); }
    }

    /* ── SECTIONS SHARED ── */
    section { padding: 5rem 1.5rem; }
    .section-label {
      font-family: 'Poppins', sans-serif;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--sky);
      margin-bottom: 0.6rem;
    }
    .section-title {
      font-size: clamp(1.7rem, 4.5vw, 2.6rem);
      font-weight: 700;
      color: var(--navy);
      line-height: 1.2;
      margin-bottom: 1rem
