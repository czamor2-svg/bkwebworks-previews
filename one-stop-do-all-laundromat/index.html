<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ $json.name }} – Fresh. Fast. Easy.</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky: #4FC3F7;
      --aqua: #E0F7FA;
      --aqua-mid: #B2EBF2;
      --navy: #0D47A1;
      --navy-light: #1565C0;
      --white: #FFFFFF;
      --text: #1a1a2e;
      --text-light: #455a64;
      --shadow: 0 4px 24px rgba(13,71,161,0.10);
      --shadow-lg: 0 8px 40px rgba(13,71,161,0.15);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--white);
      color: var(--text);
      overflow-x: hidden;
    }

    h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

    /* ─── HERO ─────────────────────────────────────────── */
    .hero {
      min-height: 100vh;
      background: linear-gradient(160deg, #e0f7fa 0%, #b3e5fc 40%, #e1f5fe 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem 3rem;
      position: relative;
      overflow: hidden;
    }

    /* Background bubbles */
    .hero-bg-bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      animation: floatUp linear infinite;
    }
    .hero-bg-bubble:nth-child(1)  { width:80px;  height:80px;  left:8%;   bottom:-80px;  animation-duration:9s;  animation-delay:0s; }
    .hero-bg-bubble:nth-child(2)  { width:50px;  height:50px;  left:18%;  bottom:-50px;  animation-duration:7s;  animation-delay:1.5s; }
    .hero-bg-bubble:nth-child(3)  { width:120px; height:120px; left:75%;  bottom:-120px; animation-duration:11s; animation-delay:0.5s; }
    .hero-bg-bubble:nth-child(4)  { width:40px;  height:40px;  left:55%;  bottom:-40px;  animation-duration:8s;  animation-delay:3s; }
    .hero-bg-bubble:nth-child(5)  { width:65px;  height:65px;  left:88%;  bottom:-65px;  animation-duration:10s; animation-delay:2s; }
    .hero-bg-bubble:nth-child(6)  { width:30px;  height:30px;  left:40%;  bottom:-30px;  animation-duration:6s;  animation-delay:4s; }
    .hero-bg-bubble:nth-child(7)  { width:90px;  height:90px;  left:30%;  bottom:-90px;  animation-duration:12s; animation-delay:1s; }

    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1);   opacity: 0; }
      10%  { opacity: 0.6; }
      90%  { opacity: 0.2; }
      100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
    }

    /* Washing Machine */
    .washer-wrap {
      position: relative;
      width: 180px;
      height: 190px;
      margin: 0 auto 2.5rem;
      filter: drop-shadow(0 12px 32px rgba(79,195,247,0.35));
    }

    .washer-body {
      position: absolute;
      bottom: 0; left: 0;
      width: 180px;
      height: 180px;
      background: linear-gradient(145deg, #ffffff, #e0f7fa);
      border-radius: 22px;
      border: 3px solid #b3e5fc;
      box-shadow: inset 0 2px 8px rgba(79,195,247,0.2), 0 8px 32px rgba(79,195,247,0.25);
    }

    .washer-top-panel {
      position: absolute;
      top: 10px; left: 14px; right: 14px;
      height: 28px;
      background: linear-gradient(90deg, #4FC3F7, #29B6F6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      gap: 6px;
    }

    .washer-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
    }
    .washer-dot.on { background: #fff; box-shadow: 0 0 6px #fff; animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:0.4;} }

    .washer-drum-outer {
      position: absolute;
      top: 50px; left: 50%; transform: translateX(-50%);
      width: 110px; height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e0f7fa, #b3e5fc);
      border: 4px solid #4FC3F7;
      box-shadow: inset 0 4px 16px rgba(79,195,247,0.4), 0 4px 12px rgba(79,195,247,0.2);
      overflow: hidden;
      display: flex; align-items: center; justify-content: center;
    }

    .washer-drum-inner {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0288D1, #4FC3F7, #29B6F6);
      animation: spin 4s linear infinite;
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    .drum-spoke {
      position: absolute;
      width: 70px; height: 3px;
      background: rgba(255,255,255,0.3);
      border-radius: 2px;
      top: 50%; left: 50%;
      transform-origin: left center;
      margin-top: -1.5px;
    }
    .drum-spoke:nth-child(1) { transform: rotate(0deg)   translateX(-50%); }
    .drum-spoke:nth-child(2) { transform: rotate(60deg)  translateX(-50%); }
    .drum-spoke:nth-child(3) { transform: rotate(120deg) translateX(-50%); }

    .drum-clothes {
      position: absolute;
      width: 44px; height: 32px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      top: 28px; left: 22px;
    }

    .drum-center-dot {
      width: 16px; height: 16px;
      border-radius: 50%;
      background: rgba(255,255,255,0.5);
      border: 2px solid rgba(255,255,255,0.8);
      z-index: 2;
    }

    .washer-porthole-ring {
      position: absolute;
      top: 46px; left: 50%; transform: translateX(-50%);
      width: 118px; height: 118px;
      border-radius: 50%;
      border: 3px solid rgba(79,195,247,0.6);
      pointer-events: none;
    }

    .washer-bottom {
      position: absolute;
      bottom: 14px; left: 14px; right: 14px;
      height: 10px;
      background: #b3e5fc;
      border-radius: 6px;
    }

    /* Bubbles from drum */
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.7);
      border: 1px solid rgba(79,195,247,0.5);
      animation: bubbleFloat ease-in infinite;
    }
    .bubble:nth-child(1) { width:14px; height:14px; left:60px;  bottom:190px; animation-duration:3s;   animation-delay:0s; }
    .bubble:nth-child(2) { width:9px;  height:9px;  left:100px; bottom:190px; animation-duration:2.5s; animation-delay:0.8s; }
    .bubble:nth-child(3) { width:18px; height:18px; left:80px;  bottom:190px; animation-duration:3.5s; animation-delay:1.5s; }
    .bubble:nth-child(4) { width:11px; height:11px; left:50px;  bottom:190px; animation-duration:2.8s; animation-delay:2.2s; }
    .bubble:nth-child(5) { width:7px;  height:7px;  left:115px; bottom:190px; animation-duration:2.2s; animation-delay:0.4s; }

    @keyframes bubbleFloat {
      0%   { transform: translateY(0) translateX(0) scale(1); opacity:0.8; }
      50%  { transform: translateY(-60px) translateX(10px) scale(1.1); opacity:0.6; }
      100% { transform: translateY(-130px) translateX(-5px) scale(0.6); opacity:0; }
    }

    /* Hero text */
    .hero-content { position: relative; z-index: 2; }

    .hero h1 {
      font-size: clamp(2.4rem, 7vw, 4.2rem);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.1;
      letter-spacing: -0.02em;
      margin-bottom: 0.75rem;
    }

    .hero h1 span { color: var(--sky); }

    .hero-sub {
      font-size: clamp(1rem, 3vw, 1.2rem);
      color: var(--navy-light);
      font-weight: 500;
      margin-bottom: 2.2rem;
      opacity: 0.85;
    }

    .hero-btns {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border: none;
    }

    .btn:hover { transform: translateY(-3px); }

    .btn-primary {
      background: linear-gradient(135deg, var(--navy), var(--navy-light));
      color: var(--white);
      box-shadow: 0 6px 20px rgba(13,71,161,0.35);
    }
    .btn-primary:hover { box-shadow: 0 10px 28px rgba(13,71,161,0.45); }

    .btn-secondary {
      background: var(--white);
      color: var(--navy);
      box-shadow: 0 6px 20px rgba(13,71,161,0.15);
      border: 2px solid var(--sky);
    }
    .btn-secondary:hover { box-shadow: 0 10px 28px rgba(79,195,247,0.35); }

    /* Scroll indicator */
    .scroll-hint {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.3rem;
      color: var(--navy-light);
      font-size: 0.75rem;
      font-family: 'Inter', sans-serif;
      opacity: 0.6;
      animation: bounce 2s ease-in-out infinite;
    }

    .scroll-arrow {
      width: 20px; height: 20px;
      border-right: 2px solid var(--navy-light);
      border-bottom: 2px solid var(--navy-light);
      transform: rotate(45deg);
    }

    @keyframes bounce { 0%,100%{transform:translateX(-50%) translateY(0);} 50%{transform:translateX(-50%) translateY(8px);} }

    /* ─── SECTIONS SHARED ───────────────────────────────── */
    section { padding: 5rem 1.5rem; }

    .section-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    .section-tag {
      display: inline-block;
      background: var(--aqua);
      color: var(--navy);
      font-family: 'Poppins', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 50px;
      margin-bottom: 1rem;
    }

    .section-title {
      font-size: clamp(1.7rem, 4.5vw, 2.4rem);
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 1rem;
      line-height: 1.2;
    }

    .section-desc {
      color: var(--text-light);
      font-size: 1.05rem;
      line-height: 1.7;
      max-width: 600px;
    }

    .fade-in {
      opacity: 0;
      transform:
