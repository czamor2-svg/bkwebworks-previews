<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ $json.name }} – Fresh. Fast. Easy.</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky: #4FC3F7;
      --sky-dark: #0288D1;
      --aqua: #E0F7FA;
      --aqua-mid: #B2EBF2;
      --navy: #0D47A1;
      --navy-light: #1565C0;
      --white: #FFFFFF;
      --text: #1A237E;
      --text-light: #37474F;
      --shadow: 0 8px 32px rgba(13,71,161,0.10);
      --shadow-soft: 0 2px 12px rgba(79,195,247,0.13);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--white);
      color: var(--text);
      overflow-x: hidden;
    }

    /* ───────────── HERO ───────────── */
    #hero {
      min-height: 100vh;
      background: linear-gradient(160deg, #E0F7FA 0%, #B2EBF2 40%, #4FC3F7 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem 3rem;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    /* background soft circles */
    #hero::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      background: rgba(255,255,255,0.18);
      border-radius: 50%;
      top: -180px; right: -180px;
      pointer-events: none;
    }
    #hero::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
      bottom: -120px; left: -100px;
      pointer-events: none;
    }

    /* ── WASHING MACHINE ── */
    .machine-wrap {
      position: relative;
      width: 180px;
      height: 200px;
      margin-bottom: 2rem;
      filter: drop-shadow(0 12px 28px rgba(13,71,161,0.18));
    }

    /* Cabinet */
    .machine-body {
      position: absolute;
      bottom: 0; left: 0;
      width: 180px; height: 185px;
      background: linear-gradient(160deg, #FFFFFF 0%, #E3F2FD 100%);
      border-radius: 18px;
      border: 3px solid rgba(79,195,247,0.5);
      box-shadow: inset 0 -4px 12px rgba(79,195,247,0.2);
    }

    /* Top panel stripe */
    .machine-top-panel {
      position: absolute;
      top: 12px; left: 12px; right: 12px;
      height: 20px;
      background: linear-gradient(90deg, #4FC3F7, #0288D1);
      border-radius: 6px;
      display: flex;
      align-items: center;
      padding: 0 8px;
      gap: 5px;
    }
    .machine-dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
    }
    .machine-dot:last-child { background: rgba(255,255,255,0.4); }

    /* Door ring */
    .machine-door-ring {
      position: absolute;
      top: 44px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px; height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #90CAF9 0%, #4FC3F7 50%, #0288D1 100%);
      box-shadow: 0 0 0 6px rgba(79,195,247,0.3), inset 0 4px 8px rgba(0,0,0,0.12);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Drum (spinning) */
    .machine-drum {
      width: 88px; height: 88px;
      border-radius: 50%;
      background: linear-gradient(135deg, #E3F2FD 0%, #BBDEFB 100%);
      border: 3px solid rgba(255,255,255,0.6);
      position: relative;
      animation: spin-drum 3s linear infinite;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    @keyframes spin-drum {
      0%   { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Clothes tumbling inside drum */
    .drum-clothes {
      position: absolute;
      border-radius: 40%;
    }
    .drum-clothes:nth-child(1) {
      width: 32px; height: 18px;
      background: linear-gradient(120deg, #FFFFFF 60%, #E1F5FE);
      top: 12px; left: 18px;
      transform: rotate(-20deg);
    }
    .drum-clothes:nth-child(2) {
      width: 26px; height: 14px;
      background: linear-gradient(120deg, #B3E5FC 60%, #FFFFFF);
      bottom: 14px; right: 14px;
      transform: rotate(30deg);
    }
    .drum-clothes:nth-child(3) {
      width: 20px; height: 12px;
      background: #FFFFFF;
      top: 36px; left: 8px;
      transform: rotate(10deg);
      opacity: 0.8;
    }

    /* Drum holes */
    .drum-hole {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(79,195,247,0.35);
      border: 1px solid rgba(79,195,247,0.5);
    }
    .drum-hole:nth-child(4) { top: 8px; left: 38px; }
    .drum-hole:nth-child(5) { top: 38px; right: 8px; }
    .drum-hole:nth-child(6) { bottom: 8px; left: 38px; }
    .drum-hole:nth-child(7) { top: 38px; left: 8px; }

    /* Door handle */
    .machine-handle {
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
      width: 6px; height: 22px;
      background: linear-gradient(180deg, #90CAF9, #4FC3F7);
      border-radius: 3px;
    }

    /* Detergent drawer */
    .machine-drawer {
      position: absolute;
      bottom: 18px; left: 50%;
      transform: translateX(-50%);
      width: 60px; height: 12px;
      background: linear-gradient(90deg, #B2EBF2, #E0F7FA);
      border-radius: 4px;
      border: 1px solid rgba(79,195,247,0.4);
    }

    /* ── BUBBLES ── */
    .bubbles {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      border: 1.5px solid rgba(255,255,255,0.8);
      animation: float-up linear infinite;
      bottom: -60px;
    }
    .bubble:nth-child(1)  { width:18px;height:18px; left:10%;  animation-duration:5.2s; animation-delay:0s; }
    .bubble:nth-child(2)  { width:10px;height:10px; left:22%;  animation-duration:4.0s; animation-delay:0.7s; }
    .bubble:nth-child(3)  { width:24px;height:24px; left:38%;  animation-duration:6.5s; animation-delay:1.2s; }
    .bubble:nth-child(4)  { width:14px;height:14px; left:55%;  animation-duration:5.8s; animation-delay:0.3s; }
    .bubble:nth-child(5)  { width:8px; height:8px;  left:70%;  animation-duration:3.9s; animation-delay:1.8s; }
    .bubble:nth-child(6)  { width:20px;height:20px; left:82%;  animation-duration:5.0s; animation-delay:0.9s; }
    .bubble:nth-child(7)  { width:12px;height:12px; left:5%;   animation-duration:4.7s; animation-delay:2.1s; }
    .bubble:nth-child(8)  { width:16px;height:16px; left:48%;  animation-duration:6.0s; animation-delay:2.5s; }
    .bubble:nth-child(9)  { width:9px; height:9px;  left:90%;  animation-duration:4.3s; animation-delay:1.0s; }
    .bubble:nth-child(10) { width:22px;height:22px; left:30%;  animation-duration:7.0s; animation-delay:3.0s; }

    @keyframes float-up {
      0%   { transform: translateY(0) scale(1); opacity: 0.7; }
      70%  { opacity: 0.5; }
      100% { transform: translateY(-110vh) scale(0.6); opacity: 0; }
    }

    /* ── HERO TEXT ── */
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 540px;
      width: 100%;
    }

    .hero-headline {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(2.4rem, 7vw, 3.8rem);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.1;
      margin-bottom: 0.75rem;
      letter-spacing: -0.5px;
    }
    .hero-headline span {
      background: linear-gradient(90deg, #0288D1, #4FC3F7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .hero-sub {
      font-family: 'Inter', sans-serif;
      font-size: clamp(1rem, 3.5vw, 1.2rem);
      color: var(--navy-light);
      font-weight: 500;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    .hero-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(135deg, #0288D1, #0D47A1);
      color: #fff;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.85rem 1.8rem;
      border-radius: 50px;
      text-decoration: none;
      box-shadow: 0 6px 20px rgba(2,136,209,0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(2,136,209,0.45); }

    .btn-secondary {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: #fff;
      color: var(--navy);
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      padding: 0.85rem 1.8rem;
      border-radius: 50px;
      text-decoration: none;
      border: 2px solid rgba(79,195,247,0.5);
      box-shadow: 0 6px 20px rgba(79,195,247,0.2);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(79,195,247,0.3); }

    /* scroll arrow */
    .scroll-hint {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      opacity: 0.55;
      animation: bounce-hint 2s ease-in-out infinite;
      z-index: 2;
    }
    .scroll-hint span {
      font-size: 0.75rem;
      color: var(--navy);
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.05em;
    }
    .scroll-arrow {
      width: 22px; height: 22px;
      border-right: 2.5px solid var(--navy);
      border-bottom: 2.5px solid var(--navy);
      transform: rotate(45deg);
    }
    @keyframes bounce-hint {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(8px); }
    }

    /* ───────────── SECTIONS SHARED ───────────── */
    section { padding: 4.5rem 1.5rem; }

    .section-label {
      font-family: 'Poppins', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
