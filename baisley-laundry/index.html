<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Baisley Laundry – Clean Clothes. Zero Hassle.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #4FC3F7;
    --white: #FFFFFF;
    --aqua: #E0F7FA;
    --navy: #0D47A1;
    --navy-light: #1565C0;
    --shadow: 0 4px 24px rgba(13,71,161,0.10);
    --radius: 18px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--white);
    color: #1a2a3a;
    overflow-x: hidden;
  }

  h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

  /* ── NAV ── */
  nav {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 100;
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(10px);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    box-shadow: 0 2px 16px rgba(13,71,161,0.08);
  }

  .nav-logo {
    font-family: 'Poppins', sans-serif;
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--navy);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .nav-logo span { color: var(--sky); }

  .nav-links {
    display: flex;
    gap: 24px;
    list-style: none;
  }

  .nav-links a {
    text-decoration: none;
    color: #1a2a3a;
    font-weight: 500;
    font-size: 0.9rem;
    transition: color 0.2s;
  }

  .nav-links a:hover { color: var(--navy); }

  .nav-cta {
    background: var(--navy);
    color: var(--white) !important;
    padding: 8px 20px;
    border-radius: 50px;
    font-weight: 600 !important;
    transition: background 0.2s !important;
  }

  .nav-cta:hover { background: var(--navy-light) !important; }

  @media(max-width:600px) {
    .nav-links { display: none; }
  }

  /* ── HERO ── */
  #hero {
    min-height: 100vh;
    background: linear-gradient(135deg, #0D47A1 0%, #1565C0 40%, #1E88E5 70%, #4FC3F7 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 100px 24px 60px;
    position: relative;
    overflow: hidden;
  }

  /* Floating bubbles */
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    animation: floatUp linear infinite;
  }

  @keyframes floatUp {
    0%   { transform: translateY(0) scale(1); opacity: 0.7; }
    100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
  }

  /* ── WASHING MACHINE ── */
  .washer-wrap {
    position: relative;
    width: 170px;
    height: 200px;
    margin: 0 auto 36px;
    filter: drop-shadow(0 8px 32px rgba(0,0,0,0.25));
  }

  .washer-body {
    width: 170px;
    height: 190px;
    background: linear-gradient(160deg, #e8f4fc 0%, #b8ddf5 100%);
    border-radius: 24px 24px 18px 18px;
    position: absolute;
    top: 10px;
    border: 3px solid rgba(255,255,255,0.6);
  }

  .washer-top {
    width: 170px;
    height: 22px;
    background: linear-gradient(90deg, #c9e8f8, #e0f3fc);
    border-radius: 24px 24px 0 0;
    position: absolute;
    top: 0;
    border: 3px solid rgba(255,255,255,0.6);
    border-bottom: none;
  }

  .washer-panel {
    position: absolute;
    top: 20px;
    left: 14px;
    right: 14px;
    height: 28px;
    background: linear-gradient(90deg, #90caf9, #64b5f6);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 10px;
    gap: 6px;
  }

  .panel-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--white);
    opacity: 0.85;
  }

  .panel-dot.green { background: #69f0ae; }
  .panel-dot.orange { background: #ffd740; }

  .washer-drum-outer {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1565C0 0%, #0D47A1 100%);
    border: 6px solid rgba(255,255,255,0.55);
    box-shadow: inset 0 2px 12px rgba(0,0,0,0.25), 0 4px 16px rgba(13,71,161,0.3);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .washer-drum {
    width: 90px;
    height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1976D2, #0D47A1);
    animation: spin 2.5s linear infinite;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  .drum-hole {
    position: absolute;
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 2px solid rgba(255,255,255,0.35);
  }

  .drum-hole:nth-child(1) { top: 12px; left: 50%; transform: translateX(-50%); }
  .drum-hole:nth-child(2) { bottom: 12px; left: 50%; transform: translateX(-50%); }
  .drum-hole:nth-child(3) { left: 12px; top: 50%; transform: translateY(-50%); }
  .drum-hole:nth-child(4) { right: 12px; top: 50%; transform: translateY(-50%); }

  .drum-center {
    width: 24px; height: 24px;
    border-radius: 50%;
    background: rgba(255,255,255,0.22);
    border: 2px solid rgba(255,255,255,0.4);
  }

  .washer-door-shine {
    position: absolute;
    top: 60px;
    left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, transparent 60%);
    pointer-events: none;
  }

  /* Water wave inside drum */
  .water-wave {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 38%;
    background: rgba(79,195,247,0.35);
    border-radius: 0 0 50px 50px;
    animation: wave 1.2s ease-in-out infinite alternate;
  }

  @keyframes wave {
    from { height: 34%; border-radius: 60% 40% 0 0; }
    to   { height: 42%; border-radius: 40% 60% 0 0; }
  }

  /* Hero text */
  .hero-headline {
    font-size: clamp(2.2rem, 7vw, 4rem);
    font-weight: 800;
    color: var(--white);
    line-height: 1.1;
    margin-bottom: 16px;
    text-shadow: 0 2px 20px rgba(0,0,0,0.2);
  }

  .hero-headline span { color: #B3E5FC; }

  .hero-sub {
    font-size: clamp(1rem, 3vw, 1.25rem);
    color: rgba(255,255,255,0.88);
    margin-bottom: 10px;
    font-weight: 500;
  }

  .hero-location {
    font-size: 0.95rem;
    color: rgba(255,255,255,0.7);
    margin-bottom: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
  }

  .hero-btns {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn-primary {
    background: var(--white);
    color: var(--navy);
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    padding: 14px 32px;
    border-radius: 50px;
    text-decoration: none;
    box-shadow: 0 4px 20px rgba(0,0,0,0.18);
    transition: transform 0.2s, box-shadow 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 28px rgba(0,0,0,0.22); }

  .btn-outline {
    background: transparent;
    color: var(--white);
    border: 2px solid rgba(255,255,255,0.75);
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    padding: 14px 32px;
    border-radius: 50px;
    text-decoration: none;
    transition: background 0.2s, transform 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }

  .btn-outline:hover { background: rgba(255,255,255,0.15); transform: translateY(-3px); }

  .scroll-hint {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: rgba(255,255,255,0.6);
    font-size: 0.75rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    animation: bounce 2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateX(-50%) translateY(0); }
    50%       { transform: translateX(-50%) translateY(8px); }
  }

  /* ── SECTION BASE ── */
  section { padding: 80px 24px; }

  .container { max-width: 1100px; margin: 0 auto; }

  .section-label {
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--sky);
    margin-bottom: 10px;
  }

  .section-title {
    font-size: clamp(1.7rem, 4vw, 2.5rem);
    font-weight: 800;
    color: var(--navy);
    margin-bottom: 14px;
    line-height: 1.2;
  }

  .section-desc {
    color: #4a5568;
    font-size: 1.05rem;
    line-height: 1.7;
    max-width: 560px;
  }

  /* ── SERVICES ── */
  #services { background: var(--aqua); }

  .services-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
    gap: 24px;
    margin-top: 48px;
  }

  .service-card {
    background: var(--white);
    border-radius: var(--radius);
    padding: 32px 24px;
    box-shadow: var(--shadow);
    transition: transform 0.3s, box-shadow 0.3s;
    opacity: 0;
    transform: translateY(30px);
  }

  .service-card.visible {
    opacity: 1;
    transform: translateY(0);
    transition: opacity 0.5s ease, transform 0.5s ease, box-shadow 0.3s;
  }

  .service-card:hover { transform: translateY(-6px); box-shadow: 0 12px 36px rgba(13,71,161,0.13); }

  .service-icon {
    font-size: 2.6rem;
    margin-bottom: 16px;
    display: block;
  }

  .service-card h3 {
    font-size: 1.1rem;
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 10px;
  }

  .service-card p {
    font-size: 0.93rem;
    color: #5a6a7a;
    line
