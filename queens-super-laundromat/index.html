<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ $json.name }} – Fresh. Fast. Easy.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #4FC3F7;
    --sky-dark: #0288D1;
    --aqua: #E0F7FA;
    --aqua-mid: #B2EBF2;
    --navy: #0D47A1;
    --navy-light: #1565C0;
    --white: #FFFFFF;
    --text: #1A237E;
    --text-light: #37474F;
    --shadow: 0 8px 32px rgba(13,71,161,0.10);
    --shadow-lg: 0 16px 48px rgba(13,71,161,0.16);
    --radius: 20px;
    --radius-sm: 12px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--white);
    color: var(--text);
    overflow-x: hidden;
  }

  h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

  /* ── HERO ── */
  #hero {
    min-height: 100dvh;
    background: linear-gradient(160deg, #E0F7FA 0%, #B2EBF2 40%, #81D4FA 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 60px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  /* Background blobs */
  #hero::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(255,255,255,0.45) 0%, transparent 70%);
    top: -120px; left: -150px;
    border-radius: 50%;
    pointer-events: none;
  }
  #hero::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    background: radial-gradient(circle, rgba(79,195,247,0.25) 0%, transparent 70%);
    bottom: -80px; right: -80px;
    border-radius: 50%;
    pointer-events: none;
  }

  /* ── WASHING MACHINE ANIMATION ── */
  .washer-wrap {
    position: relative;
    width: 180px;
    height: 200px;
    margin: 0 auto 36px;
    flex-shrink: 0;
  }

  /* Machine body */
  .washer-body {
    position: absolute;
    bottom: 0; left: 0;
    width: 180px; height: 180px;
    background: linear-gradient(145deg, #FFFFFF 60%, #E0F7FA 100%);
    border-radius: 22px;
    box-shadow: 0 12px 40px rgba(13,71,161,0.18), inset 0 2px 6px rgba(255,255,255,0.8);
    border: 3px solid rgba(79,195,247,0.4);
  }

  /* Top panel details */
  .washer-panel {
    position: absolute;
    top: 14px; left: 14px; right: 14px;
    height: 26px;
    background: linear-gradient(90deg, #4FC3F7 0%, #81D4FA 100%);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 10px;
    gap: 6px;
  }
  .washer-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--white);
    opacity: 0.85;
  }
  .washer-dot:last-child { background: #A5D6A7; }

  /* Drum (circle window) */
  .washer-drum-ring {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    width: 118px; height: 118px;
    border-radius: 50%;
    background: linear-gradient(135deg, #B2EBF2 0%, #4FC3F7 100%);
    box-shadow: 0 4px 16px rgba(2,136,209,0.30), inset 0 2px 8px rgba(255,255,255,0.5);
    border: 4px solid rgba(255,255,255,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .washer-drum-inner {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0288D1 0%, #4FC3F7 60%, #81D4FA 100%);
    animation: spinDrum 3s linear infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }

  /* Clothes shapes inside drum */
  .washer-drum-inner::before {
    content: '';
    position: absolute;
    width: 60px; height: 30px;
    background: rgba(255,255,255,0.55);
    border-radius: 50%;
    top: 18px; left: 15px;
    transform-origin: center center;
  }
  .washer-drum-inner::after {
    content: '';
    position: absolute;
    width: 40px; height: 20px;
    background: rgba(255,255,255,0.35);
    border-radius: 50%;
    bottom: 16px; right: 10px;
  }

  /* Paddle marks on drum */
  .paddle {
    position: absolute;
    width: 4px; height: 28px;
    background: rgba(255,255,255,0.45);
    border-radius: 2px;
  }
  .paddle:nth-child(1) { top: 8px; left: 43px; transform: rotate(0deg); }
  .paddle:nth-child(2) { top: 43px; right: 8px; transform: rotate(90deg); }
  .paddle:nth-child(3) { bottom: 8px; left: 43px; transform: rotate(0deg); }
  .paddle:nth-child(4) { top: 43px; left: 8px; transform: rotate(90deg); }

  @keyframes spinDrum {
    0%   { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Bubbles */
  .bubbles {
    position: absolute;
    bottom: 180px;
    left: 50%;
    transform: translateX(-50%);
    width: 180px;
    pointer-events: none;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), rgba(79,195,247,0.3));
    border: 1.5px solid rgba(255,255,255,0.6);
    animation: floatBubble linear infinite;
    bottom: 0;
  }
  .bubble:nth-child(1)  { width:14px; height:14px; left:20px;  animation-duration:3.2s; animation-delay:0s;    }
  .bubble:nth-child(2)  { width:9px;  height:9px;  left:55px;  animation-duration:2.6s; animation-delay:0.7s;  }
  .bubble:nth-child(3)  { width:18px; height:18px; left:90px;  animation-duration:3.8s; animation-delay:1.2s;  }
  .bubble:nth-child(4)  { width:11px; height:11px; left:130px; animation-duration:2.9s; animation-delay:0.3s;  }
  .bubble:nth-child(5)  { width:7px;  height:7px;  left:40px;  animation-duration:2.4s; animation-delay:1.8s;  }
  .bubble:nth-child(6)  { width:13px; height:13px; left:110px; animation-duration:3.5s; animation-delay:0.9s;  }
  .bubble:nth-child(7)  { width:8px;  height:8px;  left:70px;  animation-duration:2.7s; animation-delay:2.2s;  }
  .bubble:nth-child(8)  { width:16px; height:16px; left:10px;  animation-duration:4.0s; animation-delay:1.5s;  }
  .bubble:nth-child(9)  { width:10px; height:10px; left:155px; animation-duration:3.1s; animation-delay:0.5s;  }
  .bubble:nth-child(10) { width:6px;  height:6px;  left:80px;  animation-duration:2.3s; animation-delay:2.8s;  }

  @keyframes floatBubble {
    0%   { transform: translateY(0) scale(1); opacity: 0; }
    10%  { opacity: 0.9; }
    85%  { opacity: 0.7; }
    100% { transform: translateY(-200px) scale(0.6); opacity: 0; }
  }

  /* Background floating bubbles (decorative) */
  .bg-bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    animation: bgFloat linear infinite;
    pointer-events: none;
  }
  .bg-bubble:nth-child(1)  { width:80px;  height:80px;  top:15%; left:5%;   animation-duration:12s; animation-delay:0s; }
  .bg-bubble:nth-child(2)  { width:50px;  height:50px;  top:60%; left:90%;  animation-duration:9s;  animation-delay:2s; }
  .bg-bubble:nth-child(3)  { width:120px; height:120px; top:80%; left:8%;   animation-duration:15s; animation-delay:1s; }
  .bg-bubble:nth-child(4)  { width:35px;  height:35px;  top:25%; left:80%;  animation-duration:8s;  animation-delay:3s; }
  .bg-bubble:nth-child(5)  { width:65px;  height:65px;  top:50%; left:50%;  animation-duration:11s; animation-delay:4s; }

  @keyframes bgFloat {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%       { transform: translateY(-20px) rotate(180deg); }
  }

  .hero-content { position: relative; z-index: 2; }

  .hero-headline {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(2.4rem, 8vw, 4.2rem);
    font-weight: 900;
    color: var(--navy);
    line-height: 1.1;
    margin-bottom: 14px;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 16px rgba(255,255,255,0.5);
  }

  .hero-headline span {
    background: linear-gradient(135deg, var(--sky-dark), var(--navy));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-sub {
    font-family: 'Inter', sans-serif;
    font-size: clamp(1rem, 3vw, 1.25rem);
    font-weight: 500;
    color: var(--navy-light);
    margin-bottom: 36px;
    opacity: 0.85;
    line-height: 1.5;
  }

  .hero-sub strong {
    font-weight: 700;
    color: var(--navy);
  }

  .btn-group {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 16px 32px;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    text-decoration: none;
    cursor: pointer;
    border: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    letter-spacing: 0.3px;
    min-width: 180px;
  }
  .btn:hover { transform: translateY(-3px); }
  .btn:active { transform: translateY(0); }

  .btn-primary {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-light) 100%);
    color: var(--white);
    box-shadow: 0 8px 24px rgba(13,71,161,0.35);
  }
  .btn-primary:hover { box-shadow: 0 12px 32px rgba(13,71,161,0.45); }

  .btn-secondary {
    background: var(--white);
    color: var(--navy);
    box-shadow: 0 8px 24px rgba(13,71,161,0.18);
    border: 2px solid rgba(79,195,247,0.4);
  }
  .btn-secondary:hover { box-shadow: 0 12px 32px rgba(13,71,161,0.25); }

  /* Scroll arrow */
  .scroll-arrow {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    opacity: 0.55;
    animation: bounceArrow 2s ease-in-out infinite;
    z-index: 2;
  }
  .scroll-arrow span {
    display: block;
    width: 24px; height: 24px;
    border-right: 3
