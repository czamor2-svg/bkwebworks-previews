<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ $json.name }} – Fresh. Fast. Easy.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #4FC3F7;
    --aqua: #E0F7FA;
    --navy: #0D47A1;
    --navy-light: #1565C0;
    --white: #FFFFFF;
    --bubble: rgba(79,195,247,0.35);
    --shadow: 0 8px 32px rgba(13,71,161,0.10);
    --radius: 20px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--navy);
    background: var(--white);
    overflow-x: hidden;
  }

  h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

  /* ─── HERO ─────────────────────────────────────────────── */
  #hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #E0F7FA 0%, #B3E5FC 40%, #81D4FA 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 60px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  /* Floating background circles */
  .bg-circle {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    animation: floatUp linear infinite;
    pointer-events: none;
  }
  .bg-circle:nth-child(1)  { width:180px; height:180px; left:-60px; bottom:-40px; animation-duration:18s; }
  .bg-circle:nth-child(2)  { width:120px; height:120px; right:-30px; bottom:10%; animation-duration:22s; animation-delay:-6s; }
  .bg-circle:nth-child(3)  { width:80px;  height:80px;  left:20%;   bottom:-20px; animation-duration:14s; animation-delay:-3s; }
  .bg-circle:nth-child(4)  { width:60px;  height:60px;  right:25%;  bottom:5%;   animation-duration:16s; animation-delay:-8s; }
  .bg-circle:nth-child(5)  { width:40px;  height:40px;  left:45%;   bottom:-10px; animation-duration:20s; animation-delay:-11s; }

  @keyframes floatUp {
    0%   { transform: translateY(0) scale(1); opacity: 0.7; }
    50%  { opacity: 0.4; }
    100% { transform: translateY(-110vh) scale(1.1); opacity: 0; }
  }

  /* ── Washing Machine ── */
  .machine-wrap {
    position: relative;
    width: 220px;
    height: 260px;
    margin-bottom: 32px;
    flex-shrink: 0;
  }

  /* Body */
  .machine-body {
    position: absolute;
    bottom: 0; left: 0;
    width: 220px; height: 240px;
    background: linear-gradient(145deg, #FFFFFF 60%, #E3F2FD 100%);
    border-radius: 24px;
    box-shadow: 0 12px 40px rgba(13,71,161,0.18), inset 0 2px 0 rgba(255,255,255,0.9);
    border: 3px solid rgba(79,195,247,0.4);
  }

  /* Top panel strip */
  .machine-panel {
    position: absolute;
    top: 14px; left: 14px;
    width: 192px; height: 36px;
    background: linear-gradient(90deg, #4FC3F7, #29B6F6);
    border-radius: 12px;
    display: flex; align-items: center; justify-content: flex-end;
    padding-right: 16px; gap: 8px;
  }
  .panel-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
  }
  .panel-dot.active { background: #FFFFFF; box-shadow: 0 0 6px #fff; }

  /* Door ring */
  .machine-door-ring {
    position: absolute;
    top: 62px; left: 50%;
    transform: translateX(-50%);
    width: 140px; height: 140px;
    border-radius: 50%;
    background: linear-gradient(145deg, #B3E5FC, #4FC3F7);
    box-shadow: 0 4px 16px rgba(13,71,161,0.2), inset 0 2px 8px rgba(255,255,255,0.6);
    display: flex; align-items: center; justify-content: center;
  }

  /* Glass */
  .machine-glass {
    width: 116px; height: 116px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.85) 0%, rgba(200,240,255,0.55) 60%, rgba(79,195,247,0.3) 100%);
    border: 3px solid rgba(255,255,255,0.7);
    position: relative;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
  }

  /* Spinning drum inside glass */
  .drum {
    width: 90px; height: 90px;
    border-radius: 50%;
    border: 3px solid rgba(79,195,247,0.6);
    position: relative;
    animation: spinDrum 3s linear infinite;
  }

  @keyframes spinDrum {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* Drum holes */
  .drum::before, .drum::after {
    content: '';
    position: absolute;
    border-radius: 50%;
    background: rgba(79,195,247,0.35);
  }
  .drum::before { width:22px; height:22px; top:8px; left:10px; }
  .drum::after  { width:16px; height:16px; bottom:10px; right:8px; }

  .drum-hole-extra {
    position: absolute;
    width: 14px; height: 14px;
    border-radius: 50%;
    background: rgba(79,195,247,0.35);
    bottom: 8px; left: 14px;
  }

  /* Clothes swish lines inside glass */
  .swish {
    position: absolute;
    border-radius: 50px;
    background: rgba(255,255,255,0.75);
    animation: swishMove 3s linear infinite;
  }
  .swish:nth-child(1) { width:40px; height:6px; top:30px; left:18px; animation-delay:0s; }
  .swish:nth-child(2) { width:28px; height:5px; top:50px; left:30px; animation-delay:-1s; }
  .swish:nth-child(3) { width:22px; height:4px; top:68px; left:20px; animation-delay:-2s; }

  @keyframes swishMove {
    0%   { transform: rotate(0deg) scaleX(1); opacity:0.8; }
    50%  { transform: rotate(180deg) scaleX(0.7); opacity:0.5; }
    100% { transform: rotate(360deg) scaleX(1); opacity:0.8; }
  }

  /* Shine on glass */
  .glass-shine {
    position: absolute;
    top: 8px; left: 10px;
    width: 30px; height: 30px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    filter: blur(4px);
    pointer-events: none;
  }

  /* Bottom details */
  .machine-bottom {
    position: absolute;
    bottom: 14px; left: 14px;
    width: 192px;
    display: flex; gap: 8px; align-items: center;
  }
  .machine-drawer {
    width: 52px; height: 18px;
    background: #E3F2FD;
    border-radius: 6px;
    border: 2px solid rgba(79,195,247,0.4);
  }
  .machine-dial {
    width: 22px; height: 22px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4FC3F7, #0288D1);
    border: 2px solid rgba(255,255,255,0.7);
    margin-left: auto;
    animation: dialTick 6s steps(12, end) infinite;
  }
  @keyframes dialTick {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* ── Bubbles ── */
  .bubbles-container {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 100%;
    pointer-events: none;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), rgba(79,195,247,0.3));
    border: 1.5px solid rgba(255,255,255,0.6);
    bottom: -40px;
    animation: riseBubble ease-in infinite;
  }
  .bubble:nth-child(1)  { width:18px; height:18px; left:8%;   animation-duration:7s;  animation-delay:0s;   }
  .bubble:nth-child(2)  { width:12px; height:12px; left:18%;  animation-duration:9s;  animation-delay:-2s;  }
  .bubble:nth-child(3)  { width:24px; height:24px; left:30%;  animation-duration:11s; animation-delay:-4s;  }
  .bubble:nth-child(4)  { width:10px; height:10px; left:48%;  animation-duration:8s;  animation-delay:-1s;  }
  .bubble:nth-child(5)  { width:20px; height:20px; left:62%;  animation-duration:10s; animation-delay:-5s;  }
  .bubble:nth-child(6)  { width:14px; height:14px; left:75%;  animation-duration:13s; animation-delay:-3s;  }
  .bubble:nth-child(7)  { width:8px;  height:8px;  left:88%;  animation-duration:6s;  animation-delay:-7s;  }
  .bubble:nth-child(8)  { width:16px; height:16px; left:55%;  animation-duration:12s; animation-delay:-9s;  }
  .bubble:nth-child(9)  { width:10px; height:10px; left:40%;  animation-duration:9s;  animation-delay:-6s;  }
  .bubble:nth-child(10) { width:22px; height:22px; left:22%;  animation-duration:14s; animation-delay:-11s; }

  @keyframes riseBubble {
    0%   { transform: translateY(0) translateX(0); opacity:0.9; }
    25%  { transform: translateY(-25vh) translateX(10px); opacity:0.7; }
    50%  { transform: translateY(-50vh) translateX(-8px); opacity:0.5; }
    75%  { transform: translateY(-75vh) translateX(5px); opacity:0.25; }
    100% { transform: translateY(-105vh) translateX(0); opacity:0; }
  }

  /* Hero text */
  .hero-text { position: relative; z-index: 2; }

  .hero-text h1 {
    font-size: clamp(2.4rem, 8vw, 4.2rem);
    font-weight: 900;
    color: var(--navy);
    line-height: 1.1;
    letter-spacing: -1px;
    margin-bottom: 14px;
    text-shadow: 0 2px 12px rgba(255,255,255,0.5);
  }

  .hero-sub {
    font-size: clamp(1rem, 3vw, 1.2rem);
    font-weight: 600;
    color: var(--navy-light);
    margin-bottom: 8px;
    font-family: 'Poppins', sans-serif;
  }

  .hero-tagline {
    font-size: clamp(0.9rem, 2.5vw, 1rem);
    color: #1565C0;
    margin-bottom: 36px;
    opacity: 0.8;
  }

  .btn-group {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 16px 32px;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
    border: none;
  }
  .btn:hover { transform: translateY(-3px); }
  .btn:active { transform: translateY(0); }

  .btn-primary {
    background: var(--navy);
    color: var(--white);
    box-shadow: 0 8px 24px rgba(13,71,161,0.35);
  }
  .btn-primary:hover { box-shadow: 0 12px 32px rgba(13,71,161,0.45); }

  .btn-secondary {
    background: var(--white);
    color: var(--navy);
    box-shadow: 0 8px 24px rgba(79,195,247,0.35);
    border: 2px solid rgba(79,195,247,0.5);
  }
