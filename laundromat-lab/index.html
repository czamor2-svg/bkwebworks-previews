<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ $json.name }} – Fresh. Fast. Easy.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --blue: #4FC3F7;
    --navy: #0D47A1;
    --aqua: #E0F7FA;
    --aqua-mid: #B2EBF2;
    --white: #FFFFFF;
    --text-dark: #0D47A1;
    --text-body: #1a3a5c;
    --shadow: 0 8px 32px rgba(13,71,161,0.10);
    --shadow-lg: 0 16px 48px rgba(13,71,161,0.15);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--white);
    color: var(--text-body);
    overflow-x: hidden;
  }

  h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

  /* ── HERO ── */
  .hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #e0f7fa 0%, #b2ebf2 40%, #81d4fa 80%, #4fc3f7 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px 60px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  /* Background floating circles decoration */
  .hero::before {
    content: '';
    position: absolute;
    top: -120px; right: -120px;
    width: 400px; height: 400px;
    background: rgba(255,255,255,0.18);
    border-radius: 50%;
    z-index: 0;
  }
  .hero::after {
    content: '';
    position: absolute;
    bottom: -100px; left: -100px;
    width: 320px; height: 320px;
    background: rgba(255,255,255,0.13);
    border-radius: 50%;
    z-index: 0;
  }

  /* ── WASHING MACHINE CSS ART ── */
  .washer-scene {
    position: relative;
    width: 220px;
    height: 260px;
    margin: 0 auto 36px;
    z-index: 2;
    flex-shrink: 0;
  }

  /* Machine body */
  .machine-body {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 210px;
    background: linear-gradient(145deg, #ffffff 60%, #e0f7fa 100%);
    border-radius: 22px;
    box-shadow: 0 12px 40px rgba(13,71,161,0.18), inset 0 2px 6px rgba(255,255,255,0.8);
    border: 3px solid rgba(79,195,247,0.35);
  }

  /* Machine top strip */
  .machine-top {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 38px;
    background: linear-gradient(90deg, #4FC3F7, #29B6F6);
    border-radius: 19px 19px 0 0;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 14px;
    gap: 6px;
  }

  .machine-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
  }
  .machine-dot.active {
    background: #fff;
    box-shadow: 0 0 6px rgba(255,255,255,0.9);
    animation: blink 1.8s ease-in-out infinite;
  }
  @keyframes blink {
    0%,100%{opacity:1;} 50%{opacity:0.3;}
  }

  /* Porthole */
  .porthole-outer {
    position: absolute;
    top: 52px; left: 50%;
    transform: translateX(-50%);
    width: 110px; height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0D47A1 0%, #1565C0 50%, #1976D2 100%);
    box-shadow: 0 4px 20px rgba(13,71,161,0.35), inset 0 2px 8px rgba(0,0,0,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 4px solid rgba(79,195,247,0.5);
  }

  .porthole-inner {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1a237e 0%, #1565C0 100%);
    overflow: hidden;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Water wave inside porthole */
  .porthole-water {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    height: 52px;
    background: linear-gradient(180deg, rgba(79,195,247,0.7) 0%, rgba(3,169,244,0.9) 100%);
    border-radius: 0 0 50px 50px;
    animation: sloshing 1.8s ease-in-out infinite alternate;
  }
  @keyframes sloshing {
    0%{ transform: rotate(-4deg) translateX(-4px); height: 50px; }
    100%{ transform: rotate(4deg) translateX(4px); height: 56px; }
  }

  /* Drum cross */
  .drum {
    position: absolute;
    width: 68px; height: 68px;
    animation: spin 2.5s linear infinite;
    z-index: 2;
  }
  @keyframes spin { 0%{transform:rotate(0deg);} 100%{transform:rotate(360deg);} }

  .drum::before, .drum::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.25);
    border-radius: 3px;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
  }
  .drum::before { width: 60px; height: 8px; }
  .drum::after  { width: 8px; height: 60px; }

  .drum-center {
    position: absolute;
    width: 16px; height: 16px;
    border-radius: 50%;
    background: rgba(255,255,255,0.5);
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    z-index: 3;
  }

  /* Clothes shapes tumbling */
  .clothes-wrap {
    position: absolute;
    width: 60px; height: 60px;
    animation: spin 2.5s linear infinite;
    z-index: 1;
  }

  .cloth {
    position: absolute;
    border-radius: 8px;
    opacity: 0.85;
  }
  .cloth-1 { width: 22px; height: 14px; background: #fff; top: 8px; left: 6px; transform: rotate(-20deg); border-radius: 50% 50% 8px 8px; }
  .cloth-2 { width: 18px; height: 12px; background: #e0f7fa; top: 36px; left: 32px; transform: rotate(30deg); border-radius: 50% 50% 8px 8px; }
  .cloth-3 { width: 14px; height: 10px; background: #b3e5fc; bottom: 6px; left: 10px; transform: rotate(15deg); border-radius: 50% 50% 8px 8px; }

  /* Door handle */
  .door-handle {
    position: absolute;
    bottom: 22px; left: 50%;
    transform: translateX(-50%);
    width: 50px; height: 10px;
    background: linear-gradient(90deg, #4FC3F7, #29B6F6);
    border-radius: 5px;
    box-shadow: 0 2px 6px rgba(79,195,247,0.4);
  }

  /* Control panel */
  .control-panel {
    position: absolute;
    bottom: 40px; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 8px;
  }

  /* Bubbles */
  .bubbles-container {
    position: absolute;
    bottom: 210px; left: 50%;
    transform: translateX(-50%);
    width: 180px;
    height: 100px;
    z-index: 1;
    pointer-events: none;
  }

  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.65);
    border: 1.5px solid rgba(255,255,255,0.9);
    animation: floatUp linear infinite;
    bottom: 0;
  }

  .bubble:nth-child(1) { width:12px; height:12px; left:20px;  animation-duration:3.2s; animation-delay:0s; }
  .bubble:nth-child(2) { width:8px;  height:8px;  left:55px;  animation-duration:2.6s; animation-delay:0.6s; }
  .bubble:nth-child(3) { width:16px; height:16px; left:88px;  animation-duration:3.8s; animation-delay:1.1s; }
  .bubble:nth-child(4) { width:10px; height:10px; left:130px; animation-duration:2.9s; animation-delay:0.3s; }
  .bubble:nth-child(5) { width:6px;  height:6px;  left:38px;  animation-duration:3.4s; animation-delay:1.7s; }
  .bubble:nth-child(6) { width:14px; height:14px; left:105px; animation-duration:2.4s; animation-delay:0.9s; }
  .bubble:nth-child(7) { width:9px;  height:9px;  left:70px;  animation-duration:3.1s; animation-delay:2.2s; }

  @keyframes floatUp {
    0%   { transform: translateY(0) scale(1); opacity: 0.8; }
    70%  { opacity: 0.6; }
    100% { transform: translateY(-110px) scale(0.4); opacity: 0; }
  }

  /* Steam puffs */
  .steam {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 14px;
    z-index: 1;
  }
  .puff {
    width: 18px; height: 18px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    animation: puffUp 2.5s ease-out infinite;
  }
  .puff:nth-child(2) { animation-delay: 0.4s; width:14px; height:14px; }
  .puff:nth-child(3) { animation-delay: 0.8s; width:20px; height:20px; }
  @keyframes puffUp {
    0%   { transform: translateY(0) scale(1); opacity: 0.7; }
    100% { transform: translateY(-50px) scale(2.5); opacity: 0; }
  }

  /* Hero text */
  .hero-content { position: relative; z-index: 2; }

  .hero h1 {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(2.4rem, 7vw, 4rem);
    font-weight: 900;
    color: var(--navy);
    line-height: 1.1;
    letter-spacing: -1px;
    margin-bottom: 14px;
    text-shadow: 0 2px 12px rgba(255,255,255,0.6);
  }

  .hero h1 span {
    color: #0288D1;
    display: block;
  }

  .hero-sub {
    font-family: 'Inter', sans-serif;
    font-size: clamp(1rem, 3vw, 1.2rem);
    font-weight: 500;
    color: #1565C0;
    margin-bottom: 36px;
    opacity: 0.9;
  }

  .hero-btns {
    display: flex;
    flex-wrap: wrap;
    gap: 14px;
    justify-content: center;
    margin-top: 8px;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 16px 32px;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
    border: none;
  }

  .btn:hover { transform: translateY(-3px); }
  .btn:active { transform: translateY(0); }

  .btn-primary {
    background: var(--navy);
    color: #fff;
    box-shadow: 0 8px 24px rgba(13,71,161,0.35);
  }
  .btn-primary:hover { box-shadow: 0 14px 32px rgba(13,71,161,0.45); }

  .btn-secondary {
    background: #fff;
    color: var(--navy);
    box-shadow: 0 8px 24px rgba(13,71,161,0.15);
    border: 2px solid rgba(79,195,247,0.5);
  }
  .btn-secondary:hover { box-shadow: 0 14px 32px rgba(13,71,161,0.22); }

  .scroll-hint {
    position: absolute;
    bottom:
