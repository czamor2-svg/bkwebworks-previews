<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ $json.name }} – Fresh. Fast. Easy.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #4FC3F7;
    --aqua: #E0F7FA;
    --aqua-mid: #B2EBF2;
    --navy: #0D47A1;
    --navy-light: #1565C0;
    --white: #FFFFFF;
    --soft-gray: #F5FDFF;
    --text-dark: #0D2B5E;
    --text-mid: #3a5a8a;
    --shadow: 0 8px 32px rgba(13,71,161,0.10);
    --radius: 20px;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--white);
    color: var(--text-dark);
    overflow-x: hidden;
  }

  h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

  /* ========== HERO ========== */
  .hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #e0f7fa 0%, #b2ebf2 40%, #81d4fa 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 60px;
    position: relative;
    overflow: hidden;
    text-align: center;
  }

  /* Background floating circles */
  .hero::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    top: -150px; right: -150px;
    pointer-events: none;
  }
  .hero::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: rgba(255,255,255,0.12);
    bottom: -100px; left: -100px;
    pointer-events: none;
  }

  /* ---- Washing Machine ---- */
  .washer-wrap {
    position: relative;
    width: 180px;
    height: 200px;
    margin: 0 auto 32px;
    filter: drop-shadow(0 12px 24px rgba(13,71,161,0.18));
  }

  .washer-body {
    position: absolute;
    bottom: 0; left: 0;
    width: 180px; height: 190px;
    background: linear-gradient(160deg, #ffffff 0%, #e3f2fd 100%);
    border-radius: 22px;
    border: 3px solid rgba(79,195,247,0.5);
  }

  .washer-top {
    position: absolute;
    top: 0; left: 10px;
    width: 160px; height: 28px;
    background: linear-gradient(90deg, #4FC3F7, #29B6F6);
    border-radius: 12px 12px 4px 4px;
    border: 3px solid rgba(79,195,247,0.5);
  }

  .washer-panel {
    position: absolute;
    top: 30px; left: 10px;
    width: 160px; height: 30px;
    background: linear-gradient(90deg, #e1f5fe, #b3e5fc);
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 14px;
    gap: 8px;
  }

  .panel-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .panel-dot.blue { background: #0288D1; }
  .panel-dot.green { background: #00ACC1; }
  .panel-dot.sky { background: #4FC3F7; }

  .drum-ring {
    position: absolute;
    top: 68px;
    left: 50%;
    transform: translateX(-50%);
    width: 120px; height: 120px;
    border-radius: 50%;
    background: linear-gradient(135deg, #e3f2fd 0%, #b3e5fc 100%);
    border: 5px solid #4FC3F7;
    box-shadow: 0 0 0 4px rgba(79,195,247,0.18), inset 0 2px 12px rgba(13,71,161,0.10);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .drum-inner {
    width: 104px; height: 104px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0288D1 0%, #29B6F6 50%, #4FC3F7 100%);
    animation: spin 3s linear infinite;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  .drum-inner::before,
  .drum-inner::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.2);
    border-radius: 4px;
  }
  .drum-inner::before {
    width: 88px; height: 8px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }
  .drum-inner::after {
    width: 8px; height: 88px;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
  }

  .drum-holes {
    position: absolute;
    width: 100%; height: 100%;
    border-radius: 50%;
    animation: spin 3s linear infinite;
  }

  .drum-hole {
    position: absolute;
    width: 10px; height: 10px;
    background: rgba(255,255,255,0.35);
    border-radius: 50%;
  }
  .drum-hole:nth-child(1) { top: 18px; left: 47px; }
  .drum-hole:nth-child(2) { top: 47px; right: 18px; }
  .drum-hole:nth-child(3) { bottom: 18px; left: 47px; }
  .drum-hole:nth-child(4) { top: 47px; left: 18px; }

  .clothes-shirt {
    position: absolute;
    animation: tumble 3s linear infinite;
  }

  .shirt {
    width: 28px; height: 22px;
    background: white;
    border-radius: 3px 3px 6px 6px;
    position: relative;
  }
  .shirt::before {
    content: '';
    position: absolute;
    top: -8px; left: -6px;
    width: 10px; height: 12px;
    background: white;
    border-radius: 50% 0 0 0;
    transform: rotate(-10deg);
  }
  .shirt::after {
    content: '';
    position: absolute;
    top: -8px; right: -6px;
    width: 10px; height: 12px;
    background: white;
    border-radius: 0 50% 0 0;
    transform: rotate(10deg);
  }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  @keyframes tumble {
    0%   { transform: translate(0px, 0px) rotate(0deg); opacity: 0.9; }
    25%  { transform: translate(20px, -15px) rotate(90deg); opacity: 0.7; }
    50%  { transform: translate(0px, -5px) rotate(180deg); opacity: 0.9; }
    75%  { transform: translate(-20px, -15px) rotate(270deg); opacity: 0.7; }
    100% { transform: translate(0px, 0px) rotate(360deg); opacity: 0.9; }
  }

  /* door handle */
  .door-handle {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 30px; height: 6px;
    background: #4FC3F7;
    border-radius: 3px;
  }

  /* ---- Bubbles ---- */
  .bubbles-container {
    position: absolute;
    bottom: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    overflow: hidden;
  }

  .bubble {
    position: absolute;
    bottom: -20px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    border: 1.5px solid rgba(79,195,247,0.4);
    animation: floatUp linear infinite;
  }

  .bubble:nth-child(1)  { width:14px; height:14px; left:8%;  animation-duration:6s;  animation-delay:0s;   }
  .bubble:nth-child(2)  { width:22px; height:22px; left:18%; animation-duration:8s;  animation-delay:1s;   }
  .bubble:nth-child(3)  { width:10px; height:10px; left:30%; animation-duration:5s;  animation-delay:2s;   }
  .bubble:nth-child(4)  { width:18px; height:18px; left:42%; animation-duration:7s;  animation-delay:0.5s; }
  .bubble:nth-child(5)  { width:26px; height:26px; left:55%; animation-duration:9s;  animation-delay:1.5s; }
  .bubble:nth-child(6)  { width:12px; height:12px; left:65%; animation-duration:5.5s;animation-delay:3s;   }
  .bubble:nth-child(7)  { width:20px; height:20px; left:76%; animation-duration:7.5s;animation-delay:0.8s; }
  .bubble:nth-child(8)  { width:16px; height:16px; left:85%; animation-duration:6.5s;animation-delay:2.5s; }
  .bubble:nth-child(9)  { width:8px;  height:8px;  left:92%; animation-duration:4.5s;animation-delay:1.2s; }
  .bubble:nth-child(10) { width:24px; height:24px; left:23%; animation-duration:8.5s;animation-delay:4s;   }

  @keyframes floatUp {
    0%   { transform: translateY(0) scale(1);    opacity: 0; }
    10%  { opacity: 0.7; }
    80%  { opacity: 0.5; }
    100% { transform: translateY(-100vh) scale(0.8); opacity: 0; }
  }

  /* ---- Hero text ---- */
  .hero-content { position: relative; z-index: 2; max-width: 600px; }

  .hero-tagline {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(2.4rem, 8vw, 4rem);
    font-weight: 900;
    color: var(--navy);
    line-height: 1.1;
    margin-bottom: 14px;
    letter-spacing: -1px;
  }

  .hero-tagline span { color: #0288D1; }

  .hero-sub {
    font-size: clamp(1rem, 3.5vw, 1.2rem);
    color: var(--navy-light);
    font-weight: 500;
    margin-bottom: 8px;
    font-family: 'Inter', sans-serif;
  }

  .hero-biz {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    font-weight: 700;
    color: var(--navy);
    margin-bottom: 36px;
  }

  .cta-group {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 16px 30px;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    text-decoration: none;
    transition: transform 0.2s, box-shadow 0.2s;
    cursor: pointer;
    border: none;
  }

  .btn:hover { transform: translateY(-3px); }

  .btn-primary {
    background: linear-gradient(135deg, #0288D1, #4FC3F7);
    color: white;
    box-shadow: 0 6px 24px rgba(2,136,209,0.35);
  }
  .btn-primary:hover { box-shadow: 0 10px 30px rgba(2,136,209,0.45); }

  .btn-secondary {
    background: var(--white);
    color: var(--navy);
    box-shadow: 0 6px 24px rgba(13,71,161,0.15);
    border: 2px solid rgba(79,195,247,0.4);
  }
  .btn-secondary:hover { box-shadow: 0 10px 30px rgba(13,71,161,0.22); }

  .scroll-hint {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    opacity: 0.55;
    animation: bounce 2s ease-in-out infinite;
    z-index: 2;
  }
  .scroll-hint span {
    font-size: 0.72rem;
    font-family: 'Inter', sans-serif;
    color: var(--navy);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .scroll-arrow {
    width: 20px; height: 20px;
    border-right: 2px solid var(--navy);
    border-bottom: 2px solid var(--navy);
