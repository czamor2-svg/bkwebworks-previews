<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ $json.name }} – Fresh. Fast. Easy.</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky: #4FC3F7;
      --aqua: #E0F7FA;
      --navy: #0D47A1;
      --navy-light: #1565C0;
      --white: #FFFFFF;
      --soft-gray: #F5FBFF;
      --text-body: #1a3a5c;
      --shadow: 0 8px 32px rgba(13,71,161,0.10);
      --radius: 20px;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-body);
      background: var(--white);
      overflow-x: hidden;
    }

    h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

    /* ─── HERO ─────────────────────────────────────────────── */
    #hero {
      min-height: 100vh;
      background: linear-gradient(160deg, #e0f7fa 0%, #b3e5fc 40%, #81d4fa 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem 4rem;
      position: relative;
      overflow: hidden;
    }

    /* Background decorative circles */
    #hero::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: rgba(255,255,255,0.18);
      top: -150px; right: -150px;
      pointer-events: none;
    }
    #hero::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: rgba(255,255,255,0.13);
      bottom: -100px; left: -100px;
      pointer-events: none;
    }

    /* ── Washing Machine ── */
    .machine-wrap {
      position: relative;
      width: 180px;
      height: 210px;
      margin-bottom: 2.5rem;
      flex-shrink: 0;
    }

    .machine-body {
      position: absolute;
      bottom: 0; left: 0;
      width: 180px; height: 190px;
      background: linear-gradient(160deg, #ffffff 60%, #e3f2fd 100%);
      border-radius: 22px;
      box-shadow: 0 12px 40px rgba(13,71,161,0.18), inset 0 2px 8px rgba(255,255,255,0.8);
    }

    /* top panel bar */
    .machine-top-bar {
      position: absolute;
      top: 12px; left: 18px; right: 18px;
      height: 28px;
      background: linear-gradient(90deg, #4FC3F7, #29B6F6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      gap: 6px;
    }
    .dot { width: 8px; height: 8px; border-radius: 50%; }
    .dot-r { background: #ef5350; }
    .dot-g { background: #66BB6A; }

    /* drum circle */
    .drum-ring {
      position: absolute;
      top: 52px; left: 50%;
      transform: translateX(-50%);
      width: 110px; height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #e3f2fd 0%, #b3e5fc 100%);
      border: 6px solid #4FC3F7;
      box-shadow: 0 4px 20px rgba(79,195,247,0.35), inset 0 2px 8px rgba(255,255,255,0.6);
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }

    .drum-inner {
      width: 82px; height: 82px;
      border-radius: 50%;
      background: linear-gradient(135deg, #b3e5fc 0%, #81d4fa 50%, #4FC3F7 100%);
      animation: spinDrum 3s linear infinite;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }

    @keyframes spinDrum {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* clothes inside drum */
    .drum-clothes {
      position: absolute;
      border-radius: 40px;
    }
    .drum-clothes.c1 {
      width: 36px; height: 18px;
      background: rgba(255,255,255,0.75);
      top: 18px; left: 10px;
      transform: rotate(-30deg);
    }
    .drum-clothes.c2 {
      width: 28px; height: 14px;
      background: rgba(255,255,255,0.55);
      bottom: 14px; right: 8px;
      transform: rotate(20deg);
    }
    .drum-clothes.c3 {
      width: 20px; height: 10px;
      background: rgba(255,255,255,0.45);
      bottom: 26px; left: 14px;
      transform: rotate(50deg);
    }

    /* drum holes */
    .drum-hole {
      position: absolute;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(13,71,161,0.15);
    }
    .drum-hole.h1 { top: 12px; left: 50%; transform: translateX(-50%); }
    .drum-hole.h2 { top: 35px; left: 12px; }
    .drum-hole.h3 { top: 35px; right: 12px; }
    .drum-hole.h4 { bottom: 12px; left: 50%; transform: translateX(-50%); }
    .drum-hole.h5 { bottom: 35px; left: 12px; }
    .drum-hole.h6 { bottom: 35px; right: 12px; }

    /* bottom panel */
    .machine-bottom {
      position: absolute;
      bottom: 14px; left: 18px; right: 18px;
      height: 14px;
      background: linear-gradient(90deg, #b3e5fc, #4FC3F7, #b3e5fc);
      border-radius: 6px;
      opacity: 0.5;
    }

    /* ── Bubbles ── */
    .bubbles-wrap {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 320px;
      pointer-events: none;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.85), rgba(79,195,247,0.3));
      border: 1.5px solid rgba(255,255,255,0.7);
      animation: floatUp linear infinite;
      bottom: 0;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1); opacity: 0.85; }
      80%  { opacity: 0.6; }
      100% { transform: translateY(-260px) scale(0.6); opacity: 0; }
    }

    .bubble:nth-child(1)  { width:14px; height:14px; left:20px;  animation-duration:3.2s; animation-delay:0s; }
    .bubble:nth-child(2)  { width:10px; height:10px; left:55px;  animation-duration:2.7s; animation-delay:0.5s; }
    .bubble:nth-child(3)  { width:18px; height:18px; left:90px;  animation-duration:3.8s; animation-delay:1.1s; }
    .bubble:nth-child(4)  { width:8px;  height:8px;  left:130px; animation-duration:2.4s; animation-delay:0.3s; }
    .bubble:nth-child(5)  { width:12px; height:12px; left:160px; animation-duration:3.5s; animation-delay:0.8s; }
    .bubble:nth-child(6)  { width:16px; height:16px; left:40px;  animation-duration:4.0s; animation-delay:1.6s; }
    .bubble:nth-child(7)  { width:9px;  height:9px;  left:110px; animation-duration:2.9s; animation-delay:2.0s; }
    .bubble:nth-child(8)  { width:11px; height:11px; left:75px;  animation-duration:3.3s; animation-delay:1.3s; }

    /* ── Hero text ── */
    .hero-text { position: relative; z-index: 2; }

    .hero-text h1 {
      font-size: clamp(2.4rem, 7vw, 4rem);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.15;
      margin-bottom: 0.6rem;
      letter-spacing: -0.5px;
    }

    .hero-text h1 span {
      color: #0288D1;
    }

    .hero-sub {
      font-size: clamp(1rem, 3vw, 1.25rem);
      color: #1565C0;
      font-weight: 500;
      margin-bottom: 2.2rem;
      opacity: 0.85;
    }

    .hero-btns {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 2rem;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      border: none;
    }

    .btn:hover { transform: translateY(-3px); }

    .btn-primary {
      background: var(--navy);
      color: var(--white);
      box-shadow: 0 6px 24px rgba(13,71,161,0.28);
    }
    .btn-primary:hover { box-shadow: 0 10px 30px rgba(13,71,161,0.38); }

    .btn-secondary {
      background: var(--white);
      color: var(--navy);
      box-shadow: 0 6px 24px rgba(13,71,161,0.15);
    }
    .btn-secondary:hover { box-shadow: 0 10px 30px rgba(13,71,161,0.22); }

    /* ── Scroll indicator ── */
    .scroll-hint {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      color: var(--navy-light);
      font-size: 0.75rem;
      font-family: 'Inter', sans-serif;
      opacity: 0.65;
      animation: bounce 2s ease-in-out infinite;
    }

    .scroll-hint::after {
      content: '';
      width: 2px;
      height: 28px;
      background: linear-gradient(to bottom, var(--navy-light), transparent);
      border-radius: 2px;
    }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50%       { transform: translateX(-50%) translateY(6px); }
    }

    /* ─── SECTIONS SHARED ───────────────────────────────────── */
    section { padding: 5rem 1.5rem; }

    .section-inner {
      max-width: 900px;
      margin: 0 auto;
    }

    .section-label {
      display: inline-block;
      background: var(--aqua);
      color: var(--navy);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 0.3rem 1rem;
      border-radius: 50px;
      margin-bottom: 1rem;
    }

    .section-title {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 1rem;
      line-height: 1.25;
    }

    .section-sub {
      font-size: 1rem;
      color: var(--text-body);
      opacity: 0.75;
      margin-bottom: 3rem;
      max-width: 540px;
    }

    /* fade-in on scroll */
    .fade-in {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* ─── SERVICES ──────────────────────────────────────────── */
    #services { background: var(--white); }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1.5rem;
    }

    .service-card {
      background: var(--aqua);
      border-radius: var(--radius);
      padding: 2rem 1.5rem;
      text-align: center;
      box-shadow: var(--shadow);
      transition: transform 0.25s, box-shadow 0.25s;
