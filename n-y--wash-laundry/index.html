<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ $json.name }} – Fresh. Fast. Easy.</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #4FC3F7;
      --aqua: #E0F7FA;
      --navy: #0D47A1;
      --navy-light: #1565C0;
      --white: #FFFFFF;
      --text: #1A2E4A;
      --shadow: 0 4px 24px rgba(13,71,161,0.10);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--white);
      overflow-x: hidden;
    }

    h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

    /* ─── HERO ─── */
    .hero {
      min-height: 100vh;
      background: linear-gradient(160deg, #E0F7FA 0%, #B3E5FC 40%, #4FC3F7 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem 3rem;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    /* Floating background circles */
    .hero::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: rgba(255,255,255,0.18);
      border-radius: 50%;
      top: -120px; right: -120px;
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      width: 300px; height: 300px;
      background: rgba(255,255,255,0.12);
      border-radius: 50%;
      bottom: -80px; left: -80px;
      pointer-events: none;
    }

    /* ─── WASHING MACHINE ─── */
    .washer-wrap {
      position: relative;
      width: 180px;
      height: 210px;
      margin: 0 auto 2.5rem;
    }

    .washer-body {
      width: 160px;
      height: 190px;
      background: linear-gradient(145deg, #fff 60%, #e3f2fd);
      border-radius: 18px;
      position: absolute;
      left: 10px; top: 10px;
      box-shadow: 0 8px 32px rgba(13,71,161,0.18), inset 0 2px 8px rgba(255,255,255,0.8);
      border: 3px solid rgba(79,195,247,0.5);
    }

    .washer-top {
      width: 160px;
      height: 28px;
      background: linear-gradient(90deg, #4FC3F7, #29B6F6);
      border-radius: 18px 18px 0 0;
      position: absolute;
      left: 10px; top: 10px;
      box-shadow: 0 2px 8px rgba(13,71,161,0.15);
    }

    .washer-panel {
      position: absolute;
      top: 14px; right: 20px;
      display: flex;
      gap: 5px;
      align-items: center;
    }
    .washer-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.85);
    }
    .washer-dot:first-child { background: #FFD54F; }
    .washer-dot:last-child { background: #81C784; }

    .washer-drum-wrap {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #E3F2FD 0%, #B3E5FC 100%);
      border: 5px solid #4FC3F7;
      position: absolute;
      top: 52px;
      left: 35px;
      overflow: hidden;
      box-shadow: inset 0 4px 16px rgba(13,71,161,0.18), 0 2px 8px rgba(79,195,247,0.3);
    }

    .washer-drum {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      position: relative;
      animation: spinDrum 3s linear infinite;
    }

    @keyframes spinDrum {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    .drum-hole {
      width: 22px; height: 22px;
      border-radius: 50%;
      background: rgba(13,71,161,0.12);
      border: 2px solid rgba(79,195,247,0.5);
      position: absolute;
    }
    .drum-hole:nth-child(1) { top: 12px; left: 50%; transform: translateX(-50%); }
    .drum-hole:nth-child(2) { bottom: 12px; left: 50%; transform: translateX(-50%); }
    .drum-hole:nth-child(3) { left: 12px; top: 50%; transform: translateY(-50%); }
    .drum-hole:nth-child(4) { right: 12px; top: 50%; transform: translateY(-50%); }

    /* Clothes shapes inside drum */
    .drum-clothes {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cloth {
      position: absolute;
      border-radius: 8px;
      opacity: 0.7;
    }
    .cloth-1 { width: 30px; height: 20px; background: #fff; top: 20px; left: 25px; transform: rotate(-20deg); }
    .cloth-2 { width: 25px; height: 18px; background: #B3E5FC; bottom: 22px; right: 18px; transform: rotate(15deg); }
    .cloth-3 { width: 20px; height: 14px; background: #fff; bottom: 28px; left: 22px; transform: rotate(5deg); }

    .washer-door-ring {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 4px solid rgba(79,195,247,0.35);
      position: absolute;
      top: 47px;
      left: 30px;
    }

    .washer-bottom {
      position: absolute;
      bottom: 10px;
      left: 35px;
      width: 90px;
      height: 12px;
      background: #E3F2FD;
      border-radius: 6px;
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: center;
    }
    .washer-btn {
      width: 18px; height: 6px;
      border-radius: 3px;
      background: #4FC3F7;
    }
    .washer-btn:last-child { background: #29B6F6; width: 30px; }

    /* ─── BUBBLES ─── */
    .bubbles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .bubble {
      position: absolute;
      bottom: -40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      border: 1.5px solid rgba(255,255,255,0.8);
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(1); opacity: 0.7; }
      80% { opacity: 0.4; }
      100% { transform: translateY(-110vh) scale(0.6); opacity: 0; }
    }

    .bubble:nth-child(1)  { width:14px; height:14px; left:10%;  animation-duration:7s;  animation-delay:0s; }
    .bubble:nth-child(2)  { width:22px; height:22px; left:22%;  animation-duration:9s;  animation-delay:1.2s; }
    .bubble:nth-child(3)  { width:10px; height:10px; left:36%;  animation-duration:6s;  animation-delay:2s; }
    .bubble:nth-child(4)  { width:18px; height:18px; left:50%;  animation-duration:8s;  animation-delay:0.5s; }
    .bubble:nth-child(5)  { width:28px; height:28px; left:62%;  animation-duration:11s; animation-delay:3s; }
    .bubble:nth-child(6)  { width:12px; height:12px; left:75%;  animation-duration:7.5s;animation-delay:1.8s; }
    .bubble:nth-child(7)  { width:20px; height:20px; left:85%;  animation-duration:9.5s;animation-delay:0.8s; }
    .bubble:nth-child(8)  { width:8px;  height:8px;  left:92%;  animation-duration:6.5s;animation-delay:4s; }
    .bubble:nth-child(9)  { width:16px; height:16px; left:5%;   animation-duration:8.5s;animation-delay:2.5s; }
    .bubble:nth-child(10) { width:24px; height:24px; left:44%;  animation-duration:10s; animation-delay:1s; }

    /* ─── HERO TEXT ─── */
    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 560px;
    }

    .hero-badge {
      display: inline-block;
      background: rgba(255,255,255,0.7);
      color: var(--navy);
      font-family: 'Inter', sans-serif;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 0.35rem 1rem;
      border-radius: 50px;
      margin-bottom: 1.2rem;
      backdrop-filter: blur(8px);
    }

    .hero h1 {
      font-size: clamp(2.4rem, 7vw, 4rem);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.1;
      margin-bottom: 1rem;
      text-shadow: 0 2px 12px rgba(255,255,255,0.5);
    }

    .hero h1 span { color: #0277BD; }

    .hero p {
      font-size: clamp(1rem, 3vw, 1.2rem);
      color: #1565C0;
      font-weight: 500;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .hero-btns {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 1.8rem;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      border: none;
    }

    .btn:hover { transform: translateY(-2px); }

    .btn-primary {
      background: var(--navy);
      color: #fff;
      box-shadow: 0 6px 20px rgba(13,71,161,0.35);
    }
    .btn-primary:hover { box-shadow: 0 10px 28px rgba(13,71,161,0.45); }

    .btn-secondary {
      background: rgba(255,255,255,0.85);
      color: var(--navy);
      box-shadow: 0 4px 16px rgba(79,195,247,0.3);
      backdrop-filter: blur(8px);
    }
    .btn-secondary:hover { box-shadow: 0 8px 24px rgba(79,195,247,0.4); }

    /* ─── SCROLL ARROW ─── */
    .scroll-hint {
      position: absolute;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      color: var(--navy);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      opacity: 0.6;
      animation: bounce 2s ease-in-out infinite;
      z-index: 2;
    }
    .scroll-hint svg { width: 22px; height: 22px; }

    @keyframes bounce {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(6px); }
    }

    /* ─── SECTIONS ─── */
    section { padding: 5rem 1.5rem; }

    .container { max-width: 900px; margin: 0 auto; }

    .section-label {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #29B6F6;
      margin-bottom: 0.75rem;
    }

    .section-title {
      font-size: clamp(1.8rem, 5vw, 2.6rem);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .section-sub {
      font-size: 1.05rem;
      color: #546E7A;
      line-height: 1.7;
      max-width: 540px;
    }

    /* ─── SERVICES ─── */
