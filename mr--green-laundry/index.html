<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ $json.name }} – Fresh. Fast. Easy.</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #4FC3F7;
      --aqua: #E0F7FA;
      --navy: #0D47A1;
      --navy-light: #1565C0;
      --white: #FFFFFF;
      --soft-gray: #F5FDFF;
      --text-body: #2C3E50;
      --shadow: 0 8px 32px rgba(13,71,161,0.10);
      --shadow-lg: 0 16px 48px rgba(13,71,161,0.15);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text-body);
      background: var(--white);
      overflow-x: hidden;
    }

    h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

    /* ── HERO ── */
    .hero {
      min-height: 100vh;
      background: linear-gradient(160deg, #B3E5FC 0%, #E0F7FA 40%, #ffffff 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px 60px;
      position: relative;
      overflow: hidden;
    }

    /* Background bubbles */
    .bg-bubbles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .bg-bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(79,195,247,0.18);
      animation: bgFloat linear infinite;
    }
    .bg-bubble:nth-child(1)  { width:60px;  height:60px;  left:5%;   animation-duration:12s; animation-delay:0s; }
    .bg-bubble:nth-child(2)  { width:30px;  height:30px;  left:15%;  animation-duration:9s;  animation-delay:2s; }
    .bg-bubble:nth-child(3)  { width:80px;  height:80px;  left:25%;  animation-duration:14s; animation-delay:1s; }
    .bg-bubble:nth-child(4)  { width:20px;  height:20px;  left:40%;  animation-duration:8s;  animation-delay:3s; }
    .bg-bubble:nth-child(5)  { width:50px;  height:50px;  left:60%;  animation-duration:11s; animation-delay:0.5s; }
    .bg-bubble:nth-child(6)  { width:35px;  height:35px;  left:75%;  animation-duration:10s; animation-delay:1.5s; }
    .bg-bubble:nth-child(7)  { width:70px;  height:70px;  left:85%;  animation-duration:13s; animation-delay:2.5s; }
    .bg-bubble:nth-child(8)  { width:25px;  height:25px;  left:92%;  animation-duration:7s;  animation-delay:4s; }
    @keyframes bgFloat {
      0%   { transform: translateY(110vh) scale(1); opacity:0; }
      10%  { opacity:1; }
      90%  { opacity:0.6; }
      100% { transform: translateY(-120px) scale(1.1); opacity:0; }
    }

    /* Washing Machine CSS Art */
    .machine-wrap {
      position: relative;
      width: 200px;
      height: 220px;
      margin: 0 auto 36px;
    }

    /* Machine body */
    .machine-body {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 190px;
      background: linear-gradient(145deg, #ffffff 0%, #dff4fc 100%);
      border-radius: 18px;
      box-shadow: 0 12px 40px rgba(79,195,247,0.30), inset 0 2px 6px rgba(255,255,255,0.9);
      border: 3px solid #B3E5FC;
    }

    /* Control panel strip */
    .machine-panel {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      height: 28px;
      background: linear-gradient(90deg, #4FC3F7, #29B6F6);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      gap: 6px;
    }
    .panel-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.85);
    }
    .panel-dot.green { background: #A5D6A7; }

    /* Porthole outer ring */
    .porthole-ring {
      position: absolute;
      top: 52px;
      left: 50%;
      transform: translateX(-50%);
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: linear-gradient(145deg, #B3E5FC, #4FC3F7);
      box-shadow: 0 4px 16px rgba(79,195,247,0.5), inset 0 2px 4px rgba(255,255,255,0.6);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Porthole glass */
    .porthole-glass {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9) 0%, rgba(224,247,250,0.7) 50%, rgba(179,229,252,0.5) 100%);
      border: 3px solid rgba(255,255,255,0.6);
      overflow: hidden;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    /* Drum inside porthole */
    .drum {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      border: 3px solid rgba(79,195,247,0.4);
      position: relative;
      animation: spinDrum 3s linear infinite;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    @keyframes spinDrum {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }
    .drum-item {
      position: absolute;
      border-radius: 50%;
    }
    .drum-item:nth-child(1) {
      width: 24px; height: 14px;
      background: linear-gradient(135deg, #FFFFFF, #B3E5FC);
      border-radius: 30px;
      top: 8px; left: 22px;
      opacity: 0.9;
      box-shadow: 0 2px 6px rgba(79,195,247,0.4);
    }
    .drum-item:nth-child(2) {
      width: 18px; height: 18px;
      background: linear-gradient(135deg, #E0F7FA, #FFFFFF);
      border-radius: 50%;
      bottom: 10px; right: 8px;
      opacity: 0.85;
      box-shadow: 0 2px 6px rgba(79,195,247,0.3);
    }
    .drum-item:nth-child(3) {
      width: 20px; height: 12px;
      background: linear-gradient(135deg, #B3E5FC, #FFFFFF);
      border-radius: 20px;
      bottom: 12px; left: 6px;
      opacity: 0.8;
    }
    /* Drum holes */
    .drum::before, .drum::after {
      content: '';
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(79,195,247,0.5);
      border: 1px solid rgba(255,255,255,0.6);
    }
    .drum::before { top: 6px; left: 50%; transform: translateX(-50%); }
    .drum::after  { bottom: 6px; left: 50%; transform: translateX(-50%); }

    /* Glare on porthole */
    .porthole-glare {
      position: absolute;
      top: 8px; left: 10px;
      width: 30px; height: 16px;
      background: rgba(255,255,255,0.55);
      border-radius: 50%;
      transform: rotate(-25deg);
      pointer-events: none;
    }

    /* Machine bottom bar */
    .machine-bottom {
      position: absolute;
      bottom: 12px;
      left: 14px;
      right: 14px;
      height: 14px;
      background: linear-gradient(90deg, #E0F7FA, #B3E5FC);
      border-radius: 8px;
    }

    /* Floating bubbles from machine */
    .bubbles-container {
      position: absolute;
      bottom: 190px;
      left: 50%;
      transform: translateX(-50%);
      width: 180px;
      height: 140px;
      pointer-events: none;
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), rgba(79,195,247,0.3));
      border: 1.5px solid rgba(79,195,247,0.35);
      animation: floatUp ease-in infinite;
    }
    .bubble:nth-child(1) { width:14px; height:14px; left:20%;  animation-duration:2.8s; animation-delay:0.0s; }
    .bubble:nth-child(2) { width:10px; height:10px; left:45%;  animation-duration:3.2s; animation-delay:0.6s; }
    .bubble:nth-child(3) { width:18px; height:18px; left:65%;  animation-duration:2.5s; animation-delay:1.1s; }
    .bubble:nth-child(4) { width:8px;  height:8px;  left:30%;  animation-duration:3.6s; animation-delay:0.3s; }
    .bubble:nth-child(5) { width:12px; height:12px; left:75%;  animation-duration:2.9s; animation-delay:1.8s; }
    .bubble:nth-child(6) { width:6px;  height:6px;  left:55%;  animation-duration:3.0s; animation-delay:0.9s; }
    @keyframes floatUp {
      0%   { transform: translateY(0) scale(0.6); opacity:0; }
      15%  { opacity:0.9; }
      80%  { opacity:0.6; }
      100% { transform: translateY(-130px) scale(1.1); opacity:0; }
    }

    /* Steam lines */
    .steam {
      position: absolute;
      top: -30px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 10px;
    }
    .steam-line {
      width: 4px;
      height: 20px;
      background: linear-gradient(to top, rgba(79,195,247,0.4), transparent);
      border-radius: 4px;
      animation: steamRise 2s ease-in-out infinite;
    }
    .steam-line:nth-child(2) { animation-delay: 0.4s; height:14px; }
    .steam-line:nth-child(3) { animation-delay: 0.8s; }
    @keyframes steamRise {
      0%   { transform: translateY(0) scaleX(1); opacity:0.7; }
      50%  { transform: translateY(-10px) scaleX(1.4); opacity:0.4; }
      100% { transform: translateY(-20px) scaleX(0.8); opacity:0; }
    }

    /* Hero text */
    .hero-content {
      position: relative;
      z-index: 2;
    }
    .hero-tagline {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(2.2rem, 8vw, 3.8rem);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.1;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
    }
    .hero-tagline span {
      background: linear-gradient(135deg, #4FC3F7, #0D47A1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-sub {
      font-size: clamp(1rem, 3.5vw, 1.25rem);
      color: var(--navy-light);
      font-weight: 500;
      margin-bottom: 8px;
    }
    .hero-address {
      font-size: clamp(0.85rem, 2.5vw, 1rem);
      color: #546E7A;
      margin-bottom: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .hero-address::before { content: '📍'; font-size: 1rem; }

    .cta-group {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      justify-content: center;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 16px 32px;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      transition: transform 0.2s, box-shadow
