<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ $json.name }} – Fresh. Fast. Easy.</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #4FC3F7;
      --navy: #0D47A1;
      --aqua: #E0F7FA;
      --aqua-mid: #B2EBF2;
      --white: #FFFFFF;
      --text: #1a2e4a;
      --soft: #f0fbff;
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      color: var(--text);
      background: var(--white);
      overflow-x: hidden;
    }

    h1, h2, h3 { font-family: 'Poppins', sans-serif; }

    /* ── HERO ── */
    #hero {
      min-height: 100vh;
      background: linear-gradient(160deg, #e0f7fa 0%, #b2ebf2 40%, #81d4fa 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 24px 60px;
      position: relative;
      overflow: hidden;
    }

    /* floating background blobs */
    #hero::before {
      content: '';
      position: absolute;
      width: 600px; height: 600px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      top: -200px; left: -200px;
      pointer-events: none;
    }
    #hero::after {
      content: '';
      position: absolute;
      width: 400px; height: 400px;
      border-radius: 50%;
      background: rgba(255,255,255,0.2);
      bottom: -150px; right: -150px;
      pointer-events: none;
    }

    /* ── WASHING MACHINE ── */
    .machine-wrap {
      position: relative;
      width: 180px;
      height: 200px;
      margin: 0 auto 36px;
      filter: drop-shadow(0 12px 30px rgba(13,71,161,0.18));
    }

    .machine-body {
      position: absolute;
      bottom: 0; left: 0;
      width: 180px; height: 175px;
      background: linear-gradient(160deg, #ffffff 0%, #e3f6ff 100%);
      border-radius: 22px;
      border: 3px solid #90caf9;
    }

    /* top panel */
    .machine-top {
      position: absolute;
      top: 12px; left: 12px; right: 12px;
      height: 28px;
      background: linear-gradient(90deg, #4FC3F7, #29b6f6);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding-right: 10px;
      gap: 6px;
    }
    .led { width: 8px; height: 8px; border-radius: 50%; }
    .led.on  { background: #a5f3a5; box-shadow: 0 0 6px #4ade80; animation: blink 1.8s infinite; }
    .led.off { background: #fca5a5; }

    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

    /* drum porthole */
    .drum-ring {
      position: absolute;
      top: 52px; left: 50%;
      transform: translateX(-50%);
      width: 110px; height: 110px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1565c0 0%, #1e88e5 50%, #42a5f5 100%);
      border: 6px solid #90caf9;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
      box-shadow: inset 0 4px 16px rgba(0,0,0,0.25), 0 4px 12px rgba(13,71,161,0.2);
    }

    .drum-inner {
      width: 86px; height: 86px;
      border-radius: 50%;
      background: radial-gradient(circle at 40% 35%, #64b5f6 0%, #1565c0 70%);
      animation: spin 3s linear infinite;
      position: relative;
      overflow: hidden;
    }

    @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    /* drum paddles */
    .drum-inner::before,
    .drum-inner::after {
      content: '';
      position: absolute;
      width: 6px; height: 60px;
      background: rgba(255,255,255,0.25);
      border-radius: 3px;
      top: 13px; left: 50%;
      transform-origin: bottom center;
    }
    .drum-inner::before { transform: translateX(-50%) rotate(0deg); }
    .drum-inner::after  { transform: translateX(-50%) rotate(120deg); }

    /* clothes shapes inside drum */
    .cloth {
      position: absolute;
      border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
      opacity: 0.85;
    }
    .cloth-1 { width:28px;height:20px; background:#fff; top:18px; left:20px; transform:rotate(25deg); }
    .cloth-2 { width:22px;height:16px; background:#b2dfdb; top:46px; left:36px; transform:rotate(-15deg); }
    .cloth-3 { width:18px;height:14px; background:#e1f5fe; top:32px; left:8px; transform:rotate(60deg); }

    /* door handle */
    .drum-handle {
      position: absolute;
      right: 14px; top: 50%; transform: translateY(-50%);
      width: 8px; height: 28px;
      background: #90caf9;
      border-radius: 4px;
    }

    /* bottom controls */
    .machine-controls {
      position: absolute;
      bottom: 12px; left: 16px; right: 16px;
      display: flex; gap: 8px; align-items: center;
    }
    .ctrl-dial {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, #e3f6ff, #90caf9);
      border: 2px solid #4FC3F7;
      animation: dial-spin 4s linear infinite;
    }
    @keyframes dial-spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    .ctrl-bar {
      flex: 1; height: 8px; border-radius: 4px;
      background: linear-gradient(90deg, #4FC3F7 60%, #e0f7fa 60%);
    }
    .ctrl-btn {
      width: 22px; height: 22px; border-radius: 6px;
      background: #4FC3F7;
      box-shadow: 0 2px 6px rgba(79,195,247,0.5);
    }

    /* ── BUBBLES ── */
    .bubbles {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 300px;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      border: 1.5px solid rgba(255,255,255,0.8);
      animation: float-up linear infinite;
    }
    .bubble:nth-child(1)  { width:14px;height:14px; left:20%; bottom:0; animation-duration:4.2s; animation-delay:0s; }
    .bubble:nth-child(2)  { width:9px; height:9px;  left:40%; bottom:0; animation-duration:3.5s; animation-delay:0.8s; }
    .bubble:nth-child(3)  { width:18px;height:18px; left:60%; bottom:0; animation-duration:5s;   animation-delay:1.4s; }
    .bubble:nth-child(4)  { width:11px;height:11px; left:75%; bottom:0; animation-duration:3.8s; animation-delay:2s; }
    .bubble:nth-child(5)  { width:7px; height:7px;  left:10%; bottom:0; animation-duration:4.6s; animation-delay:0.3s; }
    .bubble:nth-child(6)  { width:15px;height:15px; left:50%; bottom:0; animation-duration:5.2s; animation-delay:1s; }
    .bubble:nth-child(7)  { width:10px;height:10px; left:85%; bottom:0; animation-duration:3.9s; animation-delay:2.5s; }
    .bubble:nth-child(8)  { width:8px; height:8px;  left:30%; bottom:0; animation-duration:4.8s; animation-delay:1.7s; }

    @keyframes float-up {
      0%   { transform: translateY(0) scale(1);   opacity: 0; }
      10%  { opacity: 0.8; }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-320px) scale(0.6); opacity: 0; }
    }

    /* ── HERO TEXT ── */
    .hero-headline {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(2.4rem, 7vw, 4rem);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.15;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
      position: relative; z-index: 1;
    }
    .hero-headline span { color: #0288d1; }

    .hero-sub {
      font-family: 'Poppins', sans-serif;
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 600;
      color: #1565c0;
      margin-bottom: 8px;
      position: relative; z-index: 1;
    }

    .hero-tagline {
      font-size: 0.95rem;
      color: #1976d2;
      margin-bottom: 36px;
      position: relative; z-index: 1;
    }

    .hero-btns {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      position: relative; z-index: 1;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 15px 30px;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary {
      background: var(--navy);
      color: #fff;
      box-shadow: 0 6px 20px rgba(13,71,161,0.35);
    }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(13,71,161,0.4); }
    .btn-secondary {
      background: #fff;
      color: var(--navy);
      box-shadow: 0 6px 20px rgba(13,71,161,0.15);
      border: 2px solid #90caf9;
    }
    .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(13,71,161,0.2); }

    /* ── SECTIONS SHARED ── */
    section { padding: 72px 24px; }

    .section-label {
      font-family: 'Poppins', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #0288d1;
      margin-bottom: 10px;
      display: block;
    }

    .section-title {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 800;
      color: var(--navy);
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .section-desc {
      color: #546e7a;
      font-size: 1rem;
      line-height: 1.7;
      max-width: 560px;
      margin: 0 auto;
    }

    .text-center { text-align: center; }

    /* ── SERVICES ── */
    #services {
      background: var(--soft);
    }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      max-width: 960px;
      margin: 48px auto 0;
    }

    .service-card {
      background: #fff;
      border-radius: 20px;
      padding: 32px 24px;
      box-shadow: 0 4px 20px rgba(13,71,161,0.08);
      border: 1.5px solid #e1f5fe;
      transition: transform 0.3s, box-shadow 0.3s;
      text-align: center;
    }
    .service-card:hover { transform: translateY(-4px); box-shadow: 0 12px 32px rgba(13,71,161,0.14); }

    .service-icon {
      font-size: 2.4rem;
      margin-bottom: 16px;
      display: block;
      line-height: 1;
    }

    .service-card h3 {
      font-size: 1.1rem;
      font-weight: 700;
      color
