<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ $json.name }} – Fresh. Fast. Easy.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #4FC3F7;
    --white: #FFFFFF;
    --aqua: #E0F7FA;
    --navy: #0D47A1;
    --navy-light: #1565C0;
    --sky-dark: #29B6F6;
    --shadow: 0 8px 32px rgba(13,71,161,0.10);
    --shadow-lg: 0 16px 48px rgba(13,71,161,0.15);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--white);
    color: var(--navy);
    overflow-x: hidden;
  }

  h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

  /* ========== HERO ========== */
  .hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #E0F7FA 0%, #B3E5FC 40%, #81D4FA 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem 1.5rem 4rem;
    position: relative;
    overflow: hidden;
  }

  /* Background wave */
  .hero::before {
    content: '';
    position: absolute;
    bottom: -2px;
    left: 0;
    width: 100%;
    height: 80px;
    background: var(--white);
    clip-path: ellipse(55% 100% at 50% 100%);
  }

  /* Floating bubbles */
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    animation: floatUp linear infinite;
    pointer-events: none;
  }
  .bubble:nth-child(1)  { width:14px; height:14px; left:8%;  bottom:-20px; animation-duration:6s;  animation-delay:0s; }
  .bubble:nth-child(2)  { width:22px; height:22px; left:18%; bottom:-20px; animation-duration:8s;  animation-delay:1s; }
  .bubble:nth-child(3)  { width:10px; height:10px; left:30%; bottom:-20px; animation-duration:5s;  animation-delay:2s; }
  .bubble:nth-child(4)  { width:18px; height:18px; left:45%; bottom:-20px; animation-duration:7s;  animation-delay:0.5s; }
  .bubble:nth-child(5)  { width:26px; height:26px; left:60%; bottom:-20px; animation-duration:9s;  animation-delay:1.5s; }
  .bubble:nth-child(6)  { width:12px; height:12px; left:72%; bottom:-20px; animation-duration:6.5s;animation-delay:3s; }
  .bubble:nth-child(7)  { width:20px; height:20px; left:83%; bottom:-20px; animation-duration:7.5s;animation-delay:2s; }
  .bubble:nth-child(8)  { width:8px;  height:8px;  left:92%; bottom:-20px; animation-duration:5.5s;animation-delay:0.8s; }
  .bubble:nth-child(9)  { width:16px; height:16px; left:55%; bottom:-20px; animation-duration:8.5s;animation-delay:4s; }
  .bubble:nth-child(10) { width:11px; height:11px; left:25%; bottom:-20px; animation-duration:6.2s;animation-delay:2.5s; }

  @keyframes floatUp {
    0%   { transform: translateY(0) scale(1);   opacity: 0.7; }
    50%  { opacity: 0.9; }
    100% { transform: translateY(-110vh) scale(0.6); opacity: 0; }
  }

  /* === WASHING MACHINE SVG-STYLE CSS === */
  .machine-wrap {
    position: relative;
    width: 200px;
    height: 220px;
    margin: 0 auto 2rem;
    filter: drop-shadow(0 12px 24px rgba(13,71,161,0.2));
  }

  /* Machine body */
  .machine-body {
    position: absolute;
    width: 180px;
    height: 200px;
    background: linear-gradient(145deg, #ffffff, #e8f4fd);
    border-radius: 22px;
    left: 10px;
    top: 10px;
    box-shadow: 0 8px 32px rgba(13,71,161,0.18), inset 0 1px 0 rgba(255,255,255,0.9);
    border: 2px solid rgba(79,195,247,0.3);
  }

  /* Top control panel */
  .machine-panel {
    position: absolute;
    width: 180px;
    height: 38px;
    background: linear-gradient(135deg, #4FC3F7, #29B6F6);
    border-radius: 20px 20px 0 0;
    left: 10px;
    top: 10px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 16px;
    gap: 8px;
  }

  .panel-dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.8);
  }
  .panel-dot:first-child { background: #fff; width: 14px; height: 14px; }

  /* Drum window */
  .drum-window {
    position: absolute;
    width: 110px;
    height: 110px;
    border-radius: 50%;
    background: linear-gradient(135deg, #1565C0 0%, #1976D2 50%, #42A5F5 100%);
    left: 45px;
    top: 60px;
    box-shadow:
      0 0 0 8px rgba(79,195,247,0.25),
      0 0 0 14px rgba(79,195,247,0.12),
      inset 0 4px 12px rgba(0,0,0,0.25);
    overflow: hidden;
  }

  .drum-inner {
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: linear-gradient(135deg, #0D47A1, #1565C0, #1976D2);
    animation: spinDrum 3s linear infinite;
    overflow: hidden;
  }

  .drum-inner::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: repeating-conic-gradient(
      rgba(255,255,255,0.08) 0deg 30deg,
      transparent 30deg 60deg
    );
  }

  /* Clothes silhouettes in drum */
  .clothes {
    position: absolute;
    border-radius: 50%;
    animation: spinDrum 3s linear infinite;
  }
  .clothes-1 {
    width: 55px; height: 28px;
    background: rgba(255,255,255,0.85);
    top: 30px; left: 20px;
    border-radius: 30px;
    transform-origin: center;
  }
  .clothes-2 {
    width: 35px; height: 20px;
    background: rgba(200,230,255,0.75);
    top: 58px; left: 32px;
    border-radius: 20px;
  }
  .clothes-3 {
    width: 22px; height: 22px;
    background: rgba(255,255,255,0.6);
    top: 20px; left: 48px;
    border-radius: 50%;
  }

  @keyframes spinDrum {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* Drum shine */
  .drum-shine {
    position: absolute;
    width: 36px; height: 18px;
    background: rgba(255,255,255,0.2);
    border-radius: 50%;
    top: 14px; left: 18px;
    transform: rotate(-20deg);
    pointer-events: none;
  }

  /* Door handle */
  .door-handle {
    position: absolute;
    width: 30px; height: 8px;
    background: #4FC3F7;
    border-radius: 10px;
    left: 75px;
    top: 178px;
    box-shadow: 0 2px 6px rgba(13,71,161,0.2);
  }

  /* Steam/sparkle lines */
  .steam {
    position: absolute;
    top: -30px;
    left: 50%;
    transform: translateX(-50%);
  }
  .steam span {
    display: inline-block;
    width: 3px;
    height: 18px;
    background: rgba(79,195,247,0.6);
    border-radius: 3px;
    margin: 0 5px;
    animation: steamRise 2s ease-in-out infinite;
  }
  .steam span:nth-child(2) { animation-delay: 0.4s; height: 24px; }
  .steam span:nth-child(3) { animation-delay: 0.8s; }

  @keyframes steamRise {
    0%   { transform: translateY(0) scaleX(1); opacity: 0.7; }
    50%  { transform: translateY(-14px) scaleX(1.4); opacity: 0.4; }
    100% { transform: translateY(-28px) scaleX(0.8); opacity: 0; }
  }

  /* Star sparkles */
  .sparkle {
    position: absolute;
    font-size: 1.1rem;
    animation: twinkle 2.5s ease-in-out infinite;
    pointer-events: none;
  }
  .sparkle:nth-child(1) { top: 10px; left: 15px; animation-delay: 0s; }
  .sparkle:nth-child(2) { top: 30px; right: 5px; animation-delay: 0.7s; }
  .sparkle:nth-child(3) { bottom: 30px; left: 5px; animation-delay: 1.4s; }

  @keyframes twinkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50%       { opacity: 1;   transform: scale(1.2); }
  }

  /* Hero text */
  .hero-headline {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(2.4rem, 8vw, 4.2rem);
    font-weight: 900;
    color: var(--navy);
    line-height: 1.1;
    margin-bottom: 0.75rem;
    letter-spacing: -1px;
  }

  .hero-headline span {
    color: var(--navy-light);
    background: linear-gradient(135deg, #0D47A1, #4FC3F7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-sub {
    font-family: 'Inter', sans-serif;
    font-size: clamp(1rem, 3vw, 1.2rem);
    color: #1565C0;
    font-weight: 500;
    margin-bottom: 2rem;
    opacity: 0.85;
  }

  .hero-btns {
    display: flex;
    gap: 1rem;
    flex-wrap: wrap;
    justify-content: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.9rem 2rem;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    text-decoration: none;
    transition: all 0.25s ease;
    border: none;
    cursor: pointer;
    white-space: nowrap;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--navy), var(--navy-light));
    color: #fff;
    box-shadow: 0 6px 20px rgba(13,71,161,0.35);
  }
  .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 10px 28px rgba(13,71,161,0.45); }

  .btn-secondary {
    background: #fff;
    color: var(--navy);
    box-shadow: 0 6px 20px rgba(13,71,161,0.15);
    border: 2px solid rgba(79,195,247,0.4);
  }
  .btn-secondary:hover { transform: translateY(-3px); background: var(--aqua); box-shadow: 0 10px 28px rgba(13,71,161,0.2); }

  /* ========== SECTIONS ========== */
  section { padding: 5rem 1.5rem; }

  .container { max-width: 960px; margin: 0 auto; }

  .section-label {
    font-family: 'Poppins', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--sky-dark);
    margin-bottom: 0.6rem;
  }

  .section-title {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 800;
    color: var(--navy);
    margin-bottom: 1rem;
    line-height: 1.2;
  }

  .section-sub {
    font-size: 1.05rem;
    color: #546E7A;
    line-height: 1.7;
    max-width: 560px;
  }

  /* ==========
