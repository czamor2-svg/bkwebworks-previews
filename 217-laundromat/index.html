<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ $json.name }} – Fresh. Fast. Easy.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #4FC3F7;
    --white: #FFFFFF;
    --aqua: #E0F7FA;
    --navy: #0D47A1;
    --mid-blue: #29B6F6;
    --light-navy: #1565C0;
    --soft-gray: #F8FDFF;
    --text-body: #2c3e50;
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--text-body);
    background: var(--white);
    overflow-x: hidden;
  }

  h1, h2, h3 { font-family: 'Poppins', sans-serif; }

  /* ─── HERO ─────────────────────────────────────────── */
  #hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #E0F7FA 0%, #B3E5FC 40%, #81D4FA 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 24px 60px;
    position: relative;
    overflow: hidden;
  }

  /* Background decorative circles */
  #hero::before {
    content: '';
    position: absolute;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    top: -180px; right: -180px;
    pointer-events: none;
  }
  #hero::after {
    content: '';
    position: absolute;
    width: 400px; height: 400px;
    border-radius: 50%;
    background: rgba(255,255,255,0.13);
    bottom: -120px; left: -120px;
    pointer-events: none;
  }

  /* ── Washing Machine ── */
  .washer-wrap {
    position: relative;
    width: 180px; height: 200px;
    margin: 0 auto 36px;
    filter: drop-shadow(0 12px 28px rgba(13,71,161,0.18));
  }

  .washer-body {
    position: absolute;
    inset: 0;
    background: linear-gradient(145deg, #ffffff 60%, #dff1fb 100%);
    border-radius: 24px;
    border: 3px solid rgba(79,195,247,0.6);
  }

  /* top panel */
  .washer-panel {
    position: absolute;
    top: 12px; left: 14px; right: 14px;
    height: 26px;
    background: linear-gradient(90deg, #B3E5FC, #81D4FA);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 10px;
    gap: 6px;
  }
  .washer-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--navy);
    opacity: 0.5;
  }
  .washer-dot.on { background: #00E5FF; opacity: 1; animation: blink 1.8s infinite; }

  @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }

  /* drum */
  .drum-ring {
    position: absolute;
    width: 118px; height: 118px;
    top: 48px; left: 50%;
    transform: translateX(-50%);
    border-radius: 50%;
    background: linear-gradient(135deg, #4FC3F7 0%, #0288D1 100%);
    border: 5px solid rgba(255,255,255,0.7);
    box-shadow: inset 0 0 20px rgba(0,0,0,0.15), 0 4px 16px rgba(2,136,209,0.4);
    overflow: hidden;
  }

  .drum-inner {
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    background: linear-gradient(160deg, #29B6F6, #0277BD);
    animation: spin 3s linear infinite;
  }

  /* clothes shapes inside drum */
  .drum-inner::before {
    content: '';
    position: absolute;
    width: 60px; height: 20px;
    background: rgba(255,255,255,0.35);
    border-radius: 30px;
    top: 18px; left: 10px;
    transform: rotate(-20deg);
  }
  .drum-inner::after {
    content: '';
    position: absolute;
    width: 40px; height: 16px;
    background: rgba(255,255,255,0.25);
    border-radius: 20px;
    bottom: 18px; right: 8px;
    transform: rotate(15deg);
  }

  /* drum holes */
  .drum-holes {
    position: absolute;
    inset: 8px;
    border-radius: 50%;
    animation: spin 3s linear infinite;
  }
  .drum-hole {
    position: absolute;
    width: 10px; height: 10px;
    background: rgba(255,255,255,0.45);
    border-radius: 50%;
  }
  .drum-hole:nth-child(1) { top: 15%; left: 50%; transform: translateX(-50%); }
  .drum-hole:nth-child(2) { top: 50%; left: 15%; transform: translateY(-50%); }
  .drum-hole:nth-child(3) { top: 50%; right: 15%; transform: translateY(-50%); }
  .drum-hole:nth-child(4) { bottom: 15%; left: 50%; transform: translateX(-50%); }

  @keyframes spin { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

  /* door glass ring */
  .drum-glass {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 3px solid rgba(255,255,255,0.55);
    pointer-events: none;
  }

  /* door handle */
  .washer-handle {
    position: absolute;
    bottom: 14px;
    left: 50%; transform: translateX(-50%);
    width: 50px; height: 10px;
    background: linear-gradient(90deg, #B3E5FC, #4FC3F7);
    border-radius: 8px;
    border: 2px solid rgba(255,255,255,0.8);
  }

  /* ── Bubbles ── */
  .bubbles-container {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    border: 1.5px solid rgba(255,255,255,0.8);
    animation: floatUp linear infinite;
    backdrop-filter: blur(1px);
  }
  .bubble:nth-child(1)  { width:14px;height:14px; left:12%;  animation-duration:6s;  animation-delay:0s;   bottom:-20px; }
  .bubble:nth-child(2)  { width:9px; height:9px;  left:25%;  animation-duration:8s;  animation-delay:1s;   bottom:-20px; }
  .bubble:nth-child(3)  { width:18px;height:18px; left:40%;  animation-duration:7s;  animation-delay:2s;   bottom:-20px; }
  .bubble:nth-child(4)  { width:10px;height:10px; left:58%;  animation-duration:9s;  animation-delay:0.5s; bottom:-20px; }
  .bubble:nth-child(5)  { width:16px;height:16px; left:70%;  animation-duration:6.5s;animation-delay:3s;   bottom:-20px; }
  .bubble:nth-child(6)  { width:8px; height:8px;  left:82%;  animation-duration:7.5s;animation-delay:1.5s; bottom:-20px; }
  .bubble:nth-child(7)  { width:12px;height:12px; left:5%;   animation-duration:10s; animation-delay:4s;   bottom:-20px; }
  .bubble:nth-child(8)  { width:20px;height:20px; left:90%;  animation-duration:8.5s;animation-delay:2.5s; bottom:-20px; }
  .bubble:nth-child(9)  { width:7px; height:7px;  left:48%;  animation-duration:7s;  animation-delay:3.5s; bottom:-20px; }
  .bubble:nth-child(10) { width:13px;height:13px; left:33%;  animation-duration:9.5s;animation-delay:0.8s; bottom:-20px; }

  @keyframes floatUp {
    0%   { transform: translateY(0) translateX(0) scale(1);   opacity: 0; }
    10%  { opacity: 0.8; }
    50%  { transform: translateY(-50vh) translateX(15px) scale(1.05); }
    90%  { opacity: 0.4; }
    100% { transform: translateY(-105vh) translateX(-10px) scale(0.8); opacity: 0; }
  }

  .hero-content { position: relative; z-index: 2; }

  .hero-headline {
    font-family: 'Poppins', sans-serif;
    font-size: clamp(2.4rem, 8vw, 4.2rem);
    font-weight: 800;
    color: var(--navy);
    line-height: 1.1;
    letter-spacing: -0.5px;
    margin-bottom: 14px;
  }
  .hero-headline span { color: var(--light-navy); }

  .hero-sub {
    font-family: 'Inter', sans-serif;
    font-size: clamp(1rem, 3.5vw, 1.25rem);
    color: #1565C0;
    font-weight: 500;
    margin-bottom: 36px;
    opacity: 0.9;
  }

  .hero-btns {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 16px 30px;
    border-radius: 50px;
    font-family: 'Poppins', sans-serif;
    font-weight: 600;
    font-size: 1rem;
    text-decoration: none;
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
  }
  .btn:hover { transform: translateY(-3px); }

  .btn-primary {
    background: var(--navy);
    color: var(--white);
    box-shadow: 0 8px 24px rgba(13,71,161,0.35);
  }
  .btn-primary:hover { box-shadow: 0 12px 32px rgba(13,71,161,0.45); }

  .btn-secondary {
    background: var(--white);
    color: var(--navy);
    box-shadow: 0 8px 24px rgba(79,195,247,0.35);
    border: 2px solid rgba(79,195,247,0.5);
  }
  .btn-secondary:hover { box-shadow: 0 12px 32px rgba(79,195,247,0.5); }

  .scroll-hint {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    color: var(--navy);
    opacity: 0.5;
    font-size: 0.75rem;
    font-family: 'Inter', sans-serif;
    z-index: 2;
  }
  .scroll-arrow {
    width: 20px; height: 20px;
    border-right: 2.5px solid var(--navy);
    border-bottom: 2.5px solid var(--navy);
    transform: rotate(45deg);
    animation: bounce 1.6s infinite;
  }
  @keyframes bounce { 0%,100%{transform:rotate(45deg) translateY(0)} 50%{transform:rotate(45deg) translateY(5px)} }

  /* ─── SECTIONS SHARED ────────────────────────────── */
  section { padding: 80px 24px; }

  .section-inner {
    max-width: 900px;
    margin: 0 auto;
  }

  .section-tag {
    display: inline-block;
    background: var(--aqua);
    color: var(--navy);
    font-family: 'Poppins', sans-serif;
    font-size: 0.78rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    padding: 6px 16px;
    border-radius: 50px;
    margin-bottom: 16px;
  }

  .section-title {
    font-size: clamp(1.8rem, 5vw, 2.6rem);
    font-weight: 800;
    color: var(--navy);
    margin-bottom: 14px;
    line-height: 1.2;
  }

  .section-lead {
    font-size: 1.05rem;
    color: #546e7a;
    line-height: 1.7;
    max-width: 560px;
    margin-bottom: 48px;
  }

  /* fade-in */
  .fade-in {
    opacity: 0;
    transform: translateY(28px);
    transition: opacity 0.65s ease, transform 0.65s ease;
  }
  .fade-in.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* ─── SERVICES ─────────────────────────────────── */
  #services { background: var(--white); }
