<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ $json.name }} – Fresh. Fast. Easy.</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --sky: #4FC3F7;
    --aqua: #E0F7FA;
    --aqua-mid: #B2EBF2;
    --navy: #0D47A1;
    --navy-light: #1565C0;
    --white: #FFFFFF;
    --text: #1A237E;
    --text-body: #37474F;
    --shadow: 0 8px 32px rgba(79,195,247,0.18);
    --shadow-card: 0 4px 20px rgba(13,71,161,0.10);
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Inter', sans-serif;
    color: var(--text-body);
    background: var(--white);
    overflow-x: hidden;
  }

  h1, h2, h3, h4 {
    font-family: 'Poppins', sans-serif;
    color: var(--navy);
  }

  /* ========== HERO ========== */
  #hero {
    min-height: 100vh;
    background: linear-gradient(160deg, #E0F7FA 0%, #B2EBF2 40%, #81D4FA 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 20px 60px;
    position: relative;
    overflow: hidden;
  }

  /* Background circles decoration */
  #hero::before {
    content: '';
    position: absolute;
    top: -120px; right: -120px;
    width: 400px; height: 400px;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
    z-index: 0;
  }
  #hero::after {
    content: '';
    position: absolute;
    bottom: -80px; left: -80px;
    width: 300px; height: 300px;
    background: rgba(255,255,255,0.18);
    border-radius: 50%;
    z-index: 0;
  }

  .hero-content {
    position: relative;
    z-index: 2;
    max-width: 600px;
  }

  /* ---- Washing Machine Animation ---- */
  .washer-scene {
    position: relative;
    width: 180px;
    height: 200px;
    margin: 0 auto 32px;
  }

  .washer-body {
    position: absolute;
    bottom: 0; left: 50%;
    transform: translateX(-50%);
    width: 160px;
    height: 175px;
    background: linear-gradient(135deg, #FFFFFF 60%, #E3F2FD 100%);
    border-radius: 22px;
    box-shadow: 0 12px 40px rgba(79,195,247,0.35), inset 0 2px 6px rgba(255,255,255,0.8);
    border: 3px solid #B2EBF2;
  }

  .washer-top-bar {
    position: absolute;
    top: 14px; left: 50%;
    transform: translateX(-50%);
    width: 110px;
    height: 12px;
    background: linear-gradient(90deg, #81D4FA, #4FC3F7);
    border-radius: 6px;
  }

  .washer-dot {
    position: absolute;
    top: 14px;
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .washer-dot.d1 { right: 22px; background: #EF9A9A; }
  .washer-dot.d2 { right: 34px; background: #A5D6A7; }

  .drum-outer {
    position: absolute;
    bottom: 22px; left: 50%;
    transform: translateX(-50%);
    width: 116px; height: 116px;
    border-radius: 50%;
    background: linear-gradient(135deg, #E1F5FE, #B3E5FC);
    border: 4px solid #4FC3F7;
    box-shadow: inset 0 4px 16px rgba(79,195,247,0.3), 0 2px 8px rgba(79,195,247,0.2);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .drum-inner {
    width: 88px; height: 88px;
    border-radius: 50%;
    background: linear-gradient(135deg, #4FC3F7 0%, #0288D1 50%, #4FC3F7 100%);
    animation: spin 3s linear infinite;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .drum-inner::before,
  .drum-inner::after {
    content: '';
    position: absolute;
    background: rgba(255,255,255,0.25);
    border-radius: 50%;
  }
  .drum-inner::before { width: 26px; height: 26px; top: 10px; left: 14px; }
  .drum-inner::after  { width: 18px; height: 18px; bottom: 12px; right: 12px; }

  .drum-hole {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: rgba(255,255,255,0.35);
    border: 2px solid rgba(255,255,255,0.6);
  }

  /* Shirt shape inside drum */
  .clothes {
    position: absolute;
    bottom: 0; left: 0; right: 0; top: 0;
    border-radius: 50%;
    overflow: hidden;
    animation: spin 3s linear infinite;
    pointer-events: none;
  }
  .cloth-piece {
    position: absolute;
    border-radius: 6px;
    background: rgba(255,255,255,0.45);
  }
  .cloth-piece.c1 { width: 30px; height: 14px; top: 18px; left: 22px; transform: rotate(20deg); }
  .cloth-piece.c2 { width: 22px; height: 10px; bottom: 20px; right: 18px; transform: rotate(-15deg); }
  .cloth-piece.c3 { width: 16px; height: 18px; top: 38px; right: 14px; transform: rotate(40deg); border-radius: 50%; }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }

  /* Bubbles */
  .bubbles {
    position: absolute;
    left: 50%; top: 0;
    transform: translateX(-50%);
    width: 200px;
    height: 100%;
    pointer-events: none;
    z-index: 1;
  }

  .bubble {
    position: absolute;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.9), rgba(79,195,247,0.4));
    border: 1.5px solid rgba(255,255,255,0.7);
    animation: floatUp linear infinite;
    opacity: 0;
  }

  .bubble:nth-child(1)  { width:14px; height:14px; left:20%;  bottom:40%; animation-duration:3.2s; animation-delay:0s;    }
  .bubble:nth-child(2)  { width:9px;  height:9px;  left:55%;  bottom:35%; animation-duration:2.8s; animation-delay:0.6s;  }
  .bubble:nth-child(3)  { width:16px; height:16px; left:70%;  bottom:42%; animation-duration:3.6s; animation-delay:1.1s;  }
  .bubble:nth-child(4)  { width:7px;  height:7px;  left:35%;  bottom:30%; animation-duration:2.5s; animation-delay:1.7s;  }
  .bubble:nth-child(5)  { width:11px; height:11px; left:80%;  bottom:38%; animation-duration:3.0s; animation-delay:0.4s;  }
  .bubble:nth-child(6)  { width:8px;  height:8px;  left:10%;  bottom:45%; animation-duration:2.9s; animation-delay:1.4s;  }
  .bubble:nth-child(7)  { width:13px; height:13px; left:45%;  bottom:48%; animation-duration:3.4s; animation-delay:0.9s;  }
  .bubble:nth-child(8)  { width:6px;  height:6px;  left:62%;  bottom:52%; animation-duration:2.6s; animation-delay:2.0s;  }

  @keyframes floatUp {
    0%   { transform: translateY(0)   scale(1);   opacity: 0; }
    10%  { opacity: 0.85; }
    80%  { opacity: 0.6; }
    100% { transform: translateY(-180px) scale(0.6); opacity: 0; }
  }

  /* Steam puffs */
  .steam { position: absolute; top: -18px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; }
  .steam-puff {
    width: 10px; height: 10px;
    border-radius: 50%;
    background: rgba(255,255,255,0.7);
    animation: steamRise 2s ease-in-out infinite;
    opacity: 0;
  }
  .steam-puff:nth-child(2) { animation-delay: 0.5s; }
  .steam-puff:nth-child(3) { animation-delay: 1s; }
  @keyframes steamRise {
    0%   { transform: translateY(0)   scale(1);   opacity:0; }
    30%  { opacity: 0.7; }
    100% { transform: translateY(-30px) scale(2); opacity:0; }
  }

  /* Hero text */
  .hero-tag {
    display: inline-block;
    background: rgba(255,255,255,0.55);
    border: 1.5px solid rgba(255,255,255,0.8);
    border-radius: 50px;
    padding: 6px 18px;
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--navy);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 18px;
    backdrop-filter: blur(4px);
  }

  .hero-headline {
    font-size: clamp(2.4rem, 8vw, 4rem);
    font-weight: 900;
    line-height: 1.1;
    color: var(--navy);
    margin-bottom: 14px;
    letter-spacing: -0.02em;
  }

  .hero-headline span {
    background: linear-gradient(135deg, #0288D1, #4FC3F7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-sub {
    font-size: clamp(1rem, 3.5vw, 1.2rem);
    color: var(--navy-light);
    margin-bottom: 10px;
    font-weight: 600;
  }

  .hero-address {
    font-size: 0.9rem;
    color: #37474F;
    margin-bottom: 36px;
    opacity: 0.85;
  }

  .hero-btns {
    display: flex;
    gap: 14px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn-primary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: linear-gradient(135deg, #0288D1, #4FC3F7);
    color: #fff;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    padding: 15px 28px;
    border-radius: 50px;
    text-decoration: none;
    box-shadow: 0 6px 24px rgba(2,136,209,0.4);
    transition: transform 0.2s, box-shadow 0.2s;
    border: none;
    cursor: pointer;
  }
  .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(2,136,209,0.5); }

  .btn-secondary {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: rgba(255,255,255,0.85);
    color: var(--navy);
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 1rem;
    padding: 15px 28px;
    border-radius: 50px;
    text-decoration: none;
    box-shadow: 0 6px 20px rgba(13,71,161,0.12);
    transition: transform 0.2s, box-shadow 0.2s;
    border: 2px solid rgba(79,195,247,0.5);
    backdrop-filter: blur(4px);
  }
  .btn-secondary:hover { transform: translateY(-2px); box-shadow: 0 10px 28px rgba(13,71,161,0.18); }

  .scroll-hint {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    opacity: 0.5;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--navy);
    font-family: 'Poppins', sans-serif;
    z-index: 2;
  }
  .scroll-arrow {
    width: 20px; height: 20px;
    border-right: 2px solid var(--navy);
