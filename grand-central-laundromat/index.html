<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ $json.name }} – Fresh. Fast. Easy.</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --sky: #4FC3F7;
      --aqua: #E0F7FA;
      --navy: #0D47A1;
      --navy-light: #1565C0;
      --white: #FFFFFF;
      --soft-gray: #F0FBFF;
      --shadow: 0 8px 32px rgba(13,71,161,0.10);
      --shadow-hover: 0 16px 48px rgba(13,71,161,0.18);
    }

    html { scroll-behavior: smooth; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--white);
      color: var(--navy);
      overflow-x: hidden;
    }

    h1, h2, h3, h4 { font-family: 'Poppins', sans-serif; }

    /* ─── HERO ─────────────────────────────────────────── */
    .hero {
      min-height: 100vh;
      background: linear-gradient(160deg, #E0F7FA 0%, #B3E5FC 40%, #81D4FA 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem 3rem;
      position: relative;
      overflow: hidden;
      text-align: center;
    }

    /* Background blur circles */
    .hero::before {
      content: '';
      position: absolute;
      width: 500px; height: 500px;
      background: rgba(255,255,255,0.25);
      border-radius: 50%;
      top: -150px; right: -150px;
      pointer-events: none;
    }
    .hero::after {
      content: '';
      position: absolute;
      width: 350px; height: 350px;
      background: rgba(79,195,247,0.2);
      border-radius: 50%;
      bottom: -100px; left: -100px;
      pointer-events: none;
    }

    /* ── Washing Machine ── */
    .machine-wrap {
      position: relative;
      width: 180px;
      height: 200px;
      margin-bottom: 2rem;
      filter: drop-shadow(0 12px 24px rgba(13,71,161,0.15));
    }

    .machine-body {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 160px;
      height: 170px;
      background: linear-gradient(160deg, #ffffff 60%, #e3f2fd 100%);
      border-radius: 18px;
      border: 3px solid rgba(79,195,247,0.5);
      box-shadow: inset 0 4px 12px rgba(79,195,247,0.15);
    }

    /* control panel strip */
    .machine-panel {
      position: absolute;
      top: 12px; left: 12px; right: 12px;
      height: 28px;
      background: linear-gradient(90deg, #4FC3F7, #81D4FA);
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
    }
    .panel-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.8);
    }
    .panel-dial {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: white;
      margin-left: auto;
      border: 2px solid rgba(79,195,247,0.6);
    }

    /* porthole */
    .porthole-ring {
      position: absolute;
      top: 52px; left: 50%;
      transform: translateX(-50%);
      width: 100px; height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #B3E5FC 0%, #4FC3F7 100%);
      border: 5px solid #29B6F6;
      display: flex; align-items: center; justify-content: center;
      box-shadow: inset 0 4px 16px rgba(0,0,0,0.12), 0 4px 12px rgba(79,195,247,0.3);
    }

    .porthole-inner {
      width: 78px; height: 78px;
      border-radius: 50%;
      background: linear-gradient(135deg, #0277BD 0%, #0288D1 50%, #03A9F4 100%);
      overflow: hidden;
      position: relative;
      animation: drumSpin 3s linear infinite;
    }

    @keyframes drumSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .drum-line {
      position: absolute;
      top: 50%; left: 10%;
      width: 80%;
      height: 2px;
      background: rgba(255,255,255,0.25);
      border-radius: 2px;
      transform-origin: center;
    }
    .drum-line:nth-child(1) { transform: translateY(-50%) rotate(0deg); }
    .drum-line:nth-child(2) { transform: translateY(-50%) rotate(60deg); }
    .drum-line:nth-child(3) { transform: translateY(-50%) rotate(120deg); }

    /* clothes shapes inside drum */
    .drum-cloth {
      position: absolute;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      opacity: 0.5;
    }
    .drum-cloth:nth-child(4) {
      width: 36px; height: 28px;
      background: rgba(255,255,255,0.7);
      top: 10px; left: 12px;
    }
    .drum-cloth:nth-child(5) {
      width: 28px; height: 22px;
      background: rgba(179,229,252,0.8);
      bottom: 12px; right: 10px;
    }

    /* door handle */
    .machine-handle {
      position: absolute;
      bottom: 14px; left: 50%;
      transform: translateX(-50%);
      width: 36px; height: 8px;
      background: #29B6F6;
      border-radius: 4px;
    }

    /* feet */
    .machine-foot {
      position: absolute;
      bottom: -8px;
      width: 20px; height: 10px;
      background: #B0BEC5;
      border-radius: 0 0 6px 6px;
    }
    .machine-foot.left  { left: 20px; }
    .machine-foot.right { right: 20px; }

    /* ── Bubbles ── */
    .bubbles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.55);
      border: 1.5px solid rgba(255,255,255,0.8);
      animation: floatUp linear infinite;
    }
    .bubble:nth-child(1)  { width:14px; height:14px; left:15%; bottom:-30px; animation-duration:5s;  animation-delay:0s;   }
    .bubble:nth-child(2)  { width:10px; height:10px; left:25%; bottom:-30px; animation-duration:6s;  animation-delay:1s;   }
    .bubble:nth-child(3)  { width:18px; height:18px; left:40%; bottom:-30px; animation-duration:7s;  animation-delay:2s;   }
    .bubble:nth-child(4)  { width:8px;  height:8px;  left:55%; bottom:-30px; animation-duration:5.5s;animation-delay:0.5s; }
    .bubble:nth-child(5)  { width:12px; height:12px; left:70%; bottom:-30px; animation-duration:6.5s;animation-delay:1.5s; }
    .bubble:nth-child(6)  { width:16px; height:16px; left:82%; bottom:-30px; animation-duration:7.5s;animation-delay:3s;   }
    .bubble:nth-child(7)  { width:9px;  height:9px;  left:8%;  bottom:-30px; animation-duration:6s;  animation-delay:2.5s; }
    .bubble:nth-child(8)  { width:13px; height:13px; left:90%; bottom:-30px; animation-duration:5s;  animation-delay:4s;   }
    .bubble:nth-child(9)  { width:11px; height:11px; left:33%; bottom:-30px; animation-duration:8s;  animation-delay:1.2s; }
    .bubble:nth-child(10) { width:15px; height:15px; left:60%; bottom:-30px; animation-duration:6.8s;animation-delay:3.5s; }

    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1);   opacity: 0.7; }
      50%  { transform: translateY(-40vh) scale(1.1); opacity: 0.5; }
      100% { transform: translateY(-100vh) scale(0.8); opacity: 0; }
    }

    /* ── Hero Text ── */
    .hero-content { position: relative; z-index: 2; }

    .hero-headline {
      font-size: clamp(2.4rem, 8vw, 4rem);
      font-weight: 800;
      color: var(--navy);
      line-height: 1.1;
      letter-spacing: -0.5px;
      margin-bottom: 0.75rem;
    }

    .hero-sub {
      font-size: clamp(1rem, 3vw, 1.25rem);
      font-weight: 500;
      color: var(--navy-light);
      margin-bottom: 2rem;
      opacity: 0.85;
    }

    .hero-ctas {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.9rem 1.8rem;
      border-radius: 50px;
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: 1rem;
      text-decoration: none;
      cursor: pointer;
      border: none;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn:hover { transform: translateY(-3px); box-shadow: var(--shadow-hover); }
    .btn:active { transform: translateY(0); }

    .btn-primary {
      background: var(--navy);
      color: var(--white);
      box-shadow: 0 6px 20px rgba(13,71,161,0.3);
    }
    .btn-secondary {
      background: var(--white);
      color: var(--navy);
      box-shadow: 0 6px 20px rgba(13,71,161,0.15);
    }

    /* ── Scroll hint ── */
    .scroll-hint {
      position: absolute;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      color: var(--navy-light);
      font-size: 0.75rem;
      font-family: 'Inter', sans-serif;
      opacity: 0.6;
      animation: bounce 2s ease-in-out infinite;
      z-index: 2;
    }
    .scroll-hint svg { width: 20px; height: 20px; stroke: var(--navy-light); fill: none; stroke-width: 2; }
    @keyframes bounce {
      0%,100% { transform: translateX(-50%) translateY(0); }
      50%      { transform: translateX(-50%) translateY(6px); }
    }

    /* ─── SECTIONS SHARED ──────────────────────────────── */
    section { padding: 4.5rem 1.5rem; }
    .section-inner { max-width: 700px; margin: 0 auto; }

    .section-label {
      display: inline-block;
      background: var(--aqua);
      color: var(--navy);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 0.3rem 0.9rem;
      border-radius: 50px;
      margin-bottom: 0.9rem;
    }

    .section-title {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 700;
      color: var(--navy);
      line-height: 1.2;
      margin-bottom: 1rem;
    }

    .section-sub {
      font-size: 1rem;
      color: #4a6fa5;
      line-height: 1.7;
      margin-bottom: 2rem;
    }

    /* fade-in on scroll */
    .fade-up {
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }
    .fade-up.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .fade-up:nth-child(2) { transition-delay: 0.1s; }
    .fade-up:nth-child(3) { transition-delay: 0.2s; }
    .fade-up:nth-child(4) { transition-delay: 0.3s; }

    /* ─── SERVICES ─────────────────────────────────────── */
    .services { background: var(--white); }

    .services-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
